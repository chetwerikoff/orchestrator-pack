name: Issue 1283 review fixes

on:
  push:
    branches:
      - agent/issue-1283-browser-turn-recovery
    paths:
      - scripts/apply-1283-review-fixes.ready

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1283-browser-turn-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and publish reviewer fixes
        shell: bash
        run: |
          cat scripts/apply-1283-review-fixes.part*.py > /tmp/apply-1283-review-fixes.py
          python /tmp/apply-1283-review-fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/apply-1283-review-fixes.part*.py scripts/apply-1283-review-fixes.ready .github/workflows/issue-1283-review-fixes.yml
          git add -A
          git commit -m "fix(browser-turn): enforce owned cancellation handshakes"
          git push origin HEAD:agent/issue-1283-browser-turn-recovery
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck:foundation
      - name: Lint
        run: npm run lint:foundation
      - name: Targeted tests
        run: >-
          npx vitest run --config scripts/toolchain/vitest-foundation.config.ts
          scripts/chatgpt-browser-turn/state-light-cancellation.test.ts
          scripts/chatgpt-browser-turn/tab-lifecycle.test.ts
          scripts/flow-manager-long-running-child.test.ts
          scripts/toolchain/chatgpt-browser-turn.review-fixes.test.ts
