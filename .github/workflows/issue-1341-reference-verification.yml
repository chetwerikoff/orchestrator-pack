name: issue-1341-reference-verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1341-operator-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind operator adjudication to the live published reference
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          source = Path('scripts/lib/create-issue-stage-record-artifacts.ts')
          text = source.read_text()
          text = replace_once(
              text,
              "import { checkFindingLedgerGuard } from '../finding-ledger-guard.mjs';\n",
              "import { checkFindingLedgerGuard } from '../finding-ledger-guard.mjs';\nimport { defaultGhTransport } from './create-issue-stage-record-gh.ts';\nimport type { GhTransport } from './create-issue-stage-record-types.ts';\n",
              'artifact imports',
          )
          text = replace_once(
              text,
              "  operatorAdjudication?: OperatorAcceptanceAdjudication;\n}",
              "  operatorAdjudication?: OperatorAcceptanceAdjudication;\n  operatorReferenceTransport?: GhTransport;\n}",
              'artifact options',
          )
          text = replace_once(
              text,
              "interface NormalizedOperatorAcceptanceAdjudication extends OperatorAcceptanceAdjudication {\n  repositoryFullName: string;\n  commentId: string;\n}",
              "interface NormalizedOperatorAcceptanceAdjudication extends OperatorAcceptanceAdjudication {\n  repositoryFullName: string;\n  commentId: string;\n  authoritativeBody: string;\n  createdAt: string;\n  updatedAt: string;\n  authorLogin: string;\n  authorAssociation: string;\n}",
              'normalized adjudication',
          )
          start = text.index('function normalizeOperatorAcceptanceAdjudication(')
          end = text.index('\nfunction applyOperatorAcceptanceAdjudication(', start)
          replacement = r'''function normalizeOperatorAcceptanceAdjudication(
  value: OperatorAcceptanceAdjudication | undefined,
  phase: ProduceAcceptanceArtifactsOptions['phase'],
  transport: GhTransport | undefined,
  errors: string[],
): NormalizedOperatorAcceptanceAdjudication | null {
  if (!value) return null;
  const errorCountBefore = errors.length;
  if ((phase ?? 'final-acceptance') !== 'final-acceptance') {
    errors.push('operator adjudication is valid only for final-acceptance artifact production');
  }
  const issueNumber = Number(value.issueNumber);
  const sourceRevision = String(value.sourceRevision ?? '').trim();
  const verdictUrl = String(value.verdictUrl ?? '').trim();
  const verdictSha256 = String(value.verdictSha256 ?? '').trim().toLowerCase();
  const verdictByteLength = Number(value.verdictByteLength);
  const verdictFindingCount = Number(value.verdictFindingCount);
  const reason = String(value.reason ?? '').trim();
  if (!Number.isInteger(issueNumber) || issueNumber < 1) errors.push('operator adjudication issueNumber must be positive');
  if (!/^r[0-9]+$/.test(sourceRevision)) errors.push('operator adjudication sourceRevision must be rNN');
  if (!/^[0-9a-f]{64}$/.test(verdictSha256)) errors.push('operator adjudication verdictSha256 must be 64 lowercase hex characters');
  if (!Number.isInteger(verdictByteLength) || verdictByteLength < 0) errors.push('operator adjudication verdictByteLength must be non-negative');
  if (!Number.isInteger(verdictFindingCount) || verdictFindingCount < 0) errors.push('operator adjudication verdictFindingCount must be non-negative');
  if (!reason) errors.push('operator adjudication reason must be non-empty');
  const match = /^https:\/\/github\.com\/([^/\s]+\/[^/\s]+)\/issues\/([1-9][0-9]*)#issuecomment-([1-9][0-9]*)$/.exec(verdictUrl);
  if (!match) errors.push('operator adjudication verdictUrl must be a canonical published Issue comment URL');
  else if (Number(match[2]) !== issueNumber) errors.push('operator adjudication verdictUrl Issue does not match issueNumber');
  if (errors.length !== errorCountBefore || !match) return null;
  if (!transport) {
    errors.push('operator adjudication published verdict transport is unavailable');
    return null;
  }

  const repositoryFullName = match[1]!;
  const commentId = match[3]!;
  const response = transport.runGh([
    'gh',
    'api',
    `repos/${repositoryFullName}/issues/comments/${commentId}`,
  ]);
  if (response.exitCode !== 0) {
    errors.push('operator adjudication published verdict reference is unavailable');
    return null;
  }
  let observed: unknown;
  try {
    observed = JSON.parse(response.stdout) as unknown;
  } catch {
    errors.push('operator adjudication published verdict reference is malformed');
    return null;
  }
  if (!isRecord(observed)) {
    errors.push('operator adjudication published verdict reference is incompletely observed');
    return null;
  }
  const observedId = Number(observed.id);
  const observedUrl = typeof observed.html_url === 'string' ? observed.html_url : '';
  const observedIssueUrl = typeof observed.issue_url === 'string' ? observed.issue_url : '';
  const authoritativeBody = typeof observed.body === 'string' ? observed.body : '';
  const createdAt = typeof observed.created_at === 'string' ? observed.created_at : '';
  const updatedAt = typeof observed.updated_at === 'string' ? observed.updated_at : '';
  const user = isRecord(observed.user) ? observed.user : null;
  const authorLogin = typeof user?.login === 'string' ? user.login : '';
  const authorAssociation = typeof observed.author_association === 'string' ? observed.author_association : '';
  if (
    !Number.isInteger(observedId)
    || !observedUrl
    || !observedIssueUrl
    || !authoritativeBody
    || !createdAt
    || !updatedAt
    || !authorLogin
    || !authorAssociation
  ) {
    errors.push('operator adjudication published verdict reference is incompletely observed');
    return null;
  }
  const expectedIssueUrl = `https://api.github.com/repos/${repositoryFullName}/issues/${issueNumber}`;
  if (observedId !== Number(commentId) || observedUrl !== verdictUrl || observedIssueUrl !== expectedIssueUrl) {
    errors.push('operator adjudication published verdict reference identity is mismatched');
  }
  if (updatedAt !== createdAt) {
    errors.push('operator adjudication published verdict reference was edited');
  }
  const parsed = parseCanonicalCaptureRevision(authoritativeBody);
  if (!parsed) {
    errors.push('operator adjudication published verdict has no unique canonical revision declaration');
  } else {
    if (parsed.issueNumber !== issueNumber) errors.push('operator adjudication published verdict Issue is mismatched');
    if (parsed.sourceRevision !== sourceRevision) errors.push('operator adjudication published verdict revision is mismatched');
    if (parsed.findingCount !== verdictFindingCount) errors.push('operator adjudication published verdict finding count is mismatched');
  }
  const observedSha256 = createHash('sha256').update(authoritativeBody).digest('hex');
  if (observedSha256 !== verdictSha256) errors.push('operator adjudication published verdict SHA-256 is mismatched');
  if (Buffer.byteLength(authoritativeBody) !== verdictByteLength) errors.push('operator adjudication published verdict byte length is mismatched');
  if (rawFindingCount(authoritativeBody) !== verdictFindingCount) errors.push('operator adjudication published verdict finding count is mismatched');
  if (errors.length !== errorCountBefore) return null;
  return {
    issueNumber,
    sourceRevision,
    verdictUrl,
    verdictSha256,
    verdictByteLength,
    verdictFindingCount,
    reason,
    repositoryFullName,
    commentId,
    authoritativeBody,
    createdAt,
    updatedAt,
    authorLogin,
    authorAssociation,
  };
}
'''
          text = text[:start] + replacement + text[end:]
          text = replace_once(
              text,
              "    capture.sha256 !== adjudication.verdictSha256\n    || capture.byteLength !== adjudication.verdictByteLength\n    || capture.rawFindingCount !== adjudication.verdictFindingCount\n",
              "    capture.sha256 !== adjudication.verdictSha256\n    || capture.byteLength !== adjudication.verdictByteLength\n    || capture.rawFindingCount !== adjudication.verdictFindingCount\n    || captureText !== adjudication.authoritativeBody\n",
              'exact body comparison',
          )
          text = replace_once(
              text,
              "    options.operatorAdjudication,\n    options.phase,\n    errors,\n",
              "    options.operatorAdjudication,\n    options.phase,\n    options.operatorAdjudication ? options.operatorReferenceTransport ?? defaultGhTransport() : undefined,\n    errors,\n",
              'producer reference transport',
          )
          text = replace_once(
              text,
              "    options.operatorAdjudication,\n    options.phase,\n    operatorErrors,\n",
              "    options.operatorAdjudication,\n    options.phase,\n    options.operatorAdjudication ? options.operatorReferenceTransport ?? defaultGhTransport() : undefined,\n    operatorErrors,\n",
              'inspector reference transport',
          )
          text = replace_once(
              text,
              "commentId: operatorContext.adjudication.commentId,\nsha256: operatorContext.adjudication.verdictSha256,\nbyteLength: operatorContext.adjudication.verdictByteLength,\nfindingCount: operatorContext.adjudication.verdictFindingCount,\n",
              "commentId: operatorContext.adjudication.commentId,\nsha256: operatorContext.adjudication.verdictSha256,\nbyteLength: operatorContext.adjudication.verdictByteLength,\nfindingCount: operatorContext.adjudication.verdictFindingCount,\ncreatedAt: operatorContext.adjudication.createdAt,\nupdatedAt: operatorContext.adjudication.updatedAt,\nauthorLogin: operatorContext.adjudication.authorLogin,\nauthorAssociation: operatorContext.adjudication.authorAssociation,\n",
              'manifest observed reference',
          )
          source.write_text(text)

          tests = Path('scripts/lib/create-issue-stage-record-artifacts.test.ts')
          text = tests.read_text()
          adjudication_anchor = """  function adjudication(capture: string) {
    return {
      issueNumber: 1192,
      sourceRevision: 'r01',
      verdictUrl: 'https://github.com/chetwerikoff/orchestrator-pack/issues/1192#issuecomment-5194504082',
      verdictSha256: createHash('sha256').update(capture).digest('hex'),
      verdictByteLength: Buffer.byteLength(capture),
      verdictFindingCount: 0,
      reason: 'operator confirmed the already-published exact terminal verdict',
    };
  }
"""
          adjudication_replacement = adjudication_anchor + r'''
  function referenceTransport(
    capture: string,
    overrides: Record<string, unknown> = {},
    exitCode = 0,
  ) {
    return {
      runGh(argv: string[]) {
        expect(argv).toEqual([
          'gh',
          'api',
          'repos/chetwerikoff/orchestrator-pack/issues/comments/5194504082',
        ]);
        return {
          exitCode,
          stderr: exitCode === 0 ? '' : 'not found',
          stdout: exitCode === 0 ? JSON.stringify({
            id: 5194504082,
            html_url: 'https://github.com/chetwerikoff/orchestrator-pack/issues/1192#issuecomment-5194504082',
            issue_url: 'https://api.github.com/repos/chetwerikoff/orchestrator-pack/issues/1192',
            body: capture,
            created_at: '2026-08-05T15:00:00Z',
            updated_at: '2026-08-05T15:00:00Z',
            user: { login: 'chetwerikoff' },
            author_association: 'OWNER',
            ...overrides,
          }) : '',
        };
      },
    };
  }
'''
          text = replace_once(text, adjudication_anchor, adjudication_replacement, 'test reference transport helper')
          text = replace_once(
              text,
              "        operatorAdjudication: adjudication(capture),\n",
              "        operatorAdjudication: adjudication(capture),\n        operatorReferenceTransport: referenceTransport(capture),\n",
              'valid operator reference transport',
          )
          text = replace_once(
              text,
              "      operatorAdjudication: { ...adjudication(capture), verdictSha256: '0'.repeat(64) },\n",
              "      operatorAdjudication: { ...adjudication(capture), verdictSha256: '0'.repeat(64) },\n      operatorReferenceTransport: referenceTransport(capture),\n",
              'mismatch operator reference transport',
          )
          closing = """  it('rejects a byte/hash mismatch before artifact publication', () => {
"""
          if closing not in text:
              raise SystemExit('operator test block anchor missing')
          extra = r'''
  for (const scenario of [
    {
      name: 'edited published reference',
      transport: (capture: string) => referenceTransport(capture, { updated_at: '2026-08-05T15:01:00Z' }),
      error: 'was edited',
    },
    {
      name: 'unavailable published reference',
      transport: (capture: string) => referenceTransport(capture, {}, 1),
      error: 'is unavailable',
    },
    {
      name: 'incompletely observed published reference',
      transport: (capture: string) => referenceTransport(capture, { author_association: undefined }),
      error: 'is incompletely observed',
    },
    {
      name: 'published bytes that differ from the governed capture',
      transport: (capture: string) => referenceTransport(`${capture}edited`),
      error: 'SHA-256 is mismatched',
    },
  ]) {
    it(`rejects ${scenario.name} before artifact publication`, () => {
      const input = fixture();
      const capture = governedCapture();
      writeFileSync(input.capturePath, capture);
      const evidence = JSON.parse(readFileSync(input.stageEvidencePath, 'utf8'));
      delete evidence.invocations[0].turnResultPath;
      writeFileSync(input.stageEvidencePath, JSON.stringify(evidence));
      const outputDir = join(input.dir, `operator-reference-${scenario.name.replaceAll(' ', '-')}`);
      const result = produceAcceptanceArtifacts({
        reviewDir: input.dir,
        outputDir,
        tierIntakePath: input.intakePath,
        stageEvidencePaths: [input.stageEvidencePath],
        authorDispositionsPath: input.authorPath,
        phase: 'final-acceptance',
        operatorAdjudication: adjudication(capture),
        operatorReferenceTransport: scenario.transport(capture),
      });
      expect(result.ok).toBe(false);
      expect(result.errors.join('\n')).toContain(scenario.error);
      expect(existsSync(join(outputDir, 'acceptance-artifacts.json'))).toBe(false);
    });
  }

'''
          text = text.replace(closing, extra + closing, 1)
          tests.write_text(text)

          docs = Path('docs/create-issue-draft-acceptance-artifacts.md')
          text = docs.read_text()
          text = replace_once(
              text,
              "those values exactly match one governed terminal capture and that invocation's\n`turn-result/v1` is absent or non-`ok`.\n",
              "those values exactly match one governed terminal capture and that invocation's\n`turn-result/v1` is absent or non-`ok`. Before accepting, the canonical GitHub\ntransport reads the exact referenced comment and rejects an unavailable, edited,\nidentity-mismatched, malformed, or incompletely observed reference. The observed\ncomment bytes must exactly equal the governed capture bytes.\n",
              'operator reference docs',
          )
          docs.write_text(text)
          PY
          git add scripts/lib/create-issue-stage-record-artifacts.ts scripts/lib/create-issue-stage-record-artifacts.test.ts docs/create-issue-draft-acceptance-artifacts.md
          git commit -m "fix: verify published operator verdict reference"
      - name: Verify focused contract and scope
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run check:node-major --silent
          node scripts/run-vitest-with-harness.mjs run --maxWorkers=1 scripts/pack-review-runner-gpt.test.ts scripts/lib/create-issue-stage-record-artifacts.test.ts scripts/lib/create-issue-stage-record.test.ts
          npm run typecheck:foundation
          npm run lint:foundation
          node --experimental-strip-types scripts/pr-scope-declaration.ts --issue 1341 --declared-paths scripts/pack-review-runner.ts,scripts/pack-review-runner-gpt.test.ts,scripts/lib/create-issue-stage-record-cli.ts,scripts/lib/create-issue-stage-record-artifacts.ts,scripts/lib/create-issue-stage-record-artifacts.test.ts,docs/create-issue-draft-acceptance-artifacts.md,.claude/skills/create-issue-draft/SKILL.md
          git add docs/declarations/1341.pr-scope.json
          git commit -m "chore: refresh issue 1341 scope declaration"
      - name: Remove bootstrap and push
        shell: bash
        run: |
          git rm .github/workflows/issue-1341-reference-verification.yml
          git commit -m "chore: remove reference verification bootstrap"
          git push origin HEAD:agent/issue-1341-operator-inputs
