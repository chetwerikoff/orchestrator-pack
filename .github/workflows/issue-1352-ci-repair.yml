name: Issue 1352 worktree export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-worktree:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
      - name: Archive exact branch worktree
        shell: bash
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/issue-1352-worktree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1352-worktree
          path: /tmp/issue-1352-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
