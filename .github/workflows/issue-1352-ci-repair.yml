name: Issue 1352 base export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-base:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9782532ce8aa6c6a173212da17753e832c65b844
          fetch-depth: 0
      - name: Archive current base git database
        shell: bash
        run: tar -czf /tmp/issue-1352-base-git.tar.gz .git
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1352-base-git
          path: /tmp/issue-1352-base-git.tar.gz
          if-no-files-found: error
          retention-days: 1
