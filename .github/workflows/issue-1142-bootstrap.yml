name: issue-1142-bootstrap

on:
  push:
    branches:
      - agent/issue-1142-tiering-calibration

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Materialize scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-1142-bootstrap/chunk-*.txt | base64 -d | gzip -d > /tmp/issue1142-bootstrap.py
          python /tmp/issue1142-bootstrap.py
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Node preflight
        run: npm run check:node-major
      - name: Focused tests
        run: npm test -- scripts/tier-gate-guard.test.ts scripts/tiering-*.test.ts
      - name: Foundation typecheck
        run: npm run typecheck:foundation
      - name: Full TypeScript typecheck
        run: npx tsc --project tsconfig.base.json --noEmit
      - name: Repository verification
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Reusable-content verification
        shell: pwsh
        run: ./scripts/check-reusable.ps1
      - name: Commit scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/issue-1142-bootstrap .github/workflows/issue-1142-bootstrap.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json docs/tiering.md docs/tiering-calibration.md .claude/skills/create-issue-draft/SKILL.md scripts/lib/tier-gate-core.ts scripts/tier-gate-guard.test.ts scripts/tiering-*.ts .github/workflows/scope-guard.yml .github/workflows/issue-1142-bootstrap.yml .github/issue-1142-bootstrap
          git diff --cached --check
          git commit -m 'feat(tiering): calibrate intake correction and L4 (#1142)'
          git push origin HEAD:agent/issue-1142-tiering-calibration
