name: issue-1352-scope-regenerate

on:
  push:
    branches:
      - agent/issue-1352-hard-cut

permissions:
  contents: write
  issues: read

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate canonical Issue 1352 declaration
        run: >-
          node --experimental-strip-types scripts/pr-scope-declaration.ts
          --issue 1352
          --declared-prefixes '.github/workflows/**,.claude/skills/**,.cursor/rules/**,.cursor/skills/**,docs/**,plugins/**,prompts/**,scripts/**'
          --declared-paths 'AGENTS.md,CLAUDE.md,README.md,agent-orchestrator.yaml.example,package-lock.json,package.json,tests/powershell/Issue748.RefreshConcurrency.Tests.ps1,tests/powershell/Issue748.WorkerStatusPopulation.Tests.ps1,tests/powershell/Issue771.PowerShellDependencyScope.Tests.ps1,tests/powershell/Lint-SelfArchitect.Tests.ps1'
      - name: Commit declaration only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/declarations/1352.pr-scope.json
          if git diff --cached --quiet; then
            echo 'declaration unchanged'
            exit 0
          fi
          git commit -m 'Regenerate Issue 1352 scope declaration'
          git push origin HEAD:agent/issue-1352-hard-cut
