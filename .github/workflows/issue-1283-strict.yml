name: issue-1283-strict

on:
  push:
    branches:
      - agent/issue-1283-browser-turn-recovery

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1283-browser-turn-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply strict census fix
        run: |
          python3 - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path

          encoded = Path('.github/issue-1283-strict/part-001.txt').read_text().strip()
          payload = json.loads(zlib.decompress(base64.b64decode(encoded)).decode())

          def decode(value: str) -> str:
              return base64.b64decode(value).decode()

          for item in payload['replacements']:
              path = Path(item['path'])
              text = path.read_text()
              old = decode(item['old'])
              new = decode(item['new'])
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement count {count} for {path}')
              path.write_text(text.replace(old, new, 1))

          for raw_path, value in payload['appends'].items():
              path = Path(raw_path)
              addition = decode(value)
              text = path.read_text()
              if addition.strip() not in text:
                  path.write_text(text.rstrip() + '\n' + addition)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          git diff --check
          npm run check:node-major --silent
          npm test -- --maxWorkers=1 scripts/toolchain/chatgpt-browser-turn.review-fixes.test.ts scripts/chatgpt-browser-turn/state-light-turn.test-support.ts
          npm run typecheck:foundation
          npm run lint:foundation
      - name: Repository verification
        shell: pwsh
        run: |
          ./scripts/verify.ps1
          ./scripts/check-reusable.ps1
      - name: Publish verified strict census fix
        run: |
          rm -rf .github/issue-1283-strict
          rm .github/workflows/issue-1283-strict.yml
          git diff --check
          git config user.name "orchestrator-pack implementation bot"
          git config user.email "85295154+chetwerikoff@users.noreply.github.com"
          git add -A
          git commit -m "fix: fail closed on incomplete recovery transcript reads"
          git push origin HEAD:agent/issue-1283-browser-turn-recovery
