name: issue-1419-post-port-evidence

on:
  push:
    branches:
      - ci/issue-1419-post-port-evidence

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: fcedf8e2e4a8a74d5ac083ac64bc5b4b48942c3b
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Produce exact-head blocker census
        env:
          MEASURED_HEAD: fcedf8e2e4a8a74d5ac083ac64bc5b4b48942c3b
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { producePortStageEvidence, verifyEvidenceIntegrity } from './scripts/port-stage-evidence/producer.ts';
          const evidence = await producePortStageEvidence({
            repoRoot: process.cwd(),
            artifactRole: 'post-port',
            measuredHead: process.env.MEASURED_HEAD,
            producerRevision: process.env.MEASURED_HEAD,
          });
          verifyEvidenceIntegrity(evidence);
          const currentEntries = evidence.entries.filter((entry) => entry.currentPrescriptive);
          const payload = {
            measuredHead: evidence.measuredHead,
            broaderStatusClosed: evidence.broaderStatusClosed,
            dormantRetainedCoverageComplete: evidence.dormantRetainedCoverageComplete,
            currentSources: [...new Set(currentEntries.filter((entry) => entry.sourceKind !== 'tracked-ps1-file').map((entry) => entry.occurrence.sourcePath))].sort(),
            currentTargets: [...new Set(currentEntries.filter((entry) => entry.sourceKind === 'tracked-ps1-file').map((entry) => entry.occurrence.sourcePath))].sort(),
            dormantTargets: [...new Set(evidence.entries.filter((entry) => entry.sourceKind === 'tracked-ps1-file' && !entry.currentPrescriptive && !entry.historicalDisposition).map((entry) => entry.occurrence.sourcePath))].sort(),
            unclassifiedPowerShellSurfaces: evidence.unclassifiedPowerShellSurfaces,
            unresolvedCurrentPrescriptiveScriptTargets: evidence.unresolvedCurrentPrescriptiveScriptTargets,
          };
          fs.writeFileSync('/tmp/post-port-blockers.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
      - name: Publish census on diagnostic branch
        env:
          TARGET_BRANCH: ci/issue-1419-post-port-evidence
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          cp /tmp/post-port-blockers.json post-port-blockers.json
          git config user.name "orchestrator-pack diagnostics"
          git config user.email "85295154+chetwerikoff@users.noreply.github.com"
          git add post-port-blockers.json
          git commit --no-gpg-sign -m "ci: capture issue 1419 blocker census" || exit 0
          git push origin "HEAD:$TARGET_BRANCH"
