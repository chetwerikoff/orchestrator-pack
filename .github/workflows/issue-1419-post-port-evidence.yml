name: issue-1419-post-port-source-summary

on:
  push:
    branches:
      - ci/issue-1419-post-port-evidence

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80abf40e73417ee4dcdf1268fd21aca511e11968
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Build producer-native source summary
        env:
          MEASURED_HEAD: 80abf40e73417ee4dcdf1268fd21aca511e11968
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { producePortStageEvidence, verifyEvidenceIntegrity } from './scripts/port-stage-evidence/producer.ts';
          const evidence = await producePortStageEvidence({
            repoRoot: process.cwd(),
            artifactRole: 'post-port',
            measuredHead: process.env.MEASURED_HEAD,
            producerRevision: process.env.MEASURED_HEAD,
          });
          verifyEvidenceIntegrity(evidence);
          const bySource = new Map();
          for (const entry of evidence.entries.filter((entry) => entry.currentPrescriptive)) {
            const path = entry.occurrence.sourcePath;
            if (entry.sourceKind === 'tracked-ps1-file') continue;
            const row = bySource.get(path) ?? { path, sourceKinds: new Set(), runtimeTokens: 0, scriptTokens: 0, resolvedTargets: new Set(), unresolvedScriptTokens: 0, samples: [] };
            row.sourceKinds.add(entry.sourceKind);
            if (entry.occurrence.tokenKind === 'runtime') row.runtimeTokens += 1;
            if (entry.occurrence.tokenKind === 'script') row.scriptTokens += 1;
            if (entry.resolvedScriptPath) row.resolvedTargets.add(entry.resolvedScriptPath);
            else if (entry.occurrence.tokenKind === 'script') row.unresolvedScriptTokens += 1;
            if (row.samples.length < 8) row.samples.push({
              line: entry.occurrence.line,
              tokenKind: entry.occurrence.tokenKind,
              matchedBytes: entry.occurrence.matchedBytes,
              sourceKind: entry.sourceKind,
              resolvedScriptPath: entry.resolvedScriptPath ?? null,
            });
            bySource.set(path, row);
          }
          const sources = [...bySource.values()].map((row) => ({
            ...row,
            sourceKinds: [...row.sourceKinds].sort(),
            resolvedTargets: [...row.resolvedTargets].sort(),
          })).sort((a,b) => a.path.localeCompare(b.path));
          const outer = new Map();
          for (const entry of evidence.unclassifiedPowerShellSurfaces) {
            const row = outer.get(entry.sourcePath) ?? { path: entry.sourcePath, runtimeTokens: 0, scriptTokens: 0, samples: [] };
            if (entry.tokenKind === 'runtime') row.runtimeTokens += 1;
            else row.scriptTokens += 1;
            if (row.samples.length < 8) row.samples.push({line:entry.line,tokenKind:entry.tokenKind,matchedBytes:entry.matchedBytes});
            outer.set(entry.sourcePath,row);
          }
          const tracked = evidence.entries
            .filter((entry) => entry.sourceKind === 'tracked-ps1-file')
            .map((entry) => ({ path: entry.occurrence.sourcePath, currentPrescriptive: entry.currentPrescriptive }))
            .sort((a,b)=>a.path.localeCompare(b.path));
          fs.writeFileSync('/tmp/post-port-source-summary.json', JSON.stringify({
            measuredHead: evidence.measuredHead,
            broaderStatusClosed: evidence.broaderStatusClosed,
            dormantRetainedCoverageComplete: evidence.dormantRetainedCoverageComplete,
            unresolvedCurrentPrescriptiveScriptTargets: evidence.unresolvedCurrentPrescriptiveScriptTargets,
            retainedDispositions: evidence.retainedDispositions,
            trackedPowerShell: tracked,
            sources,
            outerSources: [...outer.values()].sort((a,b)=>a.path.localeCompare(b.path)),
          }, null, 2) + '\n');
          NODE
      - name: Publish summary
        run: |
          set -euo pipefail
          git fetch origin ci/issue-1419-post-port-evidence
          git checkout -B ci/issue-1419-post-port-evidence origin/ci/issue-1419-post-port-evidence
          cp /tmp/post-port-source-summary.json post-port-source-summary.json
          git config user.name "orchestrator-pack diagnostics"
          git config user.email "85295154+chetwerikoff@users.noreply.github.com"
          git add post-port-source-summary.json
          git commit --no-gpg-sign -m "ci: capture issue 1419 source summary" || exit 0
          git push origin HEAD:ci/issue-1419-post-port-evidence
