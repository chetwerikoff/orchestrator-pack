name: issue-928-review-fix-fast

on:
  push:
    branches:
      - agent/issue-928-cutover-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-928-cutover-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply staged review fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          awk '
            /^          node <<'"'"'NODE'"'"'$/ { capture=1; next }
            /^          NODE$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/issue-928-review-fix-helper.yml > /tmp/issue-928-review-fix.js
          test -s /tmp/issue-928-review-fix.js
          node /tmp/issue-928-review-fix.js
          rm -f .github/workflows/issue-928-review-fix-fast.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: address pack review findings"
          git push origin HEAD:agent/issue-928-cutover-final
