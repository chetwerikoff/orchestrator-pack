name: issue-1352-main-integrate

on:
  push:
    branches:
      - agent/issue-1352-hard-cut
    paths:
      - .github/workflows/issue-1352-main-integrate.yml

permissions:
  contents: write

jobs:
  integrate-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
      - name: Merge current main and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo 'MERGE_CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'MERGE_CONFLICTS_END'
            git status --short
            exit 1
          fi
          rm .github/workflows/issue-1352-main-integrate.yml
          git add -A
          git commit -m 'merge(main): integrate current default branch'
          git push origin HEAD:agent/issue-1352-hard-cut
