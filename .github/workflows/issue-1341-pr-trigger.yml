name: issue-1341-pr-trigger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1341-operator-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Execute implementation recipe
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          raw = Path('.github/workflows/issue-1341-implementation.yml').read_text()
          names = ['Apply implementation', 'Add focused tests', 'Document operator boundaries and declare scope']
          blocks = []
          for index, name in enumerate(names):
              marker = f'      - name: {name}\n        run: |\n'
              start = raw.index(marker) + len(marker)
              if index + 1 < len(names):
                  next_marker = f'      - name: {names[index + 1]}\n'
                  end = raw.index(next_marker, start)
              else:
                  end = len(raw)
              section = raw[start:end]
              normalized = []
              for line in section.splitlines():
                  normalized.append(line[10:] if line.startswith('          ') else line)
              blocks.append('\n'.join(normalized) + '\n')
          for block_index, block in enumerate(blocks):
              subprocess.run(['bash', '-euo', 'pipefail', '-c', block], check=True)
              if block_index == 1:
                  path = Path('scripts/lib/create-issue-stage-record-artifacts.ts')
                  text = path.read_text()
                  text = text.replace(
                      'operatorContext.applications[0].invocationId',
                      '(operatorContext.applications[0] as OperatorAdjudicationApplication).invocationId',
                  )
                  text = text.replace(
                      'operatorContext.applications[0].originalTransport',
                      '(operatorContext.applications[0] as OperatorAdjudicationApplication).originalTransport',
                  )
                  path.write_text(text)
                  subprocess.run(['git', 'add', str(path)], check=True)
                  subprocess.run(['git', 'commit', '-m', 'fix: retain adjudication application type'], check=True)
          Path('.github/workflows/issue-1341-pr-trigger.yml').unlink()
          subprocess.run(['git', 'add', '.github/workflows/issue-1341-pr-trigger.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: remove implementation bootstrap'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:agent/issue-1341-operator-inputs'], check=True)
          PY
