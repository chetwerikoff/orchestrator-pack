name: read-delegation-audit

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull-request runs cancel per PR number; push-to-main runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  audit-policy:
    name: Read-delegation audit policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fixture suite (scripts/read-delegation-audit.test.ts) is owned by scope-guard
      # "Run pack contract tests" via scripts/test-all.ps1 on ordinary non-markdown PRs
      # and on push-to-main. This workflow retains unique policy/meta checks only.

      - name: Enforce read-delegation policy pointer consistency
        shell: pwsh
        run: ./scripts/check-read-delegation-policy-consistency.ps1

      - name: Setup Node.js (audit meta-check deps)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify read-delegation audit CI gate (meta-check)
        shell: pwsh
        run: ./scripts/check-read-delegation-audit-ci-gate.ps1

  issue-1148-r4-fixes:
    name: Issue 1148 current review fixes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/issue-1148-message-identity' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1148-message-identity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Decode and apply exact current-head fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/issue-1148-r4-fixes.py.gz.b64 | gzip -d > /tmp/issue-1148-r4-fixes.py
          python -m py_compile /tmp/issue-1148-r4-fixes.py
          python /tmp/issue-1148-r4-fixes.py

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run focused verification
        shell: bash
        run: |
          set -euo pipefail
          npm run check:node-major --silent
          npm run lint:foundation --silent
          npm run typecheck:foundation --silent
          node scripts/run-vitest-with-harness.mjs run --maxWorkers=1 \
            scripts/chatgpt-browser-turn/state-light-page-observation.test.ts \
            scripts/stage-completeness-guard.test.ts

      - name: Publish scoped fixes and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout 801b8981f7c792e2b3c1b9aefdecb47cd38babeb -- .github/workflows/read-delegation-audit.yml
          rm -f .github/issue-1148-r4-fixes.py.gz.b64
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(browser-turn): address current identity review findings'
          git push origin HEAD:agent/issue-1148-message-identity
