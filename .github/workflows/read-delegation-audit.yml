name: read-delegation-audit

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull-request runs cancel per PR number; push-to-main runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  audit-policy:
    name: Read-delegation audit policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fixture suite (scripts/read-delegation-audit.test.ts) is owned by scope-guard
      # "Run pack contract tests" via scripts/test-all.ps1 on ordinary non-markdown PRs
      # and on push-to-main. This workflow retains unique policy/meta checks only.

      - name: Enforce read-delegation policy pointer consistency
        shell: pwsh
        run: ./scripts/check-read-delegation-policy-consistency.ps1

      - name: Setup Node.js (audit meta-check deps)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify read-delegation audit CI gate (meta-check)
        shell: pwsh
        run: ./scripts/check-read-delegation-audit-ci-gate.ps1

  issue-1148-review-fixes:
    name: Issue 1148 review finding fixes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/issue-1148-message-identity' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1148-message-identity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Repair indentation-sensitive patch preconditions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/issue-1148-review-fixes.py')
          text = path.read_text(encoding='utf-8')

          start = text.index(
              'source = replace_once(\n'
              '    source,\n'
              '    block("""\n'
              '      const matching = observation.nodes.filter((node) => node.identity === boundary.anchorIdentity);'
          )
          end = text.index(
              'source = replace_once(\n'
              '    source,\n'
              '    "    nodes: observation.nodes.slice(anchor.domIndex + boundary.suffix.length),"',
              start,
          )
          replacement = '''post_tail_start = source.index(
              "  const matching = observation.nodes.filter((node) => node.identity === boundary.anchorIdentity);"
          )
          post_tail_end = source.index(
              "  for (let index = 0; index < boundary.suffix.length; index++) {",
              post_tail_start,
          )
          source = source[:post_tail_start] + (
              "  const matching = observation.nodes\\n"
              "    .map((node, index) => ({ node, index }))\\n"
              "    .filter(({ node }) => node.identity === boundary.anchorIdentity);\\n"
              "  if (matching.length > 1) return { state: 'changed' };\\n"
              "  if (matching.length === 0) {\\n"
              "    return observation.nodes.some((node) => node.identityReadFailed)\\n"
              "      ? { state: 'unresolved' }\\n"
              "      : { state: 'changed' };\\n"
              "  }\\n"
              "  const { node: anchor, index: anchorIndex } = matching[0]!;\\n"
              "  if (anchor.role !== 'user') return { state: 'changed' };\\n"
              "  const currentSuffix = observation.nodes.slice(\\n"
              "    anchorIndex,\\n"
              "    anchorIndex + boundary.suffix.length,\\n"
              "  );\\n"
              "  if (currentSuffix.length !== boundary.suffix.length) return { state: 'changed' };\\n"
          ) + source[post_tail_end:]

          '''
          text = text[:start] + replacement + text[end:]

          start = text.index(
              'source = replace_once(\n'
              '    source,\n'
              '    block("""\n'
              '          const firstTail = await readPageObservation(page);'
          )
          end = text.index(
              'source = replace_once(\n'
              '    source,\n'
              '    "      boundMissingReads = 0;\\n"',
              start,
          )
          replacement = '''pre_send_start = source.index(
              "      const firstTail = await readPageObservation(page);"
          )
          pre_send_end = source.index(
              "      admissionCandidateIdentity = undefined;",
              pre_send_start,
          )
          source = source[:pre_send_start] + (
              "      const firstTail = await readTailPageObservation(page, config.newChat);\\n"
              "      await sleep(page, OWNED_TAIL_CONFIRM_DELAY_MS);\\n"
              "      const secondTail = await readTailPageObservation(page, config.newChat);\\n"
              "      ownedTailBoundary = establishOwnedTailBoundary(firstTail, secondTail, config.newChat);\\n"
              "      observationMode = ownedTailBoundary.kind === 'text_fallback' ? 'text_fallback' : 'admission';\\n"
              "      baselineCount = secondTail.nodeCount ?? secondTail.messages.length;\\n"
          ) + source[pre_send_end:]

          '''
          text = text[:start] + replacement + text[end:]

          start = text.index(
              'source = replace_once(\n'
              '    source,\n'
              '    block("""\n'
              "            if (exactBound.state === 'missing') {"
          )
          end = text.index(
              'source = replace_once(\n'
              '    source,\n'
              '    "        boundUnresolvedReads = 0;\\n"',
              start,
          )
          replacement = '''missing_start = source.index(
              "        if (exactBound.state === 'missing') {"
          )
          missing_end = source.index(
              "          if (boundMissingReads >= OWNED_IDENTITY_MISSING_READS) {",
              missing_start,
          )
          source = source[:missing_start] + (
              "        if (exactBound.state === 'missing') {\\n"
              "          // DOM indices can shift as historical nodes materialize or virtualize.\\n"
              "          // Zero exact matches are bounded disappearance evidence unless another\\n"
              "          // current-page identity/role/topology contradiction exists.\\n"
              "          boundMissingReads += 1;\\n"
          ) + source[missing_end:]

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply exact review fixes
        run: python .github/issue-1148-review-fixes.py

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run focused verification
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:foundation --silent
          node scripts/run-vitest-with-harness.mjs run --maxWorkers=1 \
            scripts/chatgpt-browser-turn/state-light-page-observation.test.ts \
            scripts/stage-completeness-guard.test.ts

      - name: Publish scoped fixes and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          git checkout 801b8981f7c792e2b3c1b9aefdecb47cd38babeb -- .github/workflows/read-delegation-audit.yml
          rm -f .github/workflows/issue-1148-review-fixes.yml
          rm -f .github/issue-1148-review-fixes.py
          rm -f .github/issue-1148-review-fixes.log
          rm -f .github/issue-1148-review-fixes.status
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(browser-turn): address identity review findings'
          git push origin HEAD:agent/issue-1148-message-identity
