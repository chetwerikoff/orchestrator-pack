name: read-delegation-audit

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull-request runs cancel per PR number; push-to-main runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-policy:
    name: Read-delegation audit policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fixture suite (scripts/read-delegation-audit.test.ts) is owned by scope-guard
      # "Run pack contract tests" via scripts/test-all.ps1 on ordinary non-markdown PRs
      # and on push-to-main. This workflow retains unique policy/meta checks only.

      - name: Enforce read-delegation policy pointer consistency
        shell: pwsh
        run: ./scripts/check-read-delegation-policy-consistency.ps1

      - name: Setup Node.js (audit meta-check deps)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify read-delegation audit CI gate (meta-check)
        shell: pwsh
        run: ./scripts/check-read-delegation-audit-ci-gate.ps1

  issue-1352-runtime-history-checkpoint:
    name: Issue 1352 measured-history checkpoint
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1378 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record successful current-head CI measurements
        env:
          MEASURED_AT: '2026-08-07T20:26:00.017Z'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'scripts/vitest-runtime-history.json';
          const history = JSON.parse(readFileSync(path, 'utf8'));
          const measuredAt = process.env.MEASURED_AT;
          const durations = new Map([
            ['scripts/gate-runner/bulk-declarative-gates.test.ts', 99],
            ['scripts/gate-runner/census.test.ts', 542],
            ['scripts/gate-runner/custom/bulk-cli-parity.test.ts', 10997],
            ['scripts/gate-runner/custom/capture-redaction.test.ts', 9],
            ['scripts/gate-runner/declarative.test.ts', 8],
            ['scripts/gate-runner/registry.test.ts', 5],
          ]);
          history.source = 'ci-measured';
          history.dataChangedAt = measuredAt;
          history.files ??= {};
          history.provenance ??= {};
          history.recentSamples ??= {};
          history.fileChangedAt ??= {};
          for (const [file, duration] of durations) {
            history.files[file] = duration;
            history.provenance[file] = 'measured';
            history.recentSamples[file] = [duration];
            history.fileChangedAt[file] = measuredAt;
          }
          writeFileSync(path, `${JSON.stringify(history, null, 2)}\n`, 'utf8');
          NODE

      - name: Commit history only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/vitest-runtime-history.json
          test "$(git diff --cached --name-only)" = 'scripts/vitest-runtime-history.json'
          git commit -m 'Refresh Issue 1352 measured Vitest history'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
