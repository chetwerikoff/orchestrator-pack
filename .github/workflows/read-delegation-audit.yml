name: read-delegation-audit

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull-request runs cancel per PR number; push-to-main runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-policy:
    name: Read-delegation audit policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fixture suite (scripts/read-delegation-audit.test.ts) is owned by scope-guard
      # "Run pack contract tests" via scripts/test-all.ps1 on ordinary non-markdown PRs
      # and on push-to-main. This workflow retains unique policy/meta checks only.

      - name: Enforce read-delegation policy pointer consistency
        shell: pwsh
        run: ./scripts/check-read-delegation-policy-consistency.ps1

      - name: Setup Node.js (audit meta-check deps)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify read-delegation audit CI gate (meta-check)
        shell: pwsh
        run: ./scripts/check-read-delegation-audit-ci-gate.ps1

  issue-1352-retirement-repair:
    name: Issue 1352 retirement repair
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1378
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify event head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Apply exact retirement cleanup
        run: python scripts/issue-1352-retirement-repair.py
      - name: Verify retirement scanner
        run: node --experimental-strip-types scripts/runtime-retirement/retired-surface-selftest.ts
      - name: Typecheck and focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:foundation
          npm test -- --maxWorkers=1 scripts/runtime-retirement/retired-surface-guard.test.ts scripts/pr2-foundation/terminalized-port.test.ts scripts/pr-scope-declaration.test.ts
      - name: Commit cleanup and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/read-delegation-audit.yml
          git rm scripts/issue-1352-retirement-repair.py
          git add scripts/pr-scope-declaration.ts scripts/pr2-foundation/terminalized-port.test.ts .github/workflows/read-delegation-audit.yml
          git diff --cached --check
          git commit -m 'Remove final active retirement scanner literals'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
