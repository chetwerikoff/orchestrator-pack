name: Issue 1276 fix union test

on:
  push:
    branches:
      - chetwerikoff/issue-1276
    paths:
      - .github/workflows/issue-1276-fix-union-test.yml

permissions:
  contents: write

jobs:
  fix-test:
    if: github.repository == 'chetwerikoff/orchestrator-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chetwerikoff/issue-1276
      - name: Repair union-merged test file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/pack-review-runner-gpt.test.ts')
          text = path.read_text(encoding='utf-8')

          old_imports = """import { isRetryablePackReviewZeroSendCollision, startPackReview } from './pack-review-runner.js';
          import {
            createPackReviewRun,
            getPackReviewRun,
            setPackReviewRunTerminal,
            terminalizePackReviewStaleRun,
            updatePackReviewRun,
            type PackReviewGptRoundRecord,
          } from './lib/pack-review-run-store.js';
          import { startPackReview } from './pack-review-runner.js';
          import type { CarryoverReplayResult } from './pack-review-carryover.js';
          import { createPackReviewRun, getPackReviewRun, listPackReviewRuns } from './lib/pack-review-run-store.js';
          """
          new_imports = """import { isRetryablePackReviewZeroSendCollision, startPackReview } from './pack-review-runner.js';
          import type { CarryoverReplayResult } from './pack-review-carryover.js';
          import {
            createPackReviewRun,
            getPackReviewRun,
            listPackReviewRuns,
            setPackReviewRunTerminal,
            terminalizePackReviewStaleRun,
            updatePackReviewRun,
            type PackReviewGptRoundRecord,
          } from './lib/pack-review-run-store.js';
          """
          if text.count(old_imports) != 1:
              raise SystemExit('expected duplicate import block exactly once')
          text = text.replace(old_imports, new_imports, 1)

          old_boundary = """  });
          function mergeCompositeReplay(): CarryoverReplayResult {
          """
          new_boundary = """  });
          }

          function mergeCompositeReplay(): CarryoverReplayResult {
          """
          if text.count(old_boundary) != 1:
              raise SystemExit('expected missing helper brace boundary exactly once')
          text = text.replace(old_boundary, new_boundary, 1)

          if text.count("import { startPackReview } from './pack-review-runner.js';") != 0:
              raise SystemExit('duplicate startPackReview import remains')
          if text.count("function findingsPayload(title: string): string {") != 1:
              raise SystemExit('findingsPayload helper count changed')

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pack-review-runner-gpt.test.ts
          git commit -m 'test: repair union-merged GPT runner suite'
          git push origin HEAD:chetwerikoff/issue-1276
