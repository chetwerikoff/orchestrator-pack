name: issue-1352-carrier-trigger

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  apply-checkpoint:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified runtime cutover checkpoint
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'resolveDefaultProjectId' scripts/lib/reverify-bound-issue-snapshot.ts; then
            echo 'checkpoint already applied'
            exit 0
          fi
          awk '/checkpoint\.b64.*PATCH/{capture=1; next} capture && /^[[:space:]]*PATCH[[:space:]]*$/{exit} capture{print}' .github/workflows/issue-1352-source-export.yml \
            | tr -d '[:space:]' \
            | base64 -d > "$RUNNER_TEMP/checkpoint.patch"
          git apply --check "$RUNNER_TEMP/checkpoint.patch"
          git apply "$RUNNER_TEMP/checkpoint.patch"
          npm ci --include=dev
          npm run typecheck:foundation
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add docs/declarations/1352.pr-scope.json scripts/bound-issue-snapshot-cli.ts scripts/invoke-contract-evidence-reverify.ts scripts/invoke-reviewer-contract-mapping.ts scripts/lib/pack-review-delivery.ts scripts/lib/reverify-bound-issue-snapshot.ts scripts/pr2-foundation/worker-notification-target.ts scripts/pr2-foundation/worker-nudge-claim-store.ts
          git diff --cached --check
          git commit -m 'fix(runtime): finish pack-owned state cutover'
          git push origin HEAD:agent/issue-1352-hard-cut
