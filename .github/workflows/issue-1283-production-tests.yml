name: issue-1283-production-tests

on:
  push:
    branches:
      - agent/issue-1283-browser-turn-recovery

permissions:
  contents: write
  issues: read

concurrency:
  group: issue-1283-production-tests
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.repository == 'chetwerikoff/orchestrator-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/issue-1283-browser-turn-recovery
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1283-browser-turn-recovery
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Apply production recovery tests
        run: python scripts/chatgpt-browser-turn/apply-1283-production-tests.py

      - name: Run focused production recovery suite
        run: >-
          npm test --
          scripts/chatgpt-browser-turn/state-light-fresh-conversation.test.ts
          scripts/chatgpt-browser-turn/tab-lifecycle.test.ts
          scripts/flow-manager-long-running-child.test.ts

      - name: Type-check changed production surfaces
        run: npm run typecheck:foundation

      - name: Regenerate fresh Issue 1283 scope declaration
        shell: bash
        run: |
          set -euo pipefail
          gh issue view 1283 --repo chetwerikoff/orchestrator-pack --json body --jq .body > /tmp/issue-1283-r07.md
          rm -f scripts/chatgpt-browser-turn/apply-1283-production-tests.py
          rm -f .github/workflows/issue-1283-production-tests.yml
          node --experimental-strip-types scripts/pr-scope-declaration.ts \
            --issue 1283 \
            --issue-body-file /tmp/issue-1283-r07.md \
            --declared-paths '.claude/skills/create-issue-draft/SKILL.md,docs/declarations/1283.pr-scope.json,scripts/chatgpt-browser-turn/state-light-cancellation.ts,scripts/chatgpt-browser-turn/state-light-fresh-conversation.test.ts,scripts/chatgpt-browser-turn/state-light-turn-recovery.ts,scripts/chatgpt-browser-turn/state-light-turn.ts,scripts/chatgpt-browser-turn/tab-lifecycle.test.ts,scripts/flow-manager-long-running-child.test.ts,scripts/flow-manager-long-running-child.ts,scripts/toolchain/chatgpt-browser-turn.review-fixes.test.ts' \
            --output docs/declarations/1283.pr-scope.json

      - name: Commit and push verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(browser-turn): prove production recovery ownership'
          git push origin "HEAD:${BRANCH}"
