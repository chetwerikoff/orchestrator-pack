name: issue-1352-diagnostics

on:
  push:
    branches:
      - agent/issue-1352-hard-cut

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Node preflight
        continue-on-error: true
        run: npm run check:node-major
      - name: Foundation typecheck
        continue-on-error: true
        run: npm run typecheck:foundation
      - name: Runtime retirement scanner
        continue-on-error: true
        run: node --experimental-strip-types scripts/runtime-retirement/retired-surface-selftest.ts
      - name: Focused Vitest
        continue-on-error: true
        run: npm test -- --maxWorkers=1 scripts/runtime-retirement/retired-surface-guard.test.ts scripts/pr-scope-declaration.test.ts scripts/pack-review-runner-gpt.test.ts scripts/pr2-foundation/terminalized-port.test.ts
      - name: Verify repository
        continue-on-error: true
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Check reusable
        continue-on-error: true
        shell: pwsh
        run: ./scripts/check-reusable.ps1
