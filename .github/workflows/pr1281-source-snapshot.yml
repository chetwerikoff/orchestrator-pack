name: PR 1281 source snapshot

on:
  push:
    branches:
      - agent/issue-1248-runtime-callers

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: tar --exclude=.git -czf /tmp/pr1281-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr1281-source
          path: /tmp/pr1281-source.tar.gz
          retention-days: 1
