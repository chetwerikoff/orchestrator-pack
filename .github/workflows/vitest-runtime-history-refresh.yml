name: vitest-runtime-history-refresh

on:
  push:
    branches:
      - main
    paths-ignore:
      - scripts/vitest-runtime-history.json
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      supplemental_source_sha:
        description: 'Full same-repository source commit for the fixed light target'
        required: false
        type: string

concurrency:
  group: vitest-runtime-history-refresh
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  plan-vitest-ci-topology:
    name: Plan Vitest heavy topology
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      heavy_shard_count: ${{ steps.plan.outputs.heavy_shard_count }}
      heavy_shard_matrix: ${{ steps.plan.outputs.heavy_shard_matrix }}
      fallback_classification: ${{ steps.plan.outputs.fallback_classification }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Emit derived heavy topology
        id: plan
        shell: bash
        env:
          OPK_DISABLE_PRE_TOPOLOGY_MEASUREMENT: '1'
        run: |
          set -euo pipefail
          node scripts/emit-vitest-heavy-topology.mjs --gha-output --skip-oversized-guard

      - name: Upload heavy topology artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-heavy-topology
          path: scripts/vitest-heavy-topology.plan.json
          if-no-files-found: error
          retention-days: 7

  test-vitest-heavy:
    name: Vitest heavy shard ${{ matrix.shard }}/${{ needs.plan-vitest-ci-topology.outputs.heavy_shard_count }}
    needs: plan-vitest-ci-topology
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-vitest-ci-topology.outputs.heavy_shard_matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Download heavy topology artifact
        uses: actions/download-artifact@v4
        with:
          name: vitest-heavy-topology
          path: scripts

      - name: Run Vitest heavy shard
        shell: pwsh
        env:
          OPK_VITEST_TOPOLOGY_PLAN_PATH: ${{ github.workspace }}/scripts/vitest-heavy-topology.plan.json
        run: ./scripts/run-vitest-heavy-shard.ps1 -Shard ${{ matrix.shard }}

      - name: Upload heavy shard runtime report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-heavy-report-${{ matrix.shard }}
          path: |
            .vitest-runtime-report-heavy-${{ matrix.shard }}.json
            .vitest-runtime-report-heavy-${{ matrix.shard }}.json.meta.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Validate exact supplemental source revision
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.supplemental_source_sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'supplemental_source_sha must be one full 40-hex commit' >&2
            exit 1
          }

      - name: Validate trusted supplemental source ancestry
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.supplemental_source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          parent_count="$(git rev-list --parents -n 1 "${SOURCE_SHA}" | awk '{print NF - 1}')"
          test "${parent_count}" -eq 1 || {
            echo 'supplemental_source_sha must identify a non-merge commit' >&2
            exit 1
          }
          trusted_branch=false
          while read -r branch_sha branch_ref; do
            if git merge-base --is-ancestor "${SOURCE_SHA}" "${branch_sha}"; then
              trusted_branch=true
              break
            fi
          done < <(git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin/)
          test "${trusted_branch}" = true || {
            echo 'supplemental_source_sha must be reachable from a trusted base-repository branch' >&2
            exit 1
          }

      - name: Checkout exact supplemental source revision
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.supplemental_source_sha }}
          path: supplemental-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify supplemental source and fixed light discovery
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1
        shell: bash
        working-directory: supplemental-source
        env:
          SOURCE_SHA: ${{ inputs.supplemental_source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const target = 'scripts/pack-reviewer-preference.test.ts';
          const config = JSON.parse(readFileSync('scripts/vitest-ci-lanes.config.json', 'utf8'));
          if (config.classification?.[target] !== 'light') {
            throw new Error(`source-tree discovery does not classify ${target} as light`);
          }
          NODE

      - name: Install supplemental source dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1
        working-directory: supplemental-source
        run: npm ci --include=dev

      - name: Run only fixed supplemental target
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1
        working-directory: supplemental-source
        shell: bash
        env:
          TARGET: scripts/pack-reviewer-preference.test.ts
          REPORT: .vitest-runtime-report-supplemental-pack-reviewer-preference.json
          VITEST_CI_LIGHT_LANE: '1'
        run: |
          set -euo pipefail
          npm run check:node-major
          npm test -- --maxWorkers=1 "${TARGET}" --reporter=json --outputFile="${REPORT}"

      - name: Write source-bound supplemental metadata
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.supplemental_source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPORT: supplemental-source/.vitest-runtime-report-supplemental-pack-reviewer-preference.json
          META: .vitest-runtime-report-supplemental-pack-reviewer-preference.json.meta.json
        run: |
          set -euo pipefail
          SOURCE_SHA="${SOURCE_SHA}" RUN_ID="${RUN_ID}" RUN_ATTEMPT="${RUN_ATTEMPT}" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const target = 'scripts/pack-reviewer-preference.test.ts';
          const report = JSON.parse(readFileSync(process.env.REPORT, 'utf8'));
          if (report.success !== true || Number(report.numFailedTests ?? 1) !== 0) {
            throw new Error('supplemental report is not a successful terminal report');
          }
          const meta = {
            schema: 'orchestrator-pack/vitest-runtime-history-supplemental/v1',
            repository: 'chetwerikoff/orchestrator-pack',
            target,
            commitSha: process.env.SOURCE_SHA,
            success: true,
            conclusion: 'success',
            lane: 'light',
            discovery: {
              source: 'scripts/vitest-ci-lanes.config.json',
              target,
              lane: 'light',
            },
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
          };
          writeFileSync(process.env.META, `${JSON.stringify(meta, null, 2)}\n`, 'utf8');
          NODE

      - name: Upload fixed supplemental report
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != '' && matrix.shard == 1 && success()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-supplemental-report-pack-reviewer-preference
          path: |
            supplemental-source/.vitest-runtime-report-supplemental-pack-reviewer-preference.json
            .vitest-runtime-report-supplemental-pack-reviewer-preference.json.meta.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7


  refresh-runtime-history:
    name: Refresh vitest runtime-history
    needs: [plan-vitest-ci-topology, test-vitest-heavy]
    if: >-
      always()
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Node.js major
        run: npm run check:node-major

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Download heavy shard runtime reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-heavy-report-*
          path: vitest-heavy-reports
          merge-multiple: true

      - name: Download fixed supplemental report
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != ''
        uses: actions/download-artifact@v4
        with:
          name: vitest-supplemental-report-pack-reviewer-preference
          path: vitest-supplemental-reports

      - name: Stage heavy shard reports for refresh
        shell: pwsh
        run: |
          $shardCount = [int]'${{ needs.plan-vitest-ci-topology.outputs.heavy_shard_count }}'
          if ($shardCount -lt 1) {
            throw "invalid plan-derived heavy shard count: $shardCount"
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'vitest-heavy-reports-staged'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          for ($shard = 1; $shard -le $shardCount; $shard++) {
            $json = Join-Path $env:GITHUB_WORKSPACE "vitest-heavy-reports/.vitest-runtime-report-heavy-$shard.json"
            $meta = Join-Path $env:GITHUB_WORKSPACE "vitest-heavy-reports/.vitest-runtime-report-heavy-$shard.json.meta.json"
            if (-not (Test-Path -LiteralPath $json)) {
              throw "missing downloaded heavy shard report for shard $shard"
            }
            Copy-Item -LiteralPath $json -Destination (Join-Path $dest "shard-$shard.json")
            if (Test-Path -LiteralPath $meta) {
              Copy-Item -LiteralPath $meta -Destination (Join-Path $dest "shard-$shard.meta.json")
            }
          }

      - name: Stage fixed supplemental report for refresh
        if: github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha != ''
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'vitest-supplemental-reports'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'vitest-supplemental-reports-staged'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $report = Join-Path $source 'supplemental-source/.vitest-runtime-report-supplemental-pack-reviewer-preference.json'
          $meta = Join-Path $source '.vitest-runtime-report-supplemental-pack-reviewer-preference.json.meta.json'
          if (-not (Test-Path -LiteralPath $report) -or -not (Test-Path -LiteralPath $meta)) {
            throw 'missing fixed supplemental report or companion metadata'
          }
          Copy-Item -LiteralPath $report -Destination (Join-Path $dest 'supplemental-pack-reviewer-preference.json')
          Copy-Item -LiteralPath $meta -Destination (Join-Path $dest 'supplemental-pack-reviewer-preference.json.meta.json')

      - name: Refresh committed runtime-history
        shell: pwsh
        env:
          REFRESH_EVENT_NAME: ${{ github.event_name }}
          REFRESH_REF: ${{ github.ref }}
          TRUSTED_REFRESH_SHA: ${{ github.sha }}
          REFRESH_WORKFLOW_REF: ${{ github.workflow_ref }}
          REFRESH_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SUPPLEMENTAL_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.supplemental_source_sha || '' }}
          SUPPLEMENTAL_RUN_ID: ${{ github.run_id }}
          SUPPLEMENTAL_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $refreshArgs = @{
            ReportsDir = (Join-Path $env:GITHUB_WORKSPACE 'vitest-heavy-reports-staged')
            CommitSha = $env:TRUSTED_REFRESH_SHA
            CommitBack = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SUPPLEMENTAL_SOURCE_SHA)) {
            $refreshArgs['SupplementalReportsDir'] = (Join-Path $env:GITHUB_WORKSPACE 'vitest-supplemental-reports-staged')
            $refreshArgs['SupplementalSourceSha'] = $env:SUPPLEMENTAL_SOURCE_SHA
            $refreshArgs['SupplementalRunId'] = $env:SUPPLEMENTAL_RUN_ID
            $refreshArgs['SupplementalRunAttempt'] = $env:SUPPLEMENTAL_RUN_ATTEMPT
          }

          $resolvedArguments = [ordered]@{}
          foreach ($name in @(
            'ReportsDir',
            'CommitSha',
            'CommitBack',
            'SupplementalReportsDir',
            'SupplementalSourceSha',
            'SupplementalRunId',
            'SupplementalRunAttempt'
          )) {
            if ($refreshArgs.ContainsKey($name)) {
              $resolvedArguments[$name] = $refreshArgs[$name]
            }
          }
          $boundarySignal = [ordered]@{
            event = $env:REFRESH_EVENT_NAME
            ref = $env:REFRESH_REF
            trustedSha = $env:TRUSTED_REFRESH_SHA
            workflowRef = $env:REFRESH_WORKFLOW_REF
            workflowSha = $env:REFRESH_WORKFLOW_SHA
            supplementalTuple = [ordered]@{
              SupplementalReportsDir = $refreshArgs.ContainsKey('SupplementalReportsDir')
              SupplementalSourceSha = $refreshArgs.ContainsKey('SupplementalSourceSha')
              SupplementalRunId = $refreshArgs.ContainsKey('SupplementalRunId')
              SupplementalRunAttempt = $refreshArgs.ContainsKey('SupplementalRunAttempt')
            }
            arguments = $resolvedArguments
          }
          Write-Host ('runtime-history-refresh-boundary ' + ($boundarySignal | ConvertTo-Json -Compress -Depth 5))
          ./scripts/refresh-vitest-runtime-history.ps1 @refreshArgs

      - name: Require delivery credential
        shell: bash
        env:
          DELIVERY_TOKEN: ${{ secrets.VITEST_RUNTIME_HISTORY_DELIVERY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DELIVERY_TOKEN}" ]; then
            echo "VITEST_RUNTIME_HISTORY_DELIVERY_TOKEN is required for protected-branch delivery" >&2
            exit 1
          fi

      - name: Detect prepared delivery commit
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          ahead="$(git rev-list --count origin/main..HEAD)"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          if [ "${ahead}" = "0" ]; then
            echo "runtime-history delivery skipped: no committed history delta"
          fi

      - name: Reconcile pending delivery branch state
        if: steps.delivery.outputs.ahead != '0'
        id: delivery_branch
        shell: bash
        env:
          DELIVERY_BRANCH: ci/vitest-runtime-history-refresh
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha=""
          should_push="true"
          if git ls-remote --exit-code origin "refs/heads/${DELIVERY_BRANCH}" >/dev/null 2>&1; then
            git fetch origin main "refs/heads/${DELIVERY_BRANCH}:refs/remotes/origin/${DELIVERY_BRANCH}"
            remote_sha="$(git rev-parse "origin/${DELIVERY_BRANCH}")"
            pending_history="$(mktemp)"
            status_history="$(mktemp)"
            actions_run="$(mktemp)"
            trap 'rm -f "${pending_history}" "${status_history}" "${actions_run}"' EXIT
            git show "origin/${DELIVERY_BRANCH}:scripts/vitest-runtime-history.json" > "${pending_history}"
            node scripts/refresh-vitest-runtime-history.mjs reconcile \
              --remote "${pending_history}" \
              --proposed scripts/vitest-runtime-history.json \
              --output scripts/vitest-runtime-history.json \
              --repo-root "${GITHUB_WORKSPACE}" \
              --require-equal-inventory
            git add -- scripts/vitest-runtime-history.json
            if ! git diff --cached --quiet HEAD -- scripts/vitest-runtime-history.json; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --amend --no-edit
            fi
            if git diff --quiet "origin/${DELIVERY_BRANCH}" -- scripts/vitest-runtime-history.json; then
              ./scripts/gh api "repos/${GITHUB_REPOSITORY}/commits/${remote_sha}/statuses" > "${status_history}"
              provenance_binding=""
              if provenance_binding="$(
                STATUS_HISTORY_FILE="${status_history}" REMOTE_SHA="${remote_sha}" \
                  node --input-type=module -e '
                    import { readFileSync } from "node:fs";
                    import { parseRefreshProvenance } from "./scripts/vitest-runtime-history-delivery.mjs";
                    const parsed = parseRefreshProvenance(JSON.parse(readFileSync(process.env.STATUS_HISTORY_FILE, "utf8")), process.env.REMOTE_SHA);
                    if (!parsed.ok) process.exit(2);
                    process.stdout.write(JSON.stringify(parsed));
                  '
              )"; then
                run_id="$(PROVENANCE_BINDING="${provenance_binding}" node -e 'process.stdout.write(String(JSON.parse(process.env.PROVENANCE_BINDING).runId))')"
                ./scripts/gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "${actions_run}"
                if PROVENANCE_BINDING="${provenance_binding}" ACTIONS_RUN_FILE="${actions_run}" \
                  node --input-type=module -e '
                    import { readFileSync } from "node:fs";
                    import { verifyRefreshRun } from "./scripts/vitest-runtime-history-delivery.mjs";
                    const proof = verifyRefreshRun(JSON.parse(readFileSync(process.env.ACTIONS_RUN_FILE, "utf8")), JSON.parse(process.env.PROVENANCE_BINDING));
                    if (!proof.ok || proof.state !== "success") process.exit(2);
                  '; then
                  should_push="false"
                  echo "runtime-history delivery skipped: pending PR already matches reconciled history payload with successful exact-head provenance"
                else
                  echo "runtime-history delivery recovery: matching remote payload lacks successful exact-head provenance; regenerating delivery head"
                fi
              else
                echo "runtime-history delivery recovery: matching remote payload has missing or invalid exact-head provenance; regenerating delivery head"
              fi
              if [ "${should_push}" = "true" ] && [ "$(git rev-parse HEAD)" = "${remote_sha}" ]; then
                sleep 1
                git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit --amend --no-edit
                if [ "$(git rev-parse HEAD)" = "${remote_sha}" ]; then
                  echo "unable to regenerate a distinct runtime-history delivery head after invalid provenance" >&2
                  exit 1
                fi
              fi
            fi
          else
            git fetch origin main
          fi
          echo "remote_sha=${remote_sha}" >> "$GITHUB_OUTPUT"
          echo "should_push=${should_push}" >> "$GITHUB_OUTPUT"

      - name: Push delivery branch
        if: steps.delivery.outputs.ahead != '0' && steps.delivery_branch.outputs.should_push == 'true'
        id: push_delivery
        shell: bash
        env:
          DELIVERY_BRANCH: ci/vitest-runtime-history-refresh
          DELIVERY_TOKEN: ${{ secrets.VITEST_RUNTIME_HISTORY_DELIVERY_TOKEN }}
          REMOTE_SHA: ${{ steps.delivery_branch.outputs.remote_sha }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${DELIVERY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "${REMOTE_SHA}" ]; then
            git push --force-with-lease="refs/heads/${DELIVERY_BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${DELIVERY_BRANCH}"
          else
            git push --force-with-lease origin "HEAD:refs/heads/${DELIVERY_BRANCH}"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish pending delivery provenance
        if: steps.delivery.outputs.ahead != '0' && steps.delivery_branch.outputs.should_push == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_HEAD: ${{ steps.push_delivery.outputs.head_sha }}
          SUPPLEMENTAL_SOURCE_SHA: ${{ inputs.supplemental_source_sha }}
        run: |
          set -euo pipefail
          if [ -n "${SUPPLEMENTAL_SOURCE_SHA:-}" ]; then
            description="runtime-history-provenance/v1 r=${GITHUB_RUN_ID} a=${GITHUB_RUN_ATTEMPT} s=${GITHUB_SHA} x=${SUPPLEMENTAL_SOURCE_SHA}"
          else
            description="runtime-history-provenance run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} source=${GITHUB_SHA}"
          fi
          ./scripts/gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${DELIVERY_HEAD}" \
            -f state=pending \
            -f context=orchestrator-pack/runtime-history-provenance \
            -f "description=${description}" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"

      - name: Write delivery PR body
        if: steps.delivery.outputs.ahead != '0'
        shell: bash
        run: |
          set -euo pipefail
          cat > vitest-runtime-history-delivery-pr-body.md <<'EOF'
          ## Summary
          - refresh `scripts/vitest-runtime-history.json` from measured heavy-shard reports
          - generated by `.github/workflows/vitest-runtime-history-refresh.yml`
          - constrained to the committed runtime-history artifact only

          ## Delivery model
          - PR branch: `ci/vitest-runtime-history-refresh`
          - PR open/update identity: `VITEST_RUNTIME_HISTORY_DELIVERY_TOKEN`
          - merge gate owner: `.github/workflows/vitest-runtime-history-delivery.yml` on `pull_request_target`
          EOF

      - name: Open or update delivery PR
        if: steps.delivery.outputs.ahead != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VITEST_RUNTIME_HISTORY_DELIVERY_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/vitest-runtime-history-delivery.mjs upsert-pr \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file vitest-runtime-history-delivery-pr-body.md

      - name: Complete delivery provenance
        if: steps.delivery.outputs.ahead != '0' && steps.delivery_branch.outputs.should_push == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_HEAD: ${{ steps.push_delivery.outputs.head_sha }}
          SUPPLEMENTAL_SOURCE_SHA: ${{ inputs.supplemental_source_sha }}
        run: |
          set -euo pipefail
          if [ -n "${SUPPLEMENTAL_SOURCE_SHA:-}" ]; then
            description="runtime-history-provenance/v1 r=${GITHUB_RUN_ID} a=${GITHUB_RUN_ATTEMPT} s=${GITHUB_SHA} x=${SUPPLEMENTAL_SOURCE_SHA}"
          else
            description="runtime-history-provenance run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} source=${GITHUB_SHA}"
          fi
          ./scripts/gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${DELIVERY_HEAD}" \
            -f state=success \
            -f context=orchestrator-pack/runtime-history-provenance \
            -f "description=${description}" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
