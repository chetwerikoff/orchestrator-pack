name: Issue 1352 main sync

on:
  push:
    branches:
      - agent/issue-1352-hard-cut
    paths:
      - .github/workflows/issue-1352-main-sync.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-1352-hard-cut
      - name: Merge current main with bounded conflict resolution
        shell: bash
        env:
          EXPECTED_PRE_CARRIER_HEAD: 2b9484e7773af07eb68d24656001272675f984d4
          EXPECTED_MAIN_HEAD: 10a20804a8dfd73cd49b8744f9a149ec884e0c5b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRE_CARRIER_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            if [ "${#unresolved[@]}" -ne 1 ] || [ "${unresolved[0]}" != "scripts/chatgpt-browser-turn/state-light-turn.ts" ]; then
              printf 'unexpected merge conflicts:\n%s\n' "${unresolved[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- scripts/chatgpt-browser-turn/state-light-turn.ts
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/chatgpt-browser-turn/state-light-turn.ts')
          text = path.read_text()
          replacements = {
              "const issue = String(env.CREATE_ISSUE_DRAFT_ISSUE ?? env.AO_ISSUE_NUMBER ?? '').trim();":
                  "const issue = String(env.CREATE_ISSUE_DRAFT_ISSUE ?? '').trim();",
              "const pr = String(env.PACK_REVIEW_PR_NUMBER ?? env.AO_PR_NUMBER ?? '').trim();":
                  "const pr = String(env.PACK_REVIEW_PR_NUMBER ?? '').trim();",
              "const agent = String(env.AO_AGENT ?? env.PACK_FLOW_MANAGER ?? process.title ?? 'node').trim();":
                  "const agent = String(env.OPK_AGENT ?? env.PACK_FLOW_MANAGER ?? process.title ?? 'node').trim();",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one main-line match, got {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          git add scripts/chatgpt-browser-turn/state-light-turn.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Merge main into issue-1352 hard-cut"
          git push origin HEAD:agent/issue-1352-hard-cut
