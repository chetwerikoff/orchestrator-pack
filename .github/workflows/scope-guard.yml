name: scope-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main

# Superseded pull-request runs cancel per PR number; push-to-main runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default read-only; jobs that post PR comments override permissions locally.
permissions:
  contents: read

jobs:
  # Conservative markdown-only gate for heavy advisory jobs (issue #155).
  # Every changed path in the PR diff must be .md/.mdc AND match the allowlist below;
  # one non-qualifying path forces the full CI suite.
  classify-pr-changes:
    name: Classify PR changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      markdown_only: ${{ steps.classify.outputs.markdown_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify markdown-only PR
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Markdown-only allowlist (literal; conservative / fail-safe):
          #   docs/**
          #   .claude/skills/**
          #   .cursor/skills/**
          #   .cursor/rules/**
          #   AGENTS.md
          #   top-level *.md (e.g. README.md, CLAUDE.md)
          # Each changed path must also end in .md or .mdc.

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "markdown_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          markdown_only=true
          for path in "${changed[@]}"; do
            [ -z "$path" ] && continue
            case "$path" in
              *.md|*.mdc) ;;
              *) markdown_only=false; break ;;
            esac
            case "$path" in
              docs/*|.claude/skills/*|.cursor/skills/*|.cursor/rules/*) continue ;;
              AGENTS.md) continue ;;
            esac
            if [[ "$path" != */* ]]; then
              continue
            fi
            markdown_only=false
            break
          done

          echo "markdown_only=${markdown_only}" >> "$GITHUB_OUTPUT"

  verify-pack:
    name: Verify orchestrator-pack structure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run read-only pack verifier
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Enforce reusable repository content policy
        shell: pwsh
        run: ./scripts/check-reusable.ps1

      - name: Enforce CI cheap wins policy
        shell: pwsh
        run: ./scripts/check-ci-cheap-wins.ps1

      - name: Enforce verify runtime refactor policy
        shell: pwsh
        run: ./scripts/check-verify-runtime.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Validate committed tier calibration
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run tiering:calibration

      - name: Enforce CI pipeline split policy
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-ci-pipeline-split.ps1

  pr-scope-guard:
    name: PR scope guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout trusted scope guard (base ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-scope-guard

      - name: Setup Node.js (trusted scope guard deps)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: trusted-scope-guard/package-lock.json

      - name: Run scope guard
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_SCOPE_REPO_ROOT: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_SAME: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SCOPE_GUARD_DEGRADED_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'scope-guard-degraded') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI (gh) is required for PR scope guard'
          }
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            throw 'Node.js is required for PR scope guard'
          }

          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE 'trusted-scope-guard'
          $trustedChecker = Join-Path $trustedRoot 'scripts/pr-scope-check.ps1'
          $trustedDeclarationContract = Join-Path $trustedRoot 'scripts/pr-scope-declaration.ts'
          $trustedLiveIssueScope = (Test-Path -LiteralPath $trustedDeclarationContract) -and
            (Select-String -LiteralPath $trustedDeclarationContract -Pattern 'selectLiveIssueScope' -Quiet)
          if ((Test-Path -LiteralPath $trustedChecker) -and $trustedLiveIssueScope) {
            $guardScript = $trustedChecker
          }
          else {
            Write-Warning 'scope guard bootstrap: AO-free declaration contract is not on base ref yet; using PR head scripts for this migration PR'
            # A PR-head checker is allowed only for the one live, head-bound bootstrap.
            # The base checkout must not silently trust arbitrary PR workflow code.
            $expectedPaths = @(
              'scripts/pr-scope-check.ts',
              'scripts/pr-scope-check.ps1',
              'scripts/pr-scope-declaration.ts',
              'scripts/pr-scope-declaration.test.ts',
              '.github/workflows/scope-guard.yml'
            )
            $changedOutput = & git -C $env:GITHUB_WORKSPACE diff --name-only --no-renames "$env:PR_BASE_SHA...$env:PR_HEAD_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'scope guard bootstrap: unable to read PR changed paths' }
            $changedPaths = @(
              $changedOutput |
                ForEach-Object { [string]$_ } |
                Where-Object { $_ -ne '' }
            )
            $changedPathDifference = @(
              Compare-Object -ReferenceObject ($expectedPaths | Sort-Object) -DifferenceObject ($changedPaths | Sort-Object)
            )
            if (
              $changedPaths.Count -ne $expectedPaths.Count -or
              $changedPathDifference.Count -ne 0
            ) {
              throw 'scope guard bootstrap: PR changed paths do not match the authorized implementation set'
            }

            $packGh = Join-Path $trustedRoot 'scripts/gh'
            $prPayload = & $packGh pr view $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --json body 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'scope guard bootstrap: unable to read PR body' }
            $prBody = ([string]($prPayload | ConvertFrom-Json).body)
            $issueMatches = [regex]::Matches($prBody, '(?im)^\s*(?:closes|fixes|resolves)\s+#(?<number>\d+)\s*$')
            if ($issueMatches.Count -ne 1) { throw 'scope guard bootstrap: expected exactly one linked Issue' }
            $issueNumber = [int]$issueMatches[0].Groups['number'].Value
            $issuePayload = & $packGh issue view $issueNumber --repo $env:GITHUB_REPOSITORY --json body 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'scope guard bootstrap: unable to read linked Issue body' }
            $issueBody = ([string]($issuePayload | ConvertFrom-Json).body)

            $bootstrapLabels = [regex]::Matches(
              $issueBody,
              '(?m)^[ \t]*```scope-guard-bootstrap/v1[ \t]*$'
            )
            if ($bootstrapLabels.Count -ne 1) {
              throw 'scope guard bootstrap: expected exactly one bootstrap declaration label'
            }
            $fences = [regex]::Matches(
              $issueBody,
              '(?ms)^[ \t]*```scope-guard-bootstrap/v1[ \t]*\r?\n(?<body>.*?)\r?\n[ \t]*```[ \t]*$'
            )
            if ($fences.Count -ne 1) {
              throw 'scope guard bootstrap: expected exactly one complete bootstrap declaration'
            }
            try { $bootstrap = $fences[0].Groups['body'].Value | ConvertFrom-Json -ErrorAction Stop }
            catch { throw 'scope guard bootstrap: malformed bootstrap declaration' }

            $expectedBootstrapFields = @(
              'schema',
              'issueNumber',
              'sourceRevision',
              'prNumber',
              'headSha',
              'workflowPath',
              'allowedImplementationPaths',
              'declarationArtifactsAllowed',
              'expiresOnMismatch'
            )
            $actualBootstrapFields = @($bootstrap.PSObject.Properties.Name)
            $fieldDifference = @(
              Compare-Object -ReferenceObject ($expectedBootstrapFields | Sort-Object) -DifferenceObject ($actualBootstrapFields | Sort-Object)
            )
            if (
              $actualBootstrapFields.Count -ne $expectedBootstrapFields.Count -or
              $fieldDifference.Count -ne 0
            ) {
              throw 'scope guard bootstrap: bootstrap fields do not match the closed schema'
            }
            $issueNumberTypeValid = ($bootstrap.issueNumber -is [int]) -or ($bootstrap.issueNumber -is [long])
            $prNumberTypeValid = ($bootstrap.prNumber -is [int]) -or ($bootstrap.prNumber -is [long])
            $pathArrayValid =
              $bootstrap.allowedImplementationPaths -is [System.Array] -and
              @($bootstrap.allowedImplementationPaths | Where-Object { $_ -isnot [string] }).Count -eq 0
            $typesValid =
              $bootstrap.schema -is [string] -and
              $issueNumberTypeValid -and
              $bootstrap.sourceRevision -is [string] -and
              $prNumberTypeValid -and
              $bootstrap.headSha -is [string] -and
              $bootstrap.workflowPath -is [string] -and
              $pathArrayValid -and
              $bootstrap.declarationArtifactsAllowed -is [bool] -and
              $bootstrap.expiresOnMismatch -is [bool]
            if (-not $typesValid) {
              throw 'scope guard bootstrap: bootstrap field types are invalid'
            }

            $revisionMatches = [regex]::Matches(
              $issueBody,
              '(?m)^<!--\s*source-revision:\s*(?<revision>r\d+)\s*-->$'
            )
            if ($revisionMatches.Count -ne 1) {
              throw 'scope guard bootstrap: expected exactly one source revision'
            }
            $revision = $revisionMatches[0].Groups['revision'].Value
            $declaredPaths = @($bootstrap.allowedImplementationPaths | ForEach-Object { [string]$_ })
            $duplicateDeclaredPaths = @(
              $declaredPaths |
                Group-Object |
                Where-Object { $_.Count -ne 1 }
            )
            $bindingValid =
              $bootstrap.schema -eq 'scope-guard-bootstrap/v1' -and
              $bootstrap.issueNumber -eq $issueNumber -and
              $bootstrap.sourceRevision -eq $revision -and
              $bootstrap.prNumber -eq [int]$env:PR_NUMBER -and
              $bootstrap.headSha -eq $env:PR_HEAD_SHA -and
              $bootstrap.workflowPath -eq '.github/workflows/scope-guard.yml' -and
              $bootstrap.declarationArtifactsAllowed -eq $false -and
              $bootstrap.expiresOnMismatch -eq $true -and
              $duplicateDeclaredPaths.Count -eq 0 -and
              $declaredPaths.Count -eq $expectedPaths.Count -and
              -not (Compare-Object -ReferenceObject ($expectedPaths | Sort-Object) -DifferenceObject ($declaredPaths | Sort-Object))
            if (-not $bindingValid) { throw 'scope guard bootstrap: live Issue binding does not authorize PR-head checker' }
            $guardScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/pr-scope-check.ps1'
          }

          Push-Location $trustedRoot
          try {
            npm ci --include=dev
            # PR-head pr-scope-check.ts imports workspace packages; resolve them from the
            # trusted base install without running npm (and lifecycle scripts) on PR head.
            $trustedNodeModules = Join-Path $trustedRoot 'node_modules'
            $prNodeModules = Join-Path $env:GITHUB_WORKSPACE 'node_modules'
            if (Test-Path -LiteralPath $prNodeModules) {
              Remove-Item -LiteralPath $prNodeModules -Recurse -Force -ErrorAction SilentlyContinue
            }
            New-Item -ItemType SymbolicLink -Path $prNodeModules -Target $trustedNodeModules -Force | Out-Null
            & $guardScript
          }
          finally {
            Pop-Location
          }

  test-typecheck:
    name: Type-check pack sources
    needs: classify-pr-changes
    if: |
      !cancelled() &&
      (needs.classify-pr-changes.result == 'skipped' ||
       needs.classify-pr-changes.outputs.markdown_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Type-check TypeScript sources
        run: npx tsc --project tsconfig.base.json --noEmit

      - name: Enforce review-start claim drift guard
        shell: pwsh
        run: ./scripts/check-review-start-claim-guard.ps1

  test-vitest-light:
    name: Vitest light lane ${{ matrix.shard }}/${{ needs.plan-vitest-ci-topology.outputs.light_shard_count }}
    needs: [classify-pr-changes, plan-vitest-ci-topology]
    if: |
      !cancelled() &&
      (needs.classify-pr-changes.result == 'skipped' ||
       needs.classify-pr-changes.outputs.markdown_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-vitest-ci-topology.outputs.light_shard_matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Run Vitest light lane
        shell: pwsh
        run: ./scripts/run-vitest-light-lane.ps1 -Shard ${{ matrix.shard }}

  plan-vitest-ci-topology:
    name: Plan Vitest heavy topology
    needs: classify-pr-changes
    if: |
      !cancelled() &&
      (needs.classify-pr-changes.result == 'skipped' ||
       needs.classify-pr-changes.outputs.markdown_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      heavy_shard_count: ${{ steps.plan.outputs.heavy_shard_count }}
      heavy_shard_matrix: ${{ steps.plan.outputs.heavy_shard_matrix }}
      light_shard_count: ${{ steps.plan.outputs.light_shard_count }}
      light_shard_matrix: ${{ steps.plan.outputs.light_shard_matrix }}
      fallback_classification: ${{ steps.plan.outputs.fallback_classification }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Emit derived heavy topology
        id: plan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPK_VITEST_PR_SCOPE_MODE: ${{ vars.OPK_VITEST_PR_SCOPE_MODE }}
          OPK_DISABLE_PRE_TOPOLOGY_MEASUREMENT: '1'
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            export OPK_CHANGED_VITEST_FILES="$(node scripts/emit-pr-changed-paths-manifest.mjs --base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}")"
          fi
          node scripts/emit-vitest-heavy-topology.mjs --gha-output --skip-oversized-guard

      - name: Upload heavy topology artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-heavy-topology
          path: scripts/vitest-heavy-topology.plan.json
          if-no-files-found: error

  test-vitest-heavy:
    name: Vitest heavy shard ${{ matrix.shard }}/${{ needs.plan-vitest-ci-topology.outputs.heavy_shard_count }}
    needs: [classify-pr-changes, plan-vitest-ci-topology]
    if: |
      !cancelled() &&
      (needs.classify-pr-changes.result == 'skipped' ||
       needs.classify-pr-changes.outputs.markdown_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-vitest-ci-topology.outputs.heavy_shard_matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Download heavy topology artifact
        uses: actions/download-artifact@v4
        with:
          name: vitest-heavy-topology
          path: scripts

      - name: Run Vitest heavy shard
        shell: pwsh
        env:
          OPK_VITEST_TOPOLOGY_PLAN_PATH: ${{ github.workspace }}/scripts/vitest-heavy-topology.plan.json
        run: ./scripts/run-vitest-heavy-shard.ps1 -Shard ${{ matrix.shard }}

  test-pester:
    name: Pester regression
    needs: classify-pr-changes
    if: |
      !cancelled() &&
      (needs.classify-pr-changes.result == 'skipped' ||
       needs.classify-pr-changes.outputs.markdown_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules/Pester
          key: pester-5-${{ runner.os }}-${{ hashFiles('scripts/install-pester-ci.ps1', 'scripts/test-all.ps1') }}
          restore-keys: |
            pester-5-${{ runner.os }}-

      - name: Install Pester
        shell: pwsh
        run: ./scripts/install-pester-ci.ps1

      - name: Run Pester track
        shell: pwsh
        run: ./scripts/test-all.ps1 -SkipNpm

  test-aggregate:
    name: Run pack contract tests
    needs: [classify-pr-changes, plan-vitest-ci-topology, test-typecheck, test-vitest-light, test-vitest-heavy, test-pester]
    if: |
      always() &&
      (needs.classify-pr-changes.result == 'skipped' ||
       needs.classify-pr-changes.outputs.markdown_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail-closed full-regression aggregate
        shell: pwsh
        env:
          TYPECHECK_RESULT: ${{ needs.test-typecheck.result }}
          VITEST_LIGHT_RESULT: ${{ needs.test-vitest-light.result }}
          VITEST_HEAVY_RESULT: ${{ needs.test-vitest-heavy.result }}
          VITEST_TOPOLOGY_PLAN_RESULT: ${{ needs.plan-vitest-ci-topology.result }}
          PESTER_RESULT: ${{ needs.test-pester.result }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./scripts/ci-test-aggregate.ps1

  self-architect-lint:
    name: Self-architect lint
    needs: classify-pr-changes
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.classify-pr-changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run self-architect lint (strict)
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/lint-self-architect.ps1 `
            -Strict `
            -BaseRef $env:PR_BASE_SHA `
            -HeadRef $env:PR_HEAD_SHA
