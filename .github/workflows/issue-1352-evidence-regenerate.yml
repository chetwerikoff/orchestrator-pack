name: Issue 1352 evidence regeneration

on:
  push:
    branches:
      - agent/issue-1352-hard-cut

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-1352-hard-cut
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Regenerate active-test-aware evidence chain
        shell: bash
        env:
          PR_BASE_HEAD: 1c9354c2aa725520d26c9f3925b02ae188a6360c
          BRANCH_NAME: agent/issue-1352-hard-cut
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          base_root="$RUNNER_TEMP/issue-1352-base"
          git worktree add --detach "$base_root" "$PR_BASE_HEAD"
          mkdir -p "$base_root/scripts/json-producers" "$base_root/docs/investigations/runtime-hard-cut"
          cp scripts/json-producers/retired-runtime-surfaces.json "$base_root/scripts/json-producers/retired-runtime-surfaces.json"
          cp docs/investigations/runtime-hard-cut/historical-dispositions.json "$base_root/docs/investigations/runtime-hard-cut/historical-dispositions.json"

          BASE_ROOT="$base_root" node --experimental-strip-types --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { scanRetiredRuntimeSurfaces } from './scripts/runtime-retirement/retired-surface-guard.ts';

          const repoRoot = process.cwd();
          const baseRoot = process.env.BASE_ROOT;
          const prBaseHead = process.env.PR_BASE_HEAD;
          if (!baseRoot || !prBaseHead) throw new Error('missing evidence binding');
          const baseScan = scanRetiredRuntimeSurfaces({ repoRoot: baseRoot });

          function classify(hit) {
            switch (hit.surfaceId) {
              case 'legacy-plugin-identity': {
                const text = `${hit.path}\n${hit.match}`;
                if (text.includes('task-declaration')) return 'AO-07';
                if (text.includes('scope-guard')) return 'AO-08';
                if (text.includes('token-chain-ledger')) return 'AO-09';
                return 'AO-10';
              }
              case 'legacy-runtime-selector':
              case 'compatibility-alias': return 'AO-11';
              case 'legacy-daemon-http': return 'AO-02';
              case 'legacy-config-state-root': return hit.match.includes('.ao') ? 'AO-12' : 'AO-04';
              case 'legacy-runtime-command':
                return hit.match.includes(' review') ? 'AO-03'
                  : /\s(?:send|report|acknowledge)(?:\s|$)/.test(hit.match) ? 'AO-05'
                  : 'AO-01';
              case 'legacy-adapter-symbol':
                return /Review/i.test(hit.match) ? 'AO-03'
                  : /Worker|Session/i.test(hit.match) ? 'AO-05' : 'AO-01';
              case 'legacy-runtime-name':
                return hit.path.startsWith('docs/') || hit.path === 'AGENTS.md' || hit.path === 'CLAUDE.md'
                  || hit.path.startsWith('prompts/') || hit.path.startsWith('.claude/') || hit.path.startsWith('.cursor/')
                  ? 'AO-06' : 'AO-01';
              default: throw new Error(`unclassified surface ${hit.surfaceId}`);
            }
          }

          function renameTarget(path, aoClass) {
            const plugin = {
              'AO-07': 'task-declaration',
              'AO-08': 'scope-guard',
              'AO-09': 'token-chain-ledger',
              'AO-10': 'codex-pr-reviewer',
            }[aoClass];
            if (plugin && path.startsWith('plugins/')) return `plugins/${plugin}`;
            if (path.startsWith('scripts/ao-retirement/')) return path.replace('scripts/ao-retirement/', 'scripts/runtime-retirement/');
            return undefined;
          }

          const hits = baseScan.violations.map((hit) => {
            const aoClass = classify(hit);
            const replacementPath = renameTarget(hit.path, aoClass);
            const currentPathExists = existsSync(join(repoRoot, hit.path));
            const disposition = replacementPath ? 'rename-runtime-neutral'
              : currentPathExists ? 'port-live-behavior' : 'delete-ao-only';
            const id = createHash('sha256')
              .update(`${hit.surfaceId}\0${hit.path}\0${hit.line}\0${hit.match}`)
              .digest('hex');
            const reason = disposition === 'rename-runtime-neutral'
              ? `Retired identity is replaced by ${replacementPath}.`
              : disposition === 'port-live-behavior'
                ? 'The file survives, but the retired surface is removed and observable behavior is retained through runtime-neutral authority.'
                : 'The retired surface has no surviving behavior and its containing path is deleted by the hard cut.';
            return {
              id, path: hit.path, line: hit.line, selector: hit.surfaceId, match: hit.match,
              aoClass, disposition, ...(replacementPath ? { replacementPath } : {}), reason,
            };
          });

          const baseline = {
            schemaVersion: 'orchestrator-pack/runtime-hard-cut-baseline/v1',
            issueNumber: 1352,
            prBaseHead,
            scannerAuthority: 'scripts/json-producers/retired-runtime-surfaces.json',
            historicalDispositionSource: 'docs/investigations/runtime-hard-cut/historical-dispositions.json',
            scannedFileCount: baseScan.scannedFileCount,
            hitCount: hits.length,
            hits,
          };
          const target = join(repoRoot, 'docs/investigations/runtime-hard-cut/baseline.json');
          mkdirSync(join(repoRoot, 'docs/investigations/runtime-hard-cut'), { recursive: true });
          writeFileSync(target, `${JSON.stringify(baseline, null, 2)}\n`);
          console.log(JSON.stringify({ baseScanned: baseScan.scannedFileCount, baselineHits: hits.length }));
          NODE

          git add docs/investigations/runtime-hard-cut/baseline.json
          git commit -m "docs(issue-1352): refresh active-test retirement baseline"

          git rm .github/workflows/issue-1352-evidence-regenerate.yml \
            .github/workflows/issue-1352-test-scan-diagnostic.yml \
            scripts/runtime-retirement/issue-1352-active-test-scan.diagnostic.test.ts
          git commit -m "chore(issue-1352): remove test scan diagnostics"

          node --experimental-strip-types --input-type=module <<'NODE'
          import { scanRetiredRuntimeSurfaces } from './scripts/runtime-retirement/retired-surface-guard.ts';
          const result = scanRetiredRuntimeSurfaces({ repoRoot: process.cwd() });
          if (result.violations.length !== 0) {
            console.error(JSON.stringify(result.violations.slice(0, 100), null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ currentScanned: result.scannedFileCount, violations: 0 }));
          NODE

          scanned_code_head="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PR_BASE_HEAD" "$scanned_code_head"

          PR_BASE_HEAD="$PR_BASE_HEAD" SCANNED_CODE_HEAD="$scanned_code_head" node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { scanRetiredRuntimeSurfaces } from './scripts/runtime-retirement/retired-surface-guard.ts';
          const prBaseHead = process.env.PR_BASE_HEAD;
          const scannedCodeHead = process.env.SCANNED_CODE_HEAD;
          if (!prBaseHead || !scannedCodeHead) throw new Error('missing final evidence binding');
          const baseline = JSON.parse(readFileSync('docs/investigations/runtime-hard-cut/baseline.json', 'utf8'));
          const currentScan = scanRetiredRuntimeSurfaces({ repoRoot: process.cwd() });
          if (currentScan.violations.length !== 0) throw new Error('final scan must have zero active violations');
          const outcomes = baseline.hits.map((hit) => ({
            id: hit.id,
            path: hit.path,
            selector: hit.selector,
            aoClass: hit.aoClass,
            status: hit.disposition === 'rename-runtime-neutral' ? 'renamed'
              : hit.disposition === 'port-live-behavior' ? 'ported' : 'deleted',
            ...(hit.replacementPath ? { replacementPath: hit.replacementPath } : {}),
          }));
          if (new Set(outcomes.map((row) => row.id)).size !== baseline.hits.length) {
            throw new Error('baseline identity closure is not one-to-one');
          }
          const finalEvidence = {
            schemaVersion: 'orchestrator-pack/runtime-hard-cut-final/v1',
            issueNumber: 1352,
            prBaseHead,
            scannedCodeHead,
            baselinePath: 'docs/investigations/runtime-hard-cut/baseline.json',
            baselineHitCount: baseline.hits.length,
            currentScan: {
              scannerAuthority: 'scripts/json-producers/retired-runtime-surfaces.json',
              scannedFileCount: currentScan.scannedFileCount,
              violationCount: 0,
            },
            outcomes,
          };
          writeFileSync('docs/investigations/runtime-hard-cut/final.json', `${JSON.stringify(finalEvidence, null, 2)}\n`);
          NODE

          git add docs/investigations/runtime-hard-cut/final.json
          changed="$(git diff --cached --name-only)"
          test "$changed" = "docs/investigations/runtime-hard-cut/final.json"
          git commit -m "docs(issue-1352): republish active-test final evidence"
          evidence_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$scanned_code_head"
          test "$(git diff-tree --no-commit-id --name-only -r "$evidence_head")" = "docs/investigations/runtime-hard-cut/final.json"

          git push origin "HEAD:$BRANCH_NAME"
          printf 'scanned_code_head=%s\nevidence_head=%s\n' "$scanned_code_head" "$evidence_head"
