name: Issue 1276 fix CI expectations

on:
  push:
    branches:
      - chetwerikoff/issue-1276
    paths:
      - .github/workflows/issue-1276-fix-ci-expectations.yml

permissions:
  contents: write

jobs:
  fix-source:
    if: github.repository == 'chetwerikoff/orchestrator-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chetwerikoff/issue-1276
      - name: Preserve frozen-identity error ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/pack-review-run-store.ts')
          text = path.read_text(encoding='utf-8')

          old_collision = 'retryable zero-send collision requires exhausted-attempt refusal evidence'
          new_collision = 'terminal class for retryable zero-send collision requires exhausted-attempt refusal evidence'
          if text.count(old_collision) != 1:
              raise SystemExit('expected retryable collision message exactly once')
          text = text.replace(old_collision, new_collision, 1)

          old_block = """    candidate.reviewRound = mergeFrozenGptRound(
              existing.reviewRound,
              normalizePackReviewGptRoundRecord(candidate.reviewRound, path),
              path,
            );
          """
          new_block = """    const incomingReviewRound = asObject(candidate.reviewRound);
            const immutableFields = [
              'schema',
              'reviewer',
              'tier',
              'roundOrdinal',
              'cardinality',
              'issueNumber',
              'boundIssueSnapshotDigest',
            ] as const;
            for (const field of immutableFields) {
              if (existing.reviewRound[field] !== incomingReviewRound[field]) {
                throw new Error(`corrupt pack review run record at ${path}: frozen reviewRound ${field} cannot change`);
              }
            }
            candidate.reviewRound = mergeFrozenGptRound(
              existing.reviewRound,
              normalizePackReviewGptRoundRecord(candidate.reviewRound, path),
              path,
            );
          """
          if text.count(old_block) != 1:
              raise SystemExit('expected reviewRound merge block exactly once')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/lib/pack-review-run-store.ts
          git commit -m 'fix: preserve frozen GPT identity validation order'
          git push origin HEAD:chetwerikoff/issue-1276
