name: issue-1352-base-sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-current-main:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-base-sync-trigger' && github.event.pull_request.base.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge current main, verify, and publish
        id: merge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'current main already integrated'
            exit 0
          fi
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            artifact="$RUNNER_TEMP/issue-1352-merge-conflicts"
            mkdir -p "$artifact/base" "$artifact/ours" "$artifact/theirs" "$artifact/merged"
            git diff --name-only --diff-filter=U | sort | tee "$artifact/conflicts.txt"
            git diff --cc > "$artifact/conflict.diff"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              mkdir -p "$artifact/base/$(dirname "$path")" "$artifact/ours/$(dirname "$path")" "$artifact/theirs/$(dirname "$path")" "$artifact/merged/$(dirname "$path")"
              git show ":1:$path" > "$artifact/base/$path" || true
              git show ":2:$path" > "$artifact/ours/$path" || true
              git show ":3:$path" > "$artifact/theirs/$path" || true
              cp "$path" "$artifact/merged/$path"
            done < "$artifact/conflicts.txt"
            cat > "$RUNNER_TEMP/expected-conflicts.txt" <<'EOF'
          scripts/chatgpt-browser-turn/state-light-turn.ts
          scripts/flow-manager-long-running-child.test.ts
          scripts/flow-manager-long-running-child.ts
          EOF
            if ! cmp -s "$RUNNER_TEMP/expected-conflicts.txt" "$artifact/conflicts.txt"; then
              echo 'unexpected current-main conflict set' >&2
              diff -u "$RUNNER_TEMP/expected-conflicts.txt" "$artifact/conflicts.txt" || true
              exit 86
            fi

            # These files implement active runtime-neutral browser recovery and EOF
            # cancellation. The #1352 side changed them only by removing that live
            # behavior plus three AO-keyed incident fallbacks. Preserve current main
            # wholesale, then reapply only the selector neutralization authorized by AO-11.
            git checkout --theirs -- \
              scripts/chatgpt-browser-turn/state-light-turn.ts \
              scripts/flow-manager-long-running-child.test.ts \
              scripts/flow-manager-long-running-child.ts
            python - <<'PY'
          from pathlib import Path

          path = Path('scripts/chatgpt-browser-turn/state-light-turn.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "const issue = String(env.CREATE_ISSUE_DRAFT_ISSUE ?? env.AO_ISSUE_NUMBER ?? '').trim();":
                  "const issue = String(env.CREATE_ISSUE_DRAFT_ISSUE ?? '').trim();",
              "const pr = String(env.PACK_REVIEW_PR_NUMBER ?? env.AO_PR_NUMBER ?? '').trim();":
                  "const pr = String(env.PACK_REVIEW_PR_NUMBER ?? '').trim();",
              "const agent = String(env.AO_AGENT ?? env.PACK_FLOW_MANAGER ?? process.title ?? 'node').trim();":
                  "const agent = String(env.OPK_AGENT ?? env.PACK_FLOW_MANAGER ?? process.title ?? 'node').trim();",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected selector occurrence count {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            git add \
              scripts/chatgpt-browser-turn/state-light-turn.ts \
              scripts/flow-manager-long-running-child.test.ts \
              scripts/flow-manager-long-running-child.ts
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'unresolved merge entries remain' >&2
              git diff --name-only --diff-filter=U >&2
              exit 87
            fi
          fi
          npm ci --include=dev
          npm run typecheck:foundation
          npm run lint:foundation
          npm test -- --maxWorkers=1 \
            scripts/chatgpt-browser-turn/state-light-fresh-conversation.test.ts \
            scripts/chatgpt-browser-turn/tab-lifecycle.test.ts \
            scripts/flow-manager-long-running-child.test.ts \
            --reporter=dot
          git diff --check
          git commit -m 'merge: integrate current main for issue 1352 evidence'
          git push origin HEAD:agent/issue-1352-hard-cut
      - name: Upload conflict evidence
        if: steps.merge.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: issue-1352-merge-conflicts
          path: ${{ runner.temp }}/issue-1352-merge-conflicts
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail after preserving conflict evidence
        if: steps.merge.outcome == 'failure'
        shell: bash
        run: exit 1
