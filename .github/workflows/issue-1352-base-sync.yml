name: issue-1352-base-sync

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  integrate-current-main:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge current main, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'current main already integrated'
            exit 0
          fi
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git merge --no-commit --no-ff origin/main
          npm ci --include=dev
          npm run typecheck:foundation
          npm run lint:foundation
          git diff --check
          git commit -m 'merge: integrate current main for issue 1352 evidence'
          git push origin HEAD:agent/issue-1352-hard-cut
