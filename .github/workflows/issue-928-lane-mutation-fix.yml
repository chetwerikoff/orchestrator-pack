name: issue-928-lane-mutation-fix

on:
  push:
    branches:
      - agent/issue-928-cutover-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-928-cutover-final
          fetch-depth: 0
      - name: Bind lane mutations to exact Issue 928 test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/cutover/mutation-runner.ts';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["delete v.classification['scripts/pr2a/planning.test.ts'];", 'delete v.classification[P.planningTest];'],
            ["v.heavyFileBatchIsolate.push('scripts/pr2a/planning.test.ts');", 'v.heavyFileBatchIsolate.push(P.planningTest);'],
          ];
          for (const [before, after] of replacements) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`expected one lane mutation token, got ${count}: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source, 'utf8');
          fs.rmSync('.github/workflows/issue-928-lane-mutation-fix.yml', { force: true });
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: bind issue 928 lane mutations"
          git push origin HEAD:agent/issue-928-cutover-final
