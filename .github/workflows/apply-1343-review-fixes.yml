name: Apply Issue 1343 review fixes

on:
  push:

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger Issue 1343 fix transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore reviewed implementation
        run: |
          set -euo pipefail
          base64 -d .github/1343-run.gz.b64 | gzip -d > scripts/worker-smoke-run.ts
          base64 -d .github/1343-test.gz.b64 | gzip -d > scripts/worker-smoke.test.ts
          node --experimental-strip-types --check scripts/worker-smoke-run.ts
          node --experimental-strip-types --check scripts/worker-smoke.test.ts

      - name: Update operator documentation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('docs/worker-smoke-testing.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              """The singular local receipt remains the current-publication witness used at the final gate. It is
not historical authority for earlier aggregate contributors and does not order comments.
""": """The singular local receipt remains a witness for one admitted current-head publication at the final
gate. It may match any admitted current-head report still represented by the stabilized census; it
does not select the latest or clearing comment, authenticate historical contributors, or order
aggregate evidence. Comment publication order remains the only aggregate authority.
""",
              """The semantic authority point is the final stabilized census used by one gate invocation. A relevant
publication observed while stabilization is in progress forces a complete re-evaluation or bounded
denial. A comment published after the final stable observation belongs to the next invocation and
does not retroactively rewrite an already-emitted `ready_for_review` record.
""": """The semantic authority point is the final stabilized census used by one gate invocation. A relevant
publication observed while stabilization is in progress forces a complete re-evaluation or bounded
denial. After adapter, CI, and receipt checks, an immediate complete re-census must still match the
stabilized digest before allow; a changed census is denied rather than silently omitted. A comment
published after that final stable observation belongs to the next invocation and does not
retroactively rewrite an already-emitted `ready_for_review` record.
""",
              """- the current clearing publication's terminal cleanup and singular receipt/provenance validate; and
""": """- one admitted current-head publication's terminal cleanup and singular receipt/provenance validate; and
""",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'documentation anchor missing: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci
          gh issue view 1343 --repo chetwerikoff/orchestrator-pack --json body --jq .body > /tmp/issue-1343.md
          node --experimental-strip-types scripts/pr-scope-declaration.ts \
            --issue 1343 \
            --issue-body-file /tmp/issue-1343.md \
            --declared-paths docs/worker-smoke-testing.md,scripts/lib/worker-smoke-core-base.ts,scripts/lib/worker-smoke-core.ts,scripts/worker-smoke-run.ts,scripts/worker-smoke.test.ts \
            --output docs/declarations/1343.pr-scope.json
          npm run check:node-major --silent
          node scripts/run-vitest-with-harness.mjs run --maxWorkers=1 scripts/worker-smoke.test.ts
          npm run typecheck:foundation
          npm run lint:foundation

      - name: Publish clean branch
        run: |
          set -euo pipefail
          rm -f \
            .github/1343-run.gz.b64 \
            .github/1343-test.gz.b64 \
            .github/workflows/apply-1343-review-fixes.yml \
            docs/declarations/1343-fix.patch \
            docs/declarations/1343-trigger.txt \
            docs/declarations/1343-transport-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix all worker-smoke aggregate review findings'
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(docs/declarations/1343\.pr-scope\.json|docs/worker-smoke-testing\.md|scripts/lib/worker-smoke-core-base\.ts|scripts/lib/worker-smoke-core\.ts|scripts/worker-smoke-run\.ts|scripts/worker-smoke\.test\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected final PR paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
