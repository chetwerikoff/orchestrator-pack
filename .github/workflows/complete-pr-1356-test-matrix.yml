name: Complete PR 1356 test matrix

on:
  push:
    branches:
      - agent/issue-1341-operator-inputs

permissions:
  contents: write

jobs:
  complete-tests:
    if: github.repository == 'chetwerikoff/orchestrator-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1341-operator-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply accepted test matrix
        env:
          TEST_APPEND_GZIP_B64: >-
            
        shell: bash
        run: |
          python3 <<'PYCODE'
          import base64
          import gzip
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path('scripts/lib/create-issue-stage-record-artifacts.test.ts')
          original_blob = subprocess.check_output(['git', 'hash-object', str(target)], text=True).strip()
          if original_blob != '78693c0e10f2ab016aefd58b0d31323ed9553199':
              raise SystemExit(f'unexpected starting test blob: {original_blob}')

          payload = gzip.decompress(base64.b64decode(os.environ['TEST_APPEND_GZIP_B64']))
          if hashlib.sha256(payload).hexdigest() != 'e7235fd5aef412bae7bd3f1030a4c63a04ff6f19c1a0d8bb0120bd77d7c92d5e':
              raise SystemExit('test payload digest mismatch')

          marker = b"describe('Issue #1341 accepted operator-input smoke matrix completion'"
          current = target.read_bytes()
          if marker in current:
              raise SystemExit('accepted test matrix is already present')
          target.write_bytes(current + b'\n\n\n\n\n' + payload)

          final_blob = subprocess.check_output(['git', 'hash-object', str(target)], text=True).strip()
          if final_blob != '503ec8b4032b39b12dd3f918dcc1099cd6191136':
              raise SystemExit(f'unexpected completed test blob: {final_blob}')
          PYCODE
      - name: Run accepted focused matrix
        run: >-
          node scripts/run-vitest-with-harness.mjs run --maxWorkers=1
          scripts/pack-review-runner-gpt.test.ts
          scripts/lib/create-issue-stage-record-artifacts.test.ts
          scripts/lib/create-issue-stage-record.test.ts
      - run: git diff --check
      - name: Publish tests and remove bootstrap
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/lib/create-issue-stage-record-artifacts.test.ts
          git rm -- .github/workflows/complete-pr-1356-test-matrix.yml
          git diff --cached --check
          git commit -m "test: complete issue 1341 operator input matrix"
          git push origin HEAD:agent/issue-1341-operator-inputs
