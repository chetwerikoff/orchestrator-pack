name: TypeScript foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: TypeScript runtime (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Execute TypeScript without a build artifact
        run: npm run ts:smoke

  typecheck:
    name: TypeScript strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Typecheck without emit
        run: npm run typecheck:foundation

  lint:
    name: TypeScript policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce Promise and subprocess policies
        run: npm run lint:foundation

  kernels:
    name: TypeScript kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Run in-process foundation tests
        run: npm run test:foundation

  powershell-child-growth:
    name: PowerShell child-test growth guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce committed PowerShell child-test baseline
        run: npm run check:pwsh-test-growth

  contract-mutations:
    name: Contract mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Detect complete mutation surface
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const required = [
            'scripts/pr2-foundation/mutation-runner.ts',
            'scripts/pr2-foundation/mutation-catalog.ts',
            'scripts/pr2-foundation/mutation-semantic-gates.ts',
          ];
          const present = required.filter((file) => fs.existsSync(file));
          const command = pkg.scripts?.['test:contract-mutations'];
          if (!command && present.length > 0) {
            throw new Error(`partial mutation surface without test:contract-mutations: ${present.join(',')}`);
          }
          if (command && present.length !== required.length) {
            throw new Error(`test:contract-mutations without complete mutation surface: ${present.length}/${required.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_evidence=${command ? 'true' : 'false'}\n`);
          console.log(command ? 'complete mutation surface detected' : 'mutation surface absent');
          NODE
      - name: Run external red-green mutation evidence
        if: steps.detect.outputs.run_evidence == 'true'
        run: npm run test:contract-mutations

  issue-1352-evidence:
    name: Issue 1352 active-test evidence artifact
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1378
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Generate exact-base baseline and current scan receipt
        shell: bash
        env:
          PR_BASE_HEAD: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/issue-1352-base"
          evidence_dir="$RUNNER_TEMP/issue-1352-evidence"
          mkdir -p "$evidence_dir"
          git worktree add --detach "$base_root" "$PR_BASE_HEAD"
          mkdir -p "$base_root/scripts/json-producers" "$base_root/docs/investigations/runtime-hard-cut"
          cp scripts/json-producers/retired-runtime-surfaces.json "$base_root/scripts/json-producers/retired-runtime-surfaces.json"
          cp docs/investigations/runtime-hard-cut/historical-dispositions.json "$base_root/docs/investigations/runtime-hard-cut/historical-dispositions.json"

          BASE_ROOT="$base_root" EVIDENCE_DIR="$evidence_dir" node --experimental-strip-types --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { scanRetiredRuntimeSurfaces } from './scripts/runtime-retirement/retired-surface-guard.ts';

          const repoRoot = process.cwd();
          const baseRoot = process.env.BASE_ROOT;
          const evidenceDir = process.env.EVIDENCE_DIR;
          const prBaseHead = process.env.PR_BASE_HEAD;
          const prHeadSha = process.env.PR_HEAD_SHA;
          if (!baseRoot || !evidenceDir || !prBaseHead || !prHeadSha) throw new Error('missing evidence binding');
          const baseScan = scanRetiredRuntimeSurfaces({ repoRoot: baseRoot });
          const currentScan = scanRetiredRuntimeSurfaces({ repoRoot });

          function classify(hit) {
            switch (hit.surfaceId) {
              case 'legacy-plugin-identity': {
                const text = `${hit.path}\n${hit.match}`;
                if (text.includes('task-declaration')) return 'AO-07';
                if (text.includes('scope-guard')) return 'AO-08';
                if (text.includes('token-chain-ledger')) return 'AO-09';
                return 'AO-10';
              }
              case 'legacy-runtime-selector':
              case 'compatibility-alias': return 'AO-11';
              case 'legacy-daemon-http': return 'AO-02';
              case 'legacy-config-state-root': return hit.match.includes('.ao') ? 'AO-12' : 'AO-04';
              case 'legacy-runtime-command':
                return hit.match.includes(' review') ? 'AO-03'
                  : /\s(?:send|report|acknowledge)(?:\s|$)/.test(hit.match) ? 'AO-05'
                  : 'AO-01';
              case 'legacy-adapter-symbol':
                return /Review/i.test(hit.match) ? 'AO-03'
                  : /Worker|Session/i.test(hit.match) ? 'AO-05' : 'AO-01';
              case 'legacy-runtime-name':
                return hit.path.startsWith('docs/') || hit.path === 'AGENTS.md' || hit.path === 'CLAUDE.md'
                  || hit.path.startsWith('prompts/') || hit.path.startsWith('.claude/') || hit.path.startsWith('.cursor/')
                  ? 'AO-06' : 'AO-01';
              default: throw new Error(`unclassified surface ${hit.surfaceId}`);
            }
          }

          function renameTarget(path, aoClass) {
            const plugin = {
              'AO-07': 'task-declaration',
              'AO-08': 'scope-guard',
              'AO-09': 'token-chain-ledger',
              'AO-10': 'codex-pr-reviewer',
            }[aoClass];
            if (plugin && path.startsWith('plugins/')) return `plugins/${plugin}`;
            if (path.startsWith('scripts/ao-retirement/')) return path.replace('scripts/ao-retirement/', 'scripts/runtime-retirement/');
            return undefined;
          }

          const hits = baseScan.violations.map((hit) => {
            const aoClass = classify(hit);
            const replacementPath = renameTarget(hit.path, aoClass);
            const currentPathExists = existsSync(join(repoRoot, hit.path));
            const disposition = replacementPath ? 'rename-runtime-neutral'
              : currentPathExists ? 'port-live-behavior' : 'delete-ao-only';
            const id = createHash('sha256')
              .update(`${hit.surfaceId}\0${hit.path}\0${hit.line}\0${hit.match}`)
              .digest('hex');
            const reason = disposition === 'rename-runtime-neutral'
              ? `Retired identity is replaced by ${replacementPath}.`
              : disposition === 'port-live-behavior'
                ? 'The file survives, but the retired surface is removed and observable behavior is retained through runtime-neutral authority.'
                : 'The retired surface has no surviving behavior and its containing path is deleted by the hard cut.';
            return {
              id, path: hit.path, line: hit.line, selector: hit.surfaceId, match: hit.match,
              aoClass, disposition, ...(replacementPath ? { replacementPath } : {}), reason,
            };
          });

          const baseline = {
            schemaVersion: 'orchestrator-pack/runtime-hard-cut-baseline/v1',
            issueNumber: 1352,
            prBaseHead,
            scannerAuthority: 'scripts/json-producers/retired-runtime-surfaces.json',
            historicalDispositionSource: 'docs/investigations/runtime-hard-cut/historical-dispositions.json',
            scannedFileCount: baseScan.scannedFileCount,
            hitCount: hits.length,
            hits,
          };
          const receipt = {
            prBaseHead,
            prHeadSha,
            baseScannedFileCount: baseScan.scannedFileCount,
            baselineHitCount: hits.length,
            currentScannedFileCount: currentScan.scannedFileCount,
            currentViolationCount: currentScan.violations.length,
            currentViolations: currentScan.violations,
          };
          writeFileSync(join(evidenceDir, 'baseline.json'), `${JSON.stringify(baseline, null, 2)}\n`);
          writeFileSync(join(evidenceDir, 'receipt.json'), `${JSON.stringify(receipt, null, 2)}\n`);
          if (currentScan.violations.length !== 0) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1352-active-test-evidence
          path: ${{ runner.temp }}/issue-1352-evidence
          if-no-files-found: error
