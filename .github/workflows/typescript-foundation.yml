name: TypeScript foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply-issue-1283-production-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/issue-1283-browser-turn-recovery'
    name: Apply Issue 1283 production proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BRANCH: agent/issue-1283-browser-turn-recovery
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1283-browser-turn-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Apply production recovery tests
        run: python scripts/chatgpt-browser-turn/apply-1283-production-tests.py
      - name: Run focused production recovery suite
        run: >-
          npm test --
          scripts/chatgpt-browser-turn/state-light-fresh-conversation.test.ts
          scripts/chatgpt-browser-turn/tab-lifecycle.test.ts
          scripts/flow-manager-long-running-child.test.ts
      - name: Typecheck without emit
        run: npm run typecheck:foundation
      - name: Regenerate scope and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          gh issue view 1283 --repo chetwerikoff/orchestrator-pack --json body --jq .body > /tmp/issue-1283-r07.md
          rm -f scripts/chatgpt-browser-turn/apply-1283-production-tests.py
          rm -f .github/workflows/issue-1283-production-tests.yml
          git checkout "$PR_BASE_SHA" -- .github/workflows/typescript-foundation.yml
          node --experimental-strip-types scripts/pr-scope-declaration.ts \
            --issue 1283 \
            --issue-body-file /tmp/issue-1283-r07.md \
            --declared-paths '.claude/skills/create-issue-draft/SKILL.md,docs/declarations/1283.pr-scope.json,scripts/chatgpt-browser-turn/state-light-cancellation.ts,scripts/chatgpt-browser-turn/state-light-fresh-conversation.test.ts,scripts/chatgpt-browser-turn/state-light-turn-recovery.ts,scripts/chatgpt-browser-turn/state-light-turn.ts,scripts/chatgpt-browser-turn/tab-lifecycle.test.ts,scripts/flow-manager-long-running-child.test.ts,scripts/flow-manager-long-running-child.ts,scripts/toolchain/chatgpt-browser-turn.review-fixes.test.ts' \
            --output docs/declarations/1283.pr-scope.json
      - name: Commit and push verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(browser-turn): prove production recovery ownership'
          git push origin "HEAD:${BRANCH}"

  runtime:
    name: TypeScript runtime (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Execute TypeScript without a build artifact
        run: npm run ts:smoke

  typecheck:
    name: TypeScript strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Typecheck without emit
        run: npm run typecheck:foundation

  lint:
    name: TypeScript policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce Promise and subprocess policies
        run: npm run lint:foundation

  kernels:
    name: TypeScript kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Run in-process foundation tests
        run: npm run test:foundation

  powershell-child-growth:
    name: PowerShell child-test growth guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce committed PowerShell child-test baseline
        run: npm run check:pwsh-test-growth

  contract-mutations:
    name: Contract mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Detect complete mutation surface
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const required = [
            'scripts/pr2-foundation/mutation-runner.ts',
            'scripts/pr2-foundation/mutation-catalog.ts',
            'scripts/pr2-foundation/mutation-semantic-gates.ts',
          ];
          const present = required.filter((file) => fs.existsSync(file));
          const command = pkg.scripts?.['test:contract-mutations'];
          if (!command && present.length > 0) {
            throw new Error(`partial mutation surface without test:contract-mutations: ${present.join(',')}`);
          }
          if (command && present.length !== required.length) {
            throw new Error(`test:contract-mutations without complete mutation surface: ${present.length}/${required.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_evidence=${command ? 'true' : 'false'}\n`);
          console.log(command ? 'complete mutation surface detected' : 'mutation surface absent');
          NODE
      - name: Run external red-green mutation evidence
        if: steps.detect.outputs.run_evidence == 'true'
        run: npm run test:contract-mutations
