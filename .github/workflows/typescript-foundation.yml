name: TypeScript foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: TypeScript runtime (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Execute TypeScript without a build artifact
        run: npm run ts:smoke
      - name: Diagnose Issue 1469 S2 production guard
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "${root}/scripts"
          printf 'export {};\n' > "${root}/scripts/legacy-runtime-history.test.ts"
          cat > "${root}/scripts/vitest-runtime-history.json" <<'JSON'
          {
            "issue": 556,
            "source": "ci-measured",
            "dataChangedAt": "2026-08-18T15:00:00.000Z",
            "smoothingRule": "median-of-last-5-samples",
            "files": {"scripts/legacy-runtime-history.test.ts": 45000},
            "provenance": {"scripts/legacy-runtime-history.test.ts": "seeded"},
            "recentSamples": {},
            "fileChangedAt": {}
          }
          JSON
          cat > "${root}/remote.json" <<'JSON'
          {
            "issue": 556,
            "source": "ci-measured",
            "dataChangedAt": "2026-08-18T16:00:00.000Z",
            "smoothingRule": "median-of-last-5-samples",
            "files": {},
            "provenance": {"scripts/legacy-runtime-history.test.ts": "fallback"},
            "recentSamples": {},
            "fileChangedAt": {}
          }
          JSON
          set +e
          (cd "${root}" && GITHUB_ACTIONS=true node "${GITHUB_WORKSPACE}/scripts/refresh-vitest-runtime-history.mjs" reconcile \
            --remote "${root}/remote.json" \
            --proposed "${root}/scripts/vitest-runtime-history.json" \
            --output "${root}/output.json" \
            --repo-root "${root}" \
            --require-equal-inventory)
          rc=$?
          set -e
          echo "S2 diagnostic exit=${rc}"
          test "${rc}" -ne 0
          rm -rf "${root}"
      - name: Run Issue 1469 focused runtime-history smoke
        run: node scripts/vitest-runtime-history-reconcile-legacy.fixture.mjs
      - name: Enforce retired runtime surfaces from Node 22
        run: node --experimental-strip-types scripts/runtime-retirement/retired-surface-selftest.ts

  typecheck:
    name: TypeScript strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Typecheck without emit
        run: npm run typecheck:foundation

  lint:
    name: TypeScript policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce Promise and subprocess policies
        run: npm run lint:foundation

  kernels:
    name: TypeScript kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Run in-process foundation tests
        run: npm run test:foundation

  powershell-child-growth:
    name: PowerShell child-test growth guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce committed PowerShell child-test baseline
        run: npm run check:pwsh-test-growth

  contract-mutations:
    name: Contract mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Detect complete mutation surface
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const required = [
            'scripts/pr2-foundation/mutation-runner.ts',
            'scripts/pr2-foundation/mutation-catalog.ts',
            'scripts/pr2-foundation/mutation-semantic-gates.ts',
          ];
          const present = required.filter((file) => fs.existsSync(file));
          const command = pkg.scripts?.['test:contract-mutations'];
          if (!command && present.length > 0) {
            throw new Error(`partial mutation surface without test:contract-mutations: ${present.join(',')}`);
          }
          if (command && present.length !== required.length) {
            throw new Error(`test:contract-mutations without complete mutation surface: ${present.length}/${required.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_evidence=${command ? 'true' : 'false'}\n`);
          console.log(command ? 'complete mutation surface detected' : 'mutation surface absent');
          NODE
      - name: Run external red-green mutation evidence
        if: steps.detect.outputs.run_evidence == 'true'
        run: npm run test:contract-mutations
