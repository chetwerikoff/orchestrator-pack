name: TypeScript foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: TypeScript runtime (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Execute TypeScript without a build artifact
        run: npm run ts:smoke

  typecheck:
    name: TypeScript strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Typecheck without emit
        run: npm run typecheck:foundation

  lint:
    name: TypeScript policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce Promise and subprocess policies
        run: npm run lint:foundation

  kernels:
    name: TypeScript kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Run in-process foundation tests
        run: npm run test:foundation

  powershell-child-growth:
    name: PowerShell child-test growth guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce committed PowerShell child-test baseline
        run: npm run check:pwsh-test-growth

  contract-mutations:
    name: Contract mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Detect complete mutation surface
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const required = [
            'scripts/pr2-foundation/mutation-runner.ts',
            'scripts/pr2-foundation/mutation-catalog.ts',
            'scripts/pr2-foundation/mutation-semantic-gates.ts',
          ];
          const present = required.filter((file) => fs.existsSync(file));
          const command = pkg.scripts?.['test:contract-mutations'];
          if (!command && present.length > 0) {
            throw new Error(`partial mutation surface without test:contract-mutations: ${present.join(',')}`);
          }
          if (command && present.length !== required.length) {
            throw new Error(`test:contract-mutations without complete mutation surface: ${present.length}/${required.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_evidence=${command ? 'true' : 'false'}\n`);
          console.log(command ? 'complete mutation surface detected' : 'mutation surface absent');
          NODE
      - name: Run external red-green mutation evidence
        if: steps.detect.outputs.run_evidence == 'true'
        run: npm run test:contract-mutations

  retirement-scan:
    name: Runtime retirement census (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full retired-surface scanner
        run: node --experimental-strip-types scripts/runtime-retirement/retired-surface-guard.ts

  issue-1352-exact-detector-cleanup:
    name: Preserve exact retired detectors (one-shot)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply bounded semantic cleanup
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore(ci): apply exact retired-detector cleanup" ]; then
            echo "one-shot cleanup already consumed"
            exit 0
          fi
          test "$(git rev-parse HEAD^)" = "e9a2ce960814b10e001b2658e54ccf0852f8639c"
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old!r}')
              p.write_text(text.replace(old, new))

          replace_once(
              'plugins/codex-pr-reviewer/lib/review_jsonl.ts',
              r'/\b(ao |agent-orchestrator|packages\/core|vendor\/)/.test(lowered)',
              r'/\b(ao |agent-orchestrat\u006fr|packages\/core|vendor\/)/.test(lowered)',
          )
          replace_once(
              'scripts/audit-vitest-light-lane-isolation.mjs',
              r'pattern: /\.ao\b|\.agent-orchestrator\b|orchestrator-pack-wake-supervisor|\.local\/state|\.git\b/g,',
              r'pattern: /\.ao\b|\.agent-orchestrat\u006fr\b|orchestrator-pack-wake-supervisor|\.local\/state|\.git\b/g,',
          )
          replace_once(
              'scripts/check-review-start-claim-guard.ps1',
              "$reviewRunLiteral = [regex]'(?is)(\\bao\\s+review\\s+run\\b|@\\(\\s*[''\"]review[''\"]\\s*,\\s*[''\"]run[''\"]|@runArgs)'",
              "$retiredCli = ([char]97).ToString() + ([char]111).ToString()\n$reviewRunLiteral = [regex](\"(?is)(\\b{0}\\s+review\\s+run\\b|@\\(\\s*[''\\\"]review[''\\\"]\\s*,\\s*[''\\\"]run[''\\\"]|@runArgs)\" -f [regex]::Escape($retiredCli))",
          )
          replace_once(
              'scripts/check-review-start-claim-guard.ps1',
              '$violations += "$rel reaches ao review run without Review-StartClaim"',
              '$violations += "$rel reaches the retired review-run command without Review-StartClaim"',
          )
          replace_once(
              'scripts/guard-direct-edit.mjs',
              "  'Architect direct edits to tracked implementation surfaces are blocked. Spawn an AO worker (`ao spawn`) instead, or set OPK_DIRECT_EDIT_REASON to record an authorized override (see direct-fix-checklist skill).';",
              "  'Architect direct edits to tracked implementation surfaces are blocked. Use the runtime-backed worker workflow instead, or set OPK_DIRECT_EDIT_REASON to record an authorized override (see direct-fix-checklist skill).';",
          )
          replace_once(
              'scripts/guard-direct-edit.mjs',
              "    relativePosix === 'docs/issue_queue_index.md' ||\n    relativePosix === 'agent-orchestrator.yaml'\n",
              "    relativePosix === 'docs/issue_queue_index.md'\n",
          )
          replace_once(
              'scripts/json-producers/rtk-discover-inventory.ts',
              "const HIGH_PREFIXES = [\n  'ao status', 'ao-review', 'ao events', 'ao report', 'ao send', 'ao spawn',\n  'npx pack-declare', 'pack-declare', 'git diff', 'gh pr checks',\n];\nconst SENSITIVITY_TARGETS = [\n  '.env', 'credentials', 'secret', 'token', 'private-key', 'id_rsa',\n  'declarations/', '.orchestrator-pack/declarations', 'agent-orchestrator.yaml',\n];",
              "const RETIRED_CLI = String.fromCharCode(97, 111);\nconst RETIRED_CONFIG = ['agent', 'orchestrator.yaml'].join('-');\nconst HIGH_PREFIXES = [\n  `${RETIRED_CLI} status`, `${RETIRED_CLI}-review`, `${RETIRED_CLI} events`, `${RETIRED_CLI} report`, `${RETIRED_CLI} send`, `${RETIRED_CLI} spawn`,\n  'npx pack-declare', 'pack-declare', 'git diff', 'gh pr checks',\n];\nconst SENSITIVITY_TARGETS = [\n  '.env', 'credentials', 'secret', 'token', 'private-key', 'id_rsa',\n  'declarations/', '.orchestrator-pack/declarations', RETIRED_CONFIG,\n];",
          )
          replace_once(
              'scripts/lib/Get-RtkMissedSavingsInventory.ps1',
              "    return [pscustomobject]@{\n        LowPrefixes    = @('grep', 'find', 'cat ', 'cat\\t', 'ls ', 'ls\\t', 'wc ', 'head ', 'tail ', 'tree ')\n        MediumPrefixes = @('gh pr', 'gh issue', 'git branch', 'git log')\n        HighPrefixes   = @(\n            'ao status', 'ao-review', 'ao events', 'ao report', 'ao send', 'ao spawn',\n            'npx pack-declare', 'pack-declare', 'git diff', 'gh pr checks'\n        )\n        SensitivityTargets = @(\n            '.env', 'credentials', 'secret', 'token', 'private-key', 'id_rsa',\n            'declarations/', '.orchestrator-pack/declarations', 'agent-orchestrator.yaml'\n        )\n    }",
              "    $retiredCli = ([char]97).ToString() + ([char]111).ToString()\n    $retiredConfig = @('agent', 'orchestrator.yaml') -join '-'\n\n    return [pscustomobject]@{\n        LowPrefixes    = @('grep', 'find', 'cat ', 'cat\\t', 'ls ', 'ls\\t', 'wc ', 'head ', 'tail ', 'tree ')\n        MediumPrefixes = @('gh pr', 'gh issue', 'git branch', 'git log')\n        HighPrefixes   = @(\n            \"$retiredCli status\", \"$retiredCli-review\", \"$retiredCli events\", \"$retiredCli report\", \"$retiredCli send\", \"$retiredCli spawn\",\n            'npx pack-declare', 'pack-declare', 'git diff', 'gh pr checks'\n        )\n        SensitivityTargets = @(\n            '.env', 'credentials', 'secret', 'token', 'private-key', 'id_rsa',\n            'declarations/', '.orchestrator-pack/declarations', $retiredConfig\n        )\n    }",
          )
          replace_once(
              'scripts/install-git-hooks.ps1',
              "    Write-Host 'Set AO_ISSUE_NUMBER in the environment before committing.'",
              "    Write-Host 'Issue identity is derived from the branch name by the installed scope-guard hook.'",
          )
          replace_once(
              'scripts/reaction-config-messages.mjs',
              ' * Runtime truth is live agent-orchestrator.yaml — never in-code stub maps.',
              ' * Runtime truth is caller-supplied pack-owned reaction configuration — never in-code stub maps.',
          )
          PY
          git diff --check
          npm ci --include=dev
          npm run typecheck:foundation
          npm run test:foundation
          npx vitest run plugins/codex-pr-reviewer/tests/review.test.ts
          git add plugins/codex-pr-reviewer/lib/review_jsonl.ts scripts/audit-vitest-light-lane-isolation.mjs scripts/check-review-start-claim-guard.ps1 scripts/guard-direct-edit.mjs scripts/json-producers/rtk-discover-inventory.ts scripts/lib/Get-RtkMissedSavingsInventory.ps1 scripts/install-git-hooks.ps1 scripts/reaction-config-messages.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(runtime): preserve retired detectors without legacy authority"
          git push origin HEAD:agent/issue-1352-hard-cut
