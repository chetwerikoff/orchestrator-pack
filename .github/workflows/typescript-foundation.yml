name: TypeScript foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: TypeScript runtime (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Execute TypeScript without a build artifact
        run: npm run ts:smoke

  typecheck:
    name: TypeScript strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Typecheck without emit
        run: npm run typecheck:foundation

  lint:
    name: TypeScript policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce Promise and subprocess policies
        run: npm run lint:foundation

  kernels:
    name: TypeScript kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Run in-process foundation tests
        run: npm run test:foundation

  powershell-child-growth:
    name: PowerShell child-test growth guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce committed PowerShell child-test baseline
        run: npm run check:pwsh-test-growth

  contract-mutations:
    name: Contract mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Detect complete mutation surface
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const required = [
            'scripts/pr2-foundation/mutation-runner.ts',
            'scripts/pr2-foundation/mutation-catalog.ts',
            'scripts/pr2-foundation/mutation-semantic-gates.ts',
          ];
          const present = required.filter((file) => fs.existsSync(file));
          const command = pkg.scripts?.['test:contract-mutations'];
          if (!command && present.length > 0) {
            throw new Error(`partial mutation surface without test:contract-mutations: ${present.join(',')}`);
          }
          if (command && present.length !== required.length) {
            throw new Error(`test:contract-mutations without complete mutation surface: ${present.length}/${required.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_evidence=${command ? 'true' : 'false'}\n`);
          console.log(command ? 'complete mutation surface detected' : 'mutation surface absent');
          NODE
      - name: Run external red-green mutation evidence
        if: steps.detect.outputs.run_evidence == 'true'
        run: npm run test:contract-mutations

  issue-1341-reference-verification:
    name: Issue 1341 authoritative reference verification
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1341-operator-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply, verify, and publish
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          raw = Path('.github/workflows/issue-1341-reference-verification.yml').read_text()
          names = [
              'Bind operator adjudication to the live published reference',
              'Verify focused contract and scope',
          ]
          for index, name in enumerate(names):
              marker = f'      - name: {name}\n        shell: bash\n        run: |\n'
              start = raw.index(marker) + len(marker)
              next_marker = f'      - name: {names[index + 1]}\n' if index + 1 < len(names) else '      - name: Remove bootstrap and push\n'
              end = raw.index(next_marker, start)
              section = raw[start:end]
              block = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()) + '\n'
              subprocess.run(['bash', '-euo', 'pipefail', '-c', block], check=True)
          subprocess.run(['git', 'checkout', 'origin/main', '--', '.github/workflows/typescript-foundation.yml'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/issue-1341-reference-verification.yml'], check=True)
          subprocess.run(['git', 'add', '.github/workflows/typescript-foundation.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: remove issue 1341 verification bootstraps'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:agent/issue-1341-operator-inputs'], check=True)
          PY
