name: TypeScript foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: TypeScript runtime (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Execute TypeScript without a build artifact
        run: npm run ts:smoke

  typecheck:
    name: TypeScript strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Typecheck without emit
        run: npm run typecheck:foundation

  lint:
    name: TypeScript policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce Promise and subprocess policies
        run: npm run lint:foundation

  kernels:
    name: TypeScript kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Run in-process foundation tests
        run: npm run test:foundation

  powershell-child-growth:
    name: PowerShell child-test growth guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce committed PowerShell child-test baseline
        run: npm run check:pwsh-test-growth

  contract-mutations:
    name: Contract mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Enforce pinned Node major
        run: npm run check:node-major
      - name: Detect complete mutation surface
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const required = [
            'scripts/pr2-foundation/mutation-runner.ts',
            'scripts/pr2-foundation/mutation-catalog.ts',
            'scripts/pr2-foundation/mutation-semantic-gates.ts',
          ];
          const present = required.filter((file) => fs.existsSync(file));
          const command = pkg.scripts?.['test:contract-mutations'];
          if (!command && present.length > 0) {
            throw new Error(`partial mutation surface without test:contract-mutations: ${present.join(',')}`);
          }
          if (command && present.length !== required.length) {
            throw new Error(`test:contract-mutations without complete mutation surface: ${present.length}/${required.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_evidence=${command ? 'true' : 'false'}\n`);
          console.log(command ? 'complete mutation surface detected' : 'mutation surface absent');
          NODE
      - name: Run external red-green mutation evidence
        if: steps.detect.outputs.run_evidence == 'true'
        run: npm run test:contract-mutations

  retirement-scan:
    name: Runtime retirement census (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full retired-surface scanner
        run: node --experimental-strip-types scripts/runtime-retirement/retired-surface-guard.ts

  issue-1352-reconcile-pn-census:
    name: Reconcile retired PN smoke census (one-shot)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded census disposition
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore(ci): retry PN smoke census reconcile" ]; then
            echo "one-shot census reconciliation already consumed"
            exit 0
          fi
          test "$(git rev-parse HEAD^)" = "77eddc7a58fdcce991496c75ea1887b39d468459"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const baselinePath = 'scripts/gate-runner/census/pre-change-baseline.json';
          const generationPath = 'scripts/gate-runner/census/generation.json';
          const censusPath = 'scripts/gate-runner/census.ts';
          const manifestGeneratorPath = 'scripts/estate-cut/manifest-generator.mjs';
          const targetId = 'check-script:scripts/check-harness-post-submit-pn-live-smoke.ps1';
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const rows = baseline.entries.filter((entry) => entry.id === targetId);
          if (rows.length !== 1) throw new Error(`expected exactly one PN smoke census row; found ${rows.length}`);
          const row = rows[0];
          if (row.classification !== 'kept-in-pr1' || row.keepCategory !== 'D') {
            throw new Error(`unexpected PN smoke census disposition: ${JSON.stringify(row)}`);
          }
          delete row.keepCategory;
          row.classification = 'retired-with-reason';
          row.retirementJustification = {
            reasonCode: 'superseded-contract',
            behavior: 'Issue #1352 retires the daemon-only harness post-submit PN smoke after live inspection confirmed that it installs the retired runtime CLI, requires the retired daemon URL, and has no surviving runtime-neutral caller contract.',
            replacement: 'Pack-owned review acceptance and RuntimeAdapter-backed runtime tests cover the surviving behavior; no retired daemon/API smoke is retained.',
          };
          fs.writeFileSync(baselinePath, `${JSON.stringify(baseline, null, 2)}\n`);

          const compareOrdinal = (a, b) => a < b ? -1 : a > b ? 1 : 0;
          const payload = baseline.entries
            .map(({ id, classification, gateIds, portedInWave }) => ({
              id,
              classification: classification ?? null,
              gateIds: [...(gateIds ?? [])].sort(compareOrdinal),
              portedInWave: portedInWave ?? null,
            }))
            .sort((left, right) => compareOrdinal(left.id, right.id))
            .map((entry) => JSON.stringify(entry))
            .join('\n');
          const digest = crypto.createHash('sha256').update(`${payload}\n`, 'utf8').digest('hex');

          const generation = JSON.parse(fs.readFileSync(generationPath, 'utf8'));
          const oldDigest = generation.migrationOwnershipDigest;
          if (!/^[0-9a-f]{64}$/.test(oldDigest)) throw new Error('invalid prior migration ownership digest');
          generation.migrationOwnershipDigest = digest;
          fs.writeFileSync(generationPath, `${JSON.stringify(generation, null, 2)}\n`);

          let census = fs.readFileSync(censusPath, 'utf8');
          const oldLiteral = `const EXPECTED_MIGRATION_OWNERSHIP_DIGEST = '${oldDigest}' as const;`;
          const newLiteral = `const EXPECTED_MIGRATION_OWNERSHIP_DIGEST = '${digest}' as const;`;
          if (census.split(oldLiteral).length !== 2) throw new Error('expected exactly one census digest literal');
          census = census.replace(oldLiteral, newLiteral);
          fs.writeFileSync(censusPath, census);

          let manifestGenerator = fs.readFileSync(manifestGeneratorPath, 'utf8');
          const pin = "  'scripts/check-harness-post-submit-pn-live-smoke.ps1',\n";
          if (manifestGenerator.split(pin).length !== 2) throw new Error('expected exactly one stale PN smoke pin');
          manifestGenerator = manifestGenerator.replace(pin, '');
          fs.writeFileSync(manifestGeneratorPath, manifestGenerator);
          console.log(`migrationOwnershipDigest=${digest}`);
          NODE
          git diff --check
          git add scripts/gate-runner/census/pre-change-baseline.json scripts/gate-runner/census/generation.json scripts/gate-runner/census.ts scripts/estate-cut/manifest-generator.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(gates): terminalize retired PN smoke disposition"
          git push origin HEAD:agent/issue-1352-hard-cut
