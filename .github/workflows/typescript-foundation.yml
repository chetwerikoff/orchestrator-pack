name: TypeScript foundation

on:
  pull_request:

permissions:
  contents: write

jobs:
  issue-1341-reference-verification:
    name: Issue 1341 authoritative reference verification
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1341-operator-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply, verify, and publish
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          raw = Path('.github/workflows/issue-1341-reference-verification.yml').read_text()
          names = [
              'Bind operator adjudication to the live published reference',
              'Verify focused contract and scope',
          ]
          for index, name in enumerate(names):
              marker = f'      - name: {name}\n        shell: bash\n        run: |\n'
              start = raw.index(marker) + len(marker)
              next_marker = f'      - name: {names[index + 1]}\n' if index + 1 < len(names) else '      - name: Remove bootstrap and push\n'
              end = raw.index(next_marker, start)
              section = raw[start:end]
              block = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()) + '\n'
              subprocess.run(['bash', '-euo', 'pipefail', '-c', block], check=True)
              if index == 0:
                  test_path = Path('scripts/lib/create-issue-stage-record-artifacts.test.ts')
                  test_text = test_path.read_text()
                  old = "expect(result.errors.join('\\n')).toContain('must match exactly one absent or non-ok terminal invocation');"
                  new = "expect(result.errors.join('\\n')).toContain('published verdict SHA-256 is mismatched');"
                  if test_text.count(old) != 1:
                      raise SystemExit(f'expected one mismatch assertion, found {test_text.count(old)}')
                  test_path.write_text(test_text.replace(old, new, 1))
                  subprocess.run(['git', 'add', str(test_path)], check=True)
                  subprocess.run(['git', 'commit', '-m', 'test: assert authoritative reference mismatch'], check=True)
          subprocess.run(['git', 'checkout', 'origin/main', '--', '.github/workflows/typescript-foundation.yml'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/issue-1341-reference-verification.yml'], check=True)
          subprocess.run(['git', 'add', '.github/workflows/typescript-foundation.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: remove issue 1341 verification bootstraps'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:agent/issue-1341-operator-inputs'], check=True)
          PY
