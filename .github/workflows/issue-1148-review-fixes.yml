name: Issue 1148 review finding fixes

on:
  push:
    branches:
      - agent/issue-1148-message-identity

permissions:
  contents: write

concurrency:
  group: issue-1148-review-fixes
  cancel-in-progress: false

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1148-message-identity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply and verify with durable diagnostics
        shell: bash
        run: |
          set +e
          log=.github/issue-1148-review-fixes.log
          status_file=.github/issue-1148-review-fixes.status
          : > "$log"
          python .github/issue-1148-review-fixes.py >> "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm ci --include=dev >> "$log" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run check:node-major --silent >> "$log" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run typecheck:foundation --silent >> "$log" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            node scripts/run-vitest-with-harness.mjs run --maxWorkers=1 \
              scripts/chatgpt-browser-turn/state-light-page-observation.test.ts \
              scripts/stage-completeness-guard.test.ts >> "$log" 2>&1
            status=$?
          fi
          printf '%s\n' "$status" > "$status_file"
          cat "$log"
          exit 0

      - name: Publish scoped fix or diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat .github/issue-1148-review-fixes.status)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-1148-review-fixes.yml
          if [ "$status" -eq 0 ]; then
            git rm .github/issue-1148-review-fixes.py
            rm .github/issue-1148-review-fixes.log .github/issue-1148-review-fixes.status
            git add -A
            git diff --cached --check
            git commit -m 'fix(browser-turn): address identity review findings'
          else
            git add .github/issue-1148-review-fixes.py
            git add .github/issue-1148-review-fixes.log
            git add .github/issue-1148-review-fixes.status
            git add scripts/chatgpt-browser-turn/state-light-turn.ts
            git add scripts/chatgpt-browser-turn/state-light-page-observation.test.ts
            git commit -m 'chore(review): capture Issue 1148 fix diagnostics'
          fi
          git push origin HEAD:agent/issue-1148-message-identity
