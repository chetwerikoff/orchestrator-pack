name: issue-1352-verification-runner

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

concurrency:
  group: issue-1352-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.number == 1388 && github.event.pull_request.head.ref == 'verify/pr-1378-c5e1298'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      OPK_BASE_DIR: ${{ runner.temp }}/opk-state
    steps:
      - name: Checkout verification head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from frozen lockfile
        run: npm ci --include=dev

      - name: Run preflight, typecheck, lint, scanner census and targeted tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/issue-1352-logs"
          npm run ci:preflight 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/ci-preflight.log"
          npm run typecheck:foundation 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/typecheck-foundation.log"
          npm run lint:foundation 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/lint-foundation.log"
          node --experimental-strip-types scripts/runtime-retirement/issue-1352-finalize-probe.ts 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/evidence-probe.log"
          npm run test:foundation 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/test-foundation.log"
          npm run check:pwsh-test-growth 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/pwsh-test-growth.log"
          npm run test:contract-mutations --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/contract-mutations.log"

      - name: Run full test harness
        shell: bash
        run: |
          set -o pipefail
          npm test -- --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/issue-1352-logs/test-full.log"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1352-verification-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/issue-1352-logs/
