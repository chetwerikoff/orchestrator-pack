name: issue-1352-residual-batch3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-regression-carrier' && github.event.pull_request.base.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-regression-carrier
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve batch executor and switch to exact target
        shell: bash
        run: |
          set -euo pipefail
          cp .github/issue-1352-residual-batch1.py "$RUNNER_TEMP/issue-1352-residual-batch3.py"
          git fetch origin agent/issue-1352-hard-cut
          git checkout -B agent/issue-1352-hard-cut origin/agent/issue-1352-hard-cut
          expected_head='3b0f3201d6b25e94fd2ae3868d60f0dd5443a991'
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and verify batch
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/issue-1352-residual-batch3.py"
          npm ci --include=dev
          npm run typecheck:foundation
          pwsh -NoProfile -File scripts/test-all.ps1 -SkipNpm
          npm test -- --maxWorkers=1 \
            scripts/runtime-retirement/retired-surface-guard.test.ts \
            scripts/review-cycle-cap.test.ts \
            scripts/gh-governor.test.ts \
            scripts/worker-status-store.test.ts \
            --reporter=dot
          node --experimental-strip-types scripts/runtime-retirement/retired-surface-guard.ts > "$RUNNER_TEMP/residual.json" || true
          node --input-type=module - "$RUNNER_TEMP/residual.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (result.violations.length >= 240) {
            console.error(`residual census did not shrink: ${result.violations.length}`);
            process.exit(3);
          }
          const retiredSelectors = ['AO_PR_NUMBER','AO_ISSUE_NUMBER','AO_ORCHESTRATOR_SESSION_ID','AO_REPO_SLUG','AO_PR_HEAD_SHA','AO_HEAD_SHA'];
          const migrated = new Set(['scripts/lib/Review-CycleCap.ps1','scripts/orchestrator-review-start-preflight.ps1','scripts/orchestrator-wake-common.ps1','scripts/wait-orchestrator-launch.ps1','scripts/orchestrator-worktree-preflight.ps1','scripts/lib/Orchestrator-Escalation.ps1','scripts/lib/gh-governor.mjs','scripts/lib/worker-status-store.mjs']);
          const forbidden = result.violations.filter((row) => migrated.has(row.path) && retiredSelectors.includes(row.match));
          if (forbidden.length) {
            console.error(JSON.stringify(forbidden, null, 2));
            process.exit(4);
          }
          console.log(`residual_hits=${result.violations.length}`);
          NODE
          git diff --check
      - name: Publish verified batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add -A
          git commit -m 'refactor(runtime): make review and wake identity explicit'
          git push origin HEAD:agent/issue-1352-hard-cut
