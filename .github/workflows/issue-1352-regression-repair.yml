name: issue-1352-exact-residual-capture

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-regression-carrier' && github.event.pull_request.base.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture exact residual and tree
        shell: bash
        run: |
          set -euo pipefail
          expected_head='2b9484e7773af07eb68d24656001272675f984d4'
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
          node --experimental-strip-types scripts/runtime-retirement/retired-surface-guard.ts > "$RUNNER_TEMP/residual.json" || true
          node --input-type=module - "$RUNNER_TEMP/residual.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (result.violations.length !== 179) throw new Error(`unexpected residual ${result.violations.length}`);
          console.log(`exact_residual=${result.violations.length}`);
          NODE
          rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1352-exact-tree-2b9484
          path: |
            .
            ${{ runner.temp }}/residual.json
          include-hidden-files: true
          retention-days: 1
