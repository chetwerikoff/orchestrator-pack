name: issue-1352-regression-repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair-current-head:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-regression-carrier' && github.event.pull_request.base.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-regression-carrier
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve helper and switch to exact target
        shell: bash
        run: |
          set -euo pipefail
          cp .github/issue-1352-regression-repair-v2.py "$RUNNER_TEMP/issue-1352-regression-repair-v2.py"
          git fetch origin agent/issue-1352-hard-cut
          git checkout -B agent/issue-1352-hard-cut origin/agent/issue-1352-hard-cut
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='2b4cba4beef24c7d8a77cff00591c61ed0c4fa5b'
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$expected_head" ]; then
            echo "target head drift: expected $expected_head, got $actual_head" >&2
            exit 90
          fi
          python "$RUNNER_TEMP/issue-1352-regression-repair-v2.py"
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('scripts/pack-review-runner.ts')
          runner = runner_path.read_text(encoding='utf-8')
          old_env = """  const retiredRuntimePrefixes = [
            ['A', 'O', '_'].join(''),
            ['O', 'R', 'C', 'A', '_'].join(''),
          ];
          const retiredRuntimeEnv = Object.fromEntries(
            Object.keys(process.env)
              .filter((key) => retiredRuntimePrefixes.some((prefix) => key.startsWith(prefix)))
              .map((key) => [key, undefined]),
          ) as NodeJS.ProcessEnv;
          const env: NodeJS.ProcessEnv = {
            ...retiredRuntimeEnv,
            ...buildReviewerBudgetSpawnEnv(options.budgetLedger, {}),"""
          new_env = """  const retiredRuntimePrefixes = [
            ['A', 'O', '_'].join(''),
            ['O', 'R', 'C', 'A', '_'].join(''),
          ];
          const sanitizedParentEnv = Object.fromEntries(
            Object.entries(process.env)
              .filter(([key]) => !retiredRuntimePrefixes.some((prefix) => key.startsWith(prefix))),
          ) as NodeJS.ProcessEnv;
          const env: NodeJS.ProcessEnv = {
            ...sanitizedParentEnv,
            ...buildReviewerBudgetSpawnEnv(options.budgetLedger, {}),"""
          if runner.count(old_env) != 1:
              raise SystemExit(f'unexpected generated reviewer env block count: {runner.count(old_env)}')
          runner = runner.replace(old_env, new_env, 1)
          inherit_old = "    inheritParentEnv: true,\n    env,\n    allowEmptyStdout: true,"
          inherit_new = "    inheritParentEnv: false,\n    env,\n    allowEmptyStdout: true,"
          if runner.count(inherit_old) != 1:
              raise SystemExit(f'unexpected reviewer inheritance block count: {runner.count(inherit_old)}')
          runner_path.write_text(runner.replace(inherit_old, inherit_new, 1), encoding='utf-8')

          foundation_path = Path('scripts/pr2-foundation/foundation.test.ts')
          foundation = foundation_path.read_text(encoding='utf-8')
          start_marker = "    for (const file of FOUNDATION_DOC_ROWS) {\n"
          if foundation.count(start_marker) != 1:
              raise SystemExit(f'unexpected foundation loop count: {foundation.count(start_marker)}')
          start = foundation.index(start_marker)
          end_marker = "    }\n"
          end = foundation.index(end_marker, start) + len(end_marker)
          final_block = """    for (const file of FOUNDATION_DOC_ROWS) {
            const terminalizedName = file.endsWith('.d.mts')
              ? `${path.basename(file, '.d.mts')}.d.ts`
              : `${path.basename(file, '.mjs')}.ts`;
            const terminalized = path.join(repoRoot, 'scripts/pr2-foundation/terminalized', terminalizedName);
            const source = existsSync(terminalized) ? terminalized : path.join(repoRoot, file);
            expect(existsSync(source), file).toBe(true);
            expect(readFileSync(source, 'utf8'), file)
              .toMatch(/^\/\/ Issue #923 foundation-terminalized:/);
          }
          """
          foundation_path.write_text(foundation[:start] + final_block + foundation[end:], encoding='utf-8')
          PY
      - name: Verify repairs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run typecheck:foundation
          pwsh -NoProfile -File scripts/check-gh-inventory-static.ps1
          pwsh -NoProfile -File scripts/test-all.ps1 -SkipNpm
          npm test -- --maxWorkers=1 \
            scripts/ci-green-wake-reconcile.test.ts \
            scripts/estate-cut/task-311-tests/task-311-assembly.test.ts \
            scripts/pr2-foundation/foundation.test.ts \
            scripts/review-trigger-reeval.test.ts \
            --reporter=dot
          git diff --check
      - name: Publish verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add \
            AGENTS.md \
            docs/ci-green-wake-reconcile.mjs \
            docs/declarations/1352.pr-scope.json \
            scripts/ci-green-wake-reconcile.test.ts \
            scripts/estate-cut/task-311-tests/task-311-assembly.test.ts \
            scripts/estate-cut/task-311-tests/task-311-common.test-support.ts \
            scripts/lib/Review-FailureEvidence.ps1 \
            scripts/lib/Review-PostRunRetry.ps1 \
            scripts/lib/Review-RecoveryPaths.ps1 \
            scripts/pack-review-runner.ts \
            scripts/pr2-foundation/foundation.test.ts \
            scripts/review-trigger-reeval.test.ts \
            scripts/test-all.ps1
          git diff --cached --check
          git commit -m 'fix(runtime): remove stale runtime regression dependencies'
          git push origin HEAD:agent/issue-1352-hard-cut
