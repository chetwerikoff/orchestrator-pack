name: issue-1352-target-export

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-target:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-regression-carrier' && github.event.pull_request.base.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 1
      - name: Assert exact target head
        shell: bash
        run: |
          set -euo pipefail
          expected_head='1174975f3605b02955079ee55657cc2fbf1e0119'
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
          rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1352-target-1174975
          path: .
          include-hidden-files: true
          retention-days: 1
