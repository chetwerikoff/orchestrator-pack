name: issue-1352-residual-batch2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-regression-carrier' && github.event.pull_request.base.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-regression-carrier
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve batch executor and switch to exact target
        shell: bash
        run: |
          set -euo pipefail
          cp .github/issue-1352-residual-batch1.py "$RUNNER_TEMP/issue-1352-residual-batch2.py"
          git fetch origin agent/issue-1352-hard-cut
          git checkout -B agent/issue-1352-hard-cut origin/agent/issue-1352-hard-cut
          expected_head='5c431f53b414ff740034d5b622515437a68668f3'
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and verify batch
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/issue-1352-residual-batch2.py"
          npm ci --include=dev
          npm run typecheck:foundation
          pwsh -NoProfile -File scripts/test-all.ps1 -SkipNpm
          npm test -- --maxWorkers=1 \
            scripts/runtime-retirement/retired-surface-guard.test.ts \
            scripts/gate-runner/custom/bulk-cli-parity.test.ts \
            scripts/pr2-foundation/foundation.test.ts \
            --reporter=dot
          node --experimental-strip-types scripts/runtime-retirement/retired-surface-guard.ts > "$RUNNER_TEMP/residual.json" || true
          node --input-type=module - "$RUNNER_TEMP/residual.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const migratedPaths = new Set([
            '.gitignore',
            'scripts/estate-cut/capture-base-anchor.mjs',
            'scripts/estate-cut/manifest-generator.mjs',
            'scripts/gate-runner/bulk-declarative-gates.ts',
            'scripts/lib/Autonomous-ClaimPrResumeGate.ps1',
            'scripts/lib/Autonomous-SpawnWorktreeGate.ps1',
            'scripts/lib/Journaled-WorkerSendInternalCapability.ps1',
            'scripts/lib/graphql-quota-github-read-inventory.json',
            'scripts/orchestrator-message-audit-roots.manifest.json',
            'scripts/orchestrator-message-protected-runtime.manifest.json',
            'scripts/pr-scope-declaration.ts',
            'scripts/pr2-foundation/contracts.ts',
            'scripts/pr2a/closed-world-scanner.ts',
            'scripts/pr2a/execution-root-registry.json',
            'scripts/toolchain/check-typescript-runtime-policy.ts',
          ]);
          const forbidden = result.violations.filter((row) => migratedPaths.has(row.path)
            && (row.match.includes('agent-orchestrator.yaml')
              || row.match.includes('.agent-orchestrator')
              || row.match === '.ao/'
              || row.match === 'AO_PROJECT_ID'
              || row.match === 'AO_PROJECT'));
          if (forbidden.length) {
            console.error(JSON.stringify(forbidden, null, 2));
            process.exit(2);
          }
          if (result.violations.length >= 288) {
            console.error(`residual census did not shrink: ${result.violations.length}`);
            process.exit(3);
          }
          console.log(`residual_hits=${result.violations.length}`);
          NODE
          git diff --check
      - name: Publish verified batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add -A
          git commit -m 'refactor(runtime): retire legacy config and state roots'
          git push origin HEAD:agent/issue-1352-hard-cut
