name: issue-1142-followup-findings

on:
  pull_request:
    types:
      - converted_to_draft

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 1154
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-1142-tiering-calibration

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue-1142-followup-findings/fix.py')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace('\\n', '\\\\n'), encoding='utf-8')
          PY
          python .github/issue-1142-followup-findings/fix.py

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Node preflight
        run: npm run check:node-major

      - name: Focused tests
        run: npm test -- scripts/tier-gate-guard.test.ts

      - name: Foundation typecheck
        run: npm run typecheck:foundation

      - name: Full TypeScript typecheck
        run: npx tsc --project tsconfig.base.json --noEmit

      - name: Repository verification
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Reusable-content verification
        shell: pwsh
        run: ./scripts/check-reusable.ps1

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .claude/skills/create-issue-draft/SKILL.md \
            scripts/lib/tier-gate-core.ts \
            scripts/tier-gate-guard.ts \
            scripts/tier-gate-guard.test.ts
          git diff --cached --check
          git commit -m 'fix(tiering): address follow-up review findings (#1142)'
          git push origin HEAD:agent/issue-1142-tiering-calibration
