name: Issue 1122 transport recovery

on:
  pull_request:
    types:
      - converted_to_draft

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.number == 1155
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1122-browser-gpt-page-probe
          fetch-depth: 0

      - name: Reassemble exact reviewed files
        shell: bash
        run: |
          set -euo pipefail
          cat .issue-1122-transport/source.part{00..06} > scripts/browser-gpt-page-probe.ts
          cat .issue-1122-transport/test.part{00..03} > scripts/browser-gpt-page-probe.test.ts
          source_sha="$(git hash-object scripts/browser-gpt-page-probe.ts)"
          test_sha="$(git hash-object scripts/browser-gpt-page-probe.test.ts)"
          printf 'assembled source sha=%s\nassembled test sha=%s\n' "$source_sha" "$test_sha"
          test "$source_sha" = "9122f2610c2d1c87c9d92195acc5214ba0323bed"
          test "$test_sha" = "86a415bb5d71c7f227328decd90f944650054f4e"

      - name: Reconcile current-main CI registrations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package['scripts']
          issue_test = 'npm run check:node-major --silent && vitest run --config scripts/toolchain/vitest-foundation.config.ts scripts/browser-gpt-page-probe.test.ts'
          probe_cli = 'npm run check:node-major --silent -- --quiet && node --experimental-strip-types scripts/browser-gpt-page-probe.ts'
          if 'test:issue-1122' in scripts or 'browser-gpt-page-probe' in scripts:
              raise SystemExit('Issue #1122 package registrations already exist unexpectedly')
          merged_scripts = {}
          for key, value in scripts.items():
              merged_scripts[key] = value
              if key == 'test:issue-1120':
                  merged_scripts['test:issue-1122'] = issue_test
              if key == 'chatgpt-browser-turn':
                  merged_scripts['browser-gpt-page-probe'] = probe_cli
          if 'test:issue-1122' not in merged_scripts or 'browser-gpt-page-probe' not in merged_scripts:
              raise SystemExit('package insertion anchors missing')
          package['scripts'] = merged_scripts
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          topology_path = Path('scripts/lib/vitest-pre-topology-measurement.mjs')
          topology = topology_path.read_text(encoding='utf-8')
          topology_anchor = "  'scripts/tiering-distribution-report.test.ts': 120,\n"
          topology_insert = topology_anchor + (
              "  // Issue #1122 focused read-only page-probe tests are fast light-lane coverage;\n"
              "  // keep the pre-topology producer bounded until CI runtime history harvests them.\n"
              "  'scripts/browser-gpt-page-probe.test.ts': 120,\n"
          )
          if topology.count(topology_anchor) != 1 or 'scripts/browser-gpt-page-probe.test.ts' in topology:
              raise SystemExit('pre-topology insertion precondition failed')
          topology_path.write_text(topology.replace(topology_anchor, topology_insert, 1), encoding='utf-8')

          lanes_path = Path('scripts/vitest-ci-lanes.config.json')
          lanes = lanes_path.read_text(encoding='utf-8')
          lanes_anchor = '    "scripts/ci-green-wake-reconcile.test.ts": "heavy",\n'
          lanes_insert = '    "scripts/browser-gpt-page-probe.test.ts": "light",\n' + lanes_anchor
          if lanes.count(lanes_anchor) != 1 or 'scripts/browser-gpt-page-probe.test.ts' in lanes:
              raise SystemExit('light-lane insertion precondition failed')
          lanes_path.write_text(lanes.replace(lanes_anchor, lanes_insert, 1), encoding='utf-8')
          PY

      - name: Remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .issue-1122-transport
          rm -f .github/workflows/issue-1122-transport-recover.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate focused contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:issue-1122
          npm run typecheck:foundation
          set +e
          output="$(npm run --silent browser-gpt-page-probe -- invalid 2>/tmp/issue-1122-probe.stderr)"
          status=$?
          set -e
          test "$status" -eq 9
          test "$(printf '%s\n' "$output" | wc -l)" -eq 1
          printf '%s\n' "$output" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const value = JSON.parse(s); if (value.schema !== "browser-gpt-page-probe/v1" || value.status !== "input_invalid") process.exit(1); });'

      - name: Publish reviewed result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close Browser-GPT probe review findings"
          git push origin HEAD:agent/issue-1122-browser-gpt-page-probe

# One-shot transport only; the successful commit removes this workflow and its payload.
