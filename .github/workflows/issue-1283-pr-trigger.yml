name: issue-1283-pr-trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1283-browser-turn-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Issue 1283 implementation
        run: |
          python3 - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path

          bootstrap = Path('.github/workflows/issue-1283-bootstrap.yml').read_text()
          match = re.search(r'^\s+EDIT_PAYLOAD_B64:\s+(\S+)\s*$', bootstrap, re.MULTILINE)
          if not match:
              raise SystemExit('bootstrap payload missing')
          payload = json.loads(base64.b64decode(match.group(1)).decode())

          def decode(value: str) -> str:
              return base64.b64decode(value).decode()

          for item in payload['replacements']:
              path = Path(item['path'])
              text = path.read_text()
              old = decode(item['old'])
              new = decode(item['new'])
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement count {count} for {path}')
              path.write_text(text.replace(old, new, 1))

          for raw_path, encoded in payload['writes'].items():
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(decode(encoded))

          for raw_path, encoded in payload['appends'].items():
              path = Path(raw_path)
              addition = decode(encoded)
              text = path.read_text()
              if addition.strip() not in text:
                  path.write_text(text.rstrip() + '\n' + addition)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused verification
        run: |
          git diff --check
          npm run check:node-major --silent
          npm test -- --maxWorkers=1 scripts/toolchain/chatgpt-browser-turn.review-fixes.test.ts scripts/chatgpt-browser-turn/state-light-turn.test-support.ts
          npm run typecheck:foundation
          npm run lint:foundation
      - name: Repository verification
        shell: pwsh
        run: |
          ./scripts/verify.ps1
          ./scripts/check-reusable.ps1
      - name: Publish implementation commit
        run: |
          rm .github/workflows/issue-1283-bootstrap.yml
          rm .github/workflows/issue-1283-pr-trigger.yml
          git diff --check
          git status --short
          git config user.name "orchestrator-pack implementation bot"
          git config user.email "85295154+chetwerikoff@users.noreply.github.com"
          git add -A
          git commit -m "feat: recover Browser-GPT observation after send"
          git push origin HEAD:agent/issue-1283-browser-turn-recovery
