name: direct-pack-review-status

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: direct-pack-review-status-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'chetwerikoff/orchestrator-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical pack
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from frozen lockfile
        run: npm ci --include=dev
      - name: Reconcile canonical direct review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node --experimental-strip-types scripts/direct-pack-review-status.ts
          --repo-slug "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --review-id "${{ github.event.review.id }}"
          --review-head-sha "${{ github.event.review.commit_id }}"
          --repo-root "${{ github.workspace }}"
          --json
