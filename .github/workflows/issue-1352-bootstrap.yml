name: issue-1352-bootstrap

on:
  push:
    branches:
      - agent/issue-1352-orca-hard-cut
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-merge-tree:
    if: github.repository == 'chetwerikoff/orchestrator-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > issue-1352-merge-head.txt
          git ls-files -z | tar --null --files-from=- --create --gzip --file=issue-1352-merge-tree.tar.gz
          sha256sum issue-1352-merge-tree.tar.gz
          wc -c issue-1352-merge-tree.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1352-merge-tree
          path: |
            issue-1352-merge-tree.tar.gz
            issue-1352-merge-head.txt
          if-no-files-found: error
          retention-days: 1
