# Trigger after workflow registration.
name: issue-1352-runtime-history-checkpoint

on:
  push:
    branches:
      - agent/issue-1352-hard-cut

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Record successful CI measurements
        env:
          MEASURED_AT: '2026-08-07T20:26:00.017Z'
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import {
            historyBytes,
            loadHistoryFromFile,
            mergeValidatedDurations,
            reconcileTrustedInventory,
          } from './scripts/lib/vitest-runtime-history-merge.mjs';
          import { discoverVitestFiles } from './scripts/lib/vitest-ci-lanes.mjs';

          const path = 'scripts/vitest-runtime-history.json';
          const measuredAt = process.env.MEASURED_AT;
          const durations = new Map([
            ['scripts/gate-runner/bulk-declarative-gates.test.ts', 99],
            ['scripts/gate-runner/census.test.ts', 542],
            ['scripts/gate-runner/custom/bulk-cli-parity.test.ts', 10997],
            ['scripts/gate-runner/custom/capture-redaction.test.ts', 9],
            ['scripts/gate-runner/declarative.test.ts', 8],
            ['scripts/gate-runner/registry.test.ts', 5],
          ]);
          const currentInventory = discoverVitestFiles(process.cwd());
          const merged = mergeValidatedDurations(loadHistoryFromFile(path), durations, []);
          const history = reconcileTrustedInventory(merged.history, currentInventory);
          history.source = 'ci-measured';
          history.dataChangedAt = measuredAt;
          for (const file of durations.keys()) {
            history.fileChangedAt[file] = measuredAt;
          }
          writeFileSync(path, historyBytes(history), 'utf8');
          NODE
      - name: Verify topology bound is now admissible
        env:
          OPK_DISABLE_PRE_TOPOLOGY_MEASUREMENT: '1'
        run: node scripts/emit-vitest-heavy-topology.mjs --skip-oversized-guard
      - name: Commit history only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/vitest-runtime-history.json
          test "$(git diff --cached --name-only)" = 'scripts/vitest-runtime-history.json'
          git commit -m 'Refresh Issue 1352 measured Vitest history'
          git push origin HEAD:agent/issue-1352-hard-cut
