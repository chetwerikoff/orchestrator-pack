name: tmp-issue-1384-ac12-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose repaired current replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 1398 head
        uses: actions/checkout@v4
        with:
          repository: chetwerikoff/orchestrator-pack
          ref: 22ab2edfd24a737c72a42f8df141bb8cbab36222
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Diagnose current replay
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { buildHeavyTopology } from './scripts/lib/vitest-heavy-topology.mjs';
          import { resolvePreTopologyMeasurementPlan } from './scripts/lib/vitest-pre-topology-measurement.mjs';
          const changedFiles = [
            '.cursor/rules/flow-manager-browser-turn-monitoring.mdc',
            'docs/declarations/1266.pr-scope.json',
            'package.json',
            'scripts/browser-gpt-post-settlement-close-proof.ts',
            'scripts/browser-gpt-post-settlement-close.test.ts',
            'scripts/browser-gpt-post-settlement-close.ts',
            'scripts/chatgpt-browser-turn/contracts.ts',
            'scripts/vitest-ci-lanes.config.json',
          ].sort();
          for (const mode of ['none','actual']) {
            const topology = buildHeavyTopology(process.cwd(), mode === 'actual' ? {changedFiles} : {});
            if (!topology.ok) throw new Error(topology.errors.join('; '));
            const plan = resolvePreTopologyMeasurementPlan(topology, {maxFiles:Number.MAX_SAFE_INTEGER});
            console.log(mode + '_raw_unresolved=' + topology.topology.unresolvedGuardWeights.length);
            console.log(mode + '_targets=' + plan.targets.length);
            console.log(mode + '_target_files=' + JSON.stringify(plan.targets));
          }
          NODE
