name: tmp-issue-1384-ac12-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture:
    name: AC12 fixture exact head
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR 1398 head
        uses: actions/checkout@v4
        with:
          repository: chetwerikoff/orchestrator-pack
          ref: 22ab2edfd24a737c72a42f8df141bb8cbab36222
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run exact fixture
        shell: pwsh
        run: |
          git config user.name 'fixture-smoke'
          git config user.email 'fixture-smoke@example.invalid'
          node scripts/lib/vitest-runtime-history-merge.fixture.mjs
          $code = $LASTEXITCODE
          Write-Host "fixture_exit=$code"
          exit $code
