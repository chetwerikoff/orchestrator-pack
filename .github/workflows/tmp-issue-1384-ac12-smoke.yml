name: tmp-issue-1384-ac12-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture:
    name: PR1398 exact fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR 1398 head
        uses: actions/checkout@v4
        with:
          repository: chetwerikoff/orchestrator-pack
          ref: 90aaf5d0e1c0c896fab3824931b4ea3eed872fd6
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run exact fixture
        shell: bash
        run: |
          git config user.name fixture-smoke
          git config user.email fixture-smoke@example.invalid
          set +e
          node scripts/lib/vitest-runtime-history-merge.fixture.mjs
          code=$?
          echo "fixture_exit=$code"
          exit "$code"
