name: tmp-issue-1384-ac12-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture:
    name: AC12 fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Diagnose historical replay
        shell: bash
        run: |
          git config user.name 'fixture-smoke'
          git config user.email 'fixture-smoke@example.invalid'
          echo '--- three-dot changed paths ---'
          git diff --name-only 6e9614d0c9ce0c34b41a731059df4398b770c162...de03343f3f71f0c673157e055bf47f62700a576b --
          git fetch origin 46577050ac1725f689ee067a399ae7855852a0e2
          rm -rf /tmp/pr1376-merge
          git worktree add --detach /tmp/pr1376-merge 46577050ac1725f689ee067a399ae7855852a0e2
          rm -rf /tmp/pr1376-rebuilt
          git worktree add --detach /tmp/pr1376-rebuilt 6e9614d0c9ce0c34b41a731059df4398b770c162
          git -C /tmp/pr1376-rebuilt merge --no-commit --no-ff de03343f3f71f0c673157e055bf47f62700a576b
          echo "exact_tree=$(git -C /tmp/pr1376-merge rev-parse HEAD^{tree})"
          echo "rebuilt_tree=$(git -C /tmp/pr1376-rebuilt write-tree)"
          node --input-type=module <<'NODE'
          import { buildHeavyTopology } from './scripts/lib/vitest-heavy-topology.mjs';
          const variants = [
            ['exact-full', '/tmp/pr1376-merge', {}],
            ['rebuilt-full', '/tmp/pr1376-rebuilt', {}],
            ['rebuilt-actual-changed', '/tmp/pr1376-rebuilt', {changedFiles:[
              '.cursor/rules/flow-manager-browser-turn-monitoring.mdc',
              'docs/declarations/1266.pr-scope.json',
              'package.json',
              'scripts/browser-gpt-post-settlement-close-proof.ts',
              'scripts/browser-gpt-post-settlement-close.test.ts',
              'scripts/browser-gpt-post-settlement-close.ts',
              'scripts/chatgpt-browser-turn/contracts.ts',
              'scripts/vitest-ci-lanes.config.json',
            ]}],
          ];
          for (const [name, root, opts] of variants) {
            const result = buildHeavyTopology(root, opts);
            console.log(name, JSON.stringify({ok:result.ok, unresolved:result.ok?result.topology.unresolvedGuardWeights.length:null, discovered:result.ok?result.discovered.length:null, errors:result.errors??null}));
          }
          NODE
          git worktree remove --force /tmp/pr1376-merge
          git -C /tmp/pr1376-rebuilt merge --abort || true
          git worktree remove --force /tmp/pr1376-rebuilt
      - name: Run fixture
        shell: bash
        run: |
          set +e
          node scripts/lib/vitest-runtime-history-merge.fixture.mjs
          code=$?
          echo "fixture_exit=${code}"
          exit "${code}"
