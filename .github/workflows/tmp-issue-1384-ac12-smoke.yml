name: tmp-issue-1384-ac12-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose tuple refusal bytes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR 1398 head
        uses: actions/checkout@v4
        with:
          repository: chetwerikoff/orchestrator-pack
          ref: 9a371f03767af4be4104797f535db6913d6fda06
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose subprocess output
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { runProcessSync } from './scripts/kernel/subprocess.ts';
          const dir = join(tmpdir(), 'tuple-diagnostic');
          mkdirSync(dir, {recursive:true});
          const history = join(dir, 'history.json');
          writeFileSync(history, '{"sentinel":"unchanged"}\n');
          const result = runProcessSync({
            command:'pwsh',
            args:['-NoProfile','-NonInteractive','-File',join(process.cwd(),'scripts/refresh-vitest-runtime-history.ps1'),'-ReportsDir',join(dir,'heavy'),'-CommitSha','deadbeef','-RepoRoot',dir,'-HistoryPath',history,'-CommitBack','-SupplementalReportsDir',join(dir,'supplemental')],
            encoding:'utf8', inheritParentEnv:true, timeoutMs:30000,
          });
          console.log('exit=' + result.exitCode);
          console.log('stdout_json=' + JSON.stringify(result.stdout));
          console.log('stderr_json=' + JSON.stringify(result.stderr));
          NODE
