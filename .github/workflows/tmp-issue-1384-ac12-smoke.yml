name: tmp-issue-1384-ac12-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-target:
    name: Normalize PowerShell gutter evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1384-runtime-history-refresh
          fetch-depth: 0
          persist-credentials: true
      - name: Patch and push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/lib/vitest-runtime-history-merge.fixture.mjs')
          s = p.read_text()
          old = "const normalizedOutput = output.replace(/\\u001b\\[[0-9;]*m/g, '').replace(/\\s+/g, ' ');"
          new = "const normalizedOutput = output.replace(/\\u001b\\[[0-9;]*m/g, '').replace(/\\s*\\|\\s*/g, ' ').replace(/\\s+/g, ' ');"
          if old not in s:
            raise SystemExit('normalization anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          node --check scripts/lib/vitest-runtime-history-merge.fixture.mjs
          git config user.name 'chatgpt-ac12-fix'
          git config user.email 'chatgpt-ac12-fix@example.invalid'
          git add scripts/lib/vitest-runtime-history-merge.fixture.mjs
          git commit -m 'Normalize PowerShell diagnostic gutters'
          git push origin HEAD:agent/issue-1384-runtime-history-refresh
