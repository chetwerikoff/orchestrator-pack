name: issue-1352-scanner-census

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/issue-1352-scanner-census' && github.event.pull_request.base.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture corrected scanner JSON and summary
        shell: bash
        run: |
          set -euo pipefail
          scanned_head="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/runtime-retirement/retired-surface-guard.ts')
          text = path.read_text(encoding='utf-8')
          old = "new RegExp(pattern.sourceCommandPattern, 'gmi')"
          new = "new RegExp(pattern.sourceCommandPattern, 'gm')"
          if text.count(old) != 1:
              raise SystemExit(f'unexpected scanner regex compiler count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --experimental-strip-types scripts/runtime-retirement/retired-surface-guard.ts > "$RUNNER_TEMP/runtime-retirement-census.json" || true
          node --input-type=module - "$RUNNER_TEMP/runtime-retirement-census.json" "$scanned_head" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = process.argv[2];
          const scannedHead = process.argv[3];
          const result = JSON.parse(readFileSync(path, 'utf8'));
          const bySurface = Object.entries(result.violations.reduce((acc, row) => {
            acc[row.surfaceId] = (acc[row.surfaceId] ?? 0) + 1;
            return acc;
          }, {})).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          const byPath = Object.entries(result.violations.reduce((acc, row) => {
            acc[row.path] = (acc[row.path] ?? 0) + 1;
            return acc;
          }, {})).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          const summary = {
            scannedHead,
            scannerMode: 'case-sensitive-source-patterns',
            scannedFileCount: result.scannedFileCount,
            violationCount: result.violations.length,
            uniquePathCount: byPath.length,
            bySurface,
            byPath,
          };
          writeFileSync(process.env.RUNNER_TEMP + '/runtime-retirement-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify({ ...summary, byPath: byPath.slice(0, 80) }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1352-runtime-retirement-census
          path: |
            ${{ runner.temp }}/runtime-retirement-census.json
            ${{ runner.temp }}/runtime-retirement-summary.json
          retention-days: 1
