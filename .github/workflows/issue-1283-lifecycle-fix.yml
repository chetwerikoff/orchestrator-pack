name: issue-1283-lifecycle-fix

on:
  pull_request:
    branches:
      - agent/issue-1283-lifecycle-fix-base
    types:
      - opened

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1283-browser-turn-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Correct derived lifecycle inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/chatgpt-browser-turn/tab-lifecycle.test.ts')
          text = path.read_text()
          replacements = {
            "'contexts:browser-contexts:(activeBrowser as any):enumeratePages'": "'contexts:browser-contexts:(activeBrowser as any):recoverCurrentObservation'",
            "'pages:context-pages:context:enumeratePages'": "'pages:context-pages:context:recoverCurrentObservation'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'replacement count {text.count(old)} for {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify correction
        run: |
          git diff --check
          npm test -- --maxWorkers=1 scripts/chatgpt-browser-turn/tab-lifecycle.test.ts scripts/toolchain/chatgpt-browser-turn.review-fixes.test.ts scripts/chatgpt-browser-turn/state-light-turn.test-support.ts
          npm run typecheck:foundation
          npm run lint:foundation
      - name: Repository verification
        shell: pwsh
        run: |
          ./scripts/verify.ps1
          ./scripts/check-reusable.ps1
      - name: Publish verified correction
        run: |
          rm .github/workflows/issue-1283-lifecycle-fix.yml
          git diff --check
          git config user.name "orchestrator-pack implementation bot"
          git config user.email "85295154+chetwerikoff@users.noreply.github.com"
          git add -A
          git commit -m "fix: align derived recovery lifecycle inventory"
          git push origin HEAD:agent/issue-1283-browser-turn-recovery
