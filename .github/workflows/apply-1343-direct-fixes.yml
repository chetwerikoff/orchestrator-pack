name: Apply Issue 1343 direct fixes

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: issue-1343-direct-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 1360 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed implementation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PATCH_REF=e2845033c3a85279b7fd85311b477a0199a5071c
          PAYLOAD_REF=6d2c0c80fe67ce539cb6c442faabd9a9e6f6d43f

          gh api "repos/${REPO}/contents/docs/declarations/1343-fix.patch?ref=${PATCH_REF}" \
            --jq .content | tr -d '\n' | base64 -d > /tmp/1343-fix.patch
          git apply /tmp/1343-fix.patch

          {
            for part in .github/1343-run.part00 .github/1343-run.part01; do
              gh api "repos/${REPO}/contents/${part}?ref=${PAYLOAD_REF}" \
                --jq .content | tr -d '\n' | base64 -d
            done
          } | tr -d '\n' | base64 -d | gzip -d > scripts/worker-smoke-run.ts

          gh api "repos/${REPO}/contents/.github/1343-test.part00?ref=${PAYLOAD_REF}" \
            --jq .content | tr -d '\n' | base64 -d \
            | tr -d '\n' | base64 -d | gzip -d > scripts/worker-smoke.test.ts

          printf '%s  %s\n' \
            '0157c8744ee7aa213f800cffed22e5290cb813ed395b639d0eab358e1f535612' scripts/worker-smoke-run.ts \
            '71a9f25a99bd924b11bdbed6719c28d5faee3825de93636038bca57cb9b51432' scripts/worker-smoke.test.ts \
            | sha256sum -c -

          rm -f scripts/worker-smoke-gate-regression.test.ts
          node --experimental-strip-types --check scripts/worker-smoke-run.ts
          node --experimental-strip-types --check scripts/worker-smoke.test.ts

      - name: Amend live Issue to r06
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue view 1343 --repo "$REPO" --json body --jq .body > /tmp/issue-1343.md
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/issue-1343.md')
          body = path.read_text(encoding='utf-8')
          if '<!-- source-revision: r05 -->' in body:
              body = body.replace('<!-- source-revision: r05 -->', '<!-- source-revision: r06 -->', 1)
          elif '<!-- source-revision: r06 -->' not in body:
              raise SystemExit('unexpected Issue revision marker')

          roots = [
              'docs/declarations/1343.pr-scope.json',
              'docs/worker-smoke-testing.md',
              'scripts/gh-wrapper.test.ts',
              'scripts/lib/gh-inventory-match.mjs',
              'scripts/lib/gh-rest-routes.mjs',
              'scripts/lib/worker-smoke-core-base.ts',
              'scripts/lib/worker-smoke-core.ts',
              'scripts/pack-worker-report.ps1',
              'scripts/worker-smoke-run.ts',
              'scripts/worker-smoke.test.ts',
          ]
          body, count = re.subn(
              r'```allowed-roots\s*\r?\n[\s\S]*?```',
              '```allowed-roots\n' + '\n'.join(roots) + '\n```',
              body,
              count=1,
          )
          if count != 1:
              raise SystemExit('allowed-roots fence not found')

          scope = '''## Files in scope

- `docs/declarations/1343.pr-scope.json` — regenerated declaration for the final r06 path set.
- `docs/worker-smoke-testing.md` — operator-visible publication-order, receipt-witness, and final re-census semantics.
- `scripts/lib/worker-smoke-core-base.ts` and `scripts/lib/worker-smoke-core.ts` — canonical report primitives, same-head fold, and admitted current-head receipt-witness selection.
- `scripts/worker-smoke-run.ts` — trusted target acquisition, canonical closing grammar, exhaustive census, receipt witness validation, and immediate pre-allow re-census.
- `scripts/pack-worker-report.ps1` — byte-exact Issue-body handoff and explicit repository binding.
- `scripts/lib/gh-inventory-match.mjs` and `scripts/lib/gh-rest-routes.mjs` — inventory-approved authenticated-principal and exhaustive comment-census reads.
- `scripts/worker-smoke.test.ts` and `scripts/gh-wrapper.test.ts` — production-shaped caller, receipt inversion, final census, closing grammar, malformed BLOCKED, lifecycle, real 64 KiB, and inventory regressions.'''
          body, count = re.subn(
              r'## Files in scope\n[\s\S]*?\n\nNot every listed path must change\.',
              scope + '\n\nNot every listed path must change.',
              body,
              count=1,
          )
          if count != 1:
              raise SystemExit('Files in scope section not found')

          old_receipt = ('The existing singular local receipt remains unchanged and may continue to verify the current '
                         'publication or legacy one-run path where existing behavior uses it. It is not authority for '
                         'historical cross-run contributors and does not order aggregate evidence.')
          new_receipt = ('The singular local receipt storage and overwrite behavior remains unchanged. At the final gate '
                         'it may witness any admitted current-head publication still represented by the stabilized census; '
                         'it does not select fold order, replace GitHub publication order, or attest historical contributors.')
          if old_receipt in body:
              body = body.replace(old_receipt, new_receipt, 1)
          elif new_receipt not in body:
              raise SystemExit('receipt authority paragraph not found')

          old_snapshot = ('A gate invocation must establish a bounded stable high-water snapshot immediately before returning '
                          'allow. If a relevant comment appears or the high-water changes while the snapshot is being finalized, '
                          'the gate re-evaluates from a complete census or returns a non-accepting autonomous admission result '
                          'when stabilization cannot be established within the bounded attempt. It must never allow from a '
                          'snapshot already observed to be stale.')
          new_snapshot = ('A gate invocation first establishes a bounded stable high-water snapshot. After runtime readiness, '
                          'required CI, and receipt/provenance checks, it performs one immediate complete re-census before allow; '
                          'the final head and comment digest must still match the stabilized authority snapshot. Any changed '
                          'head or census is denied and belongs to a fresh evaluation. It must never allow from a snapshot '
                          'already observed to be stale.')
          if old_snapshot in body:
              body = body.replace(old_snapshot, new_snapshot, 1)
          elif new_snapshot not in body:
              raise SystemExit('snapshot authority paragraph not found')

          old_bullet = ('- Existing current-publication receipt behavior remains unchanged, but the receipt is not historical '
                        'aggregate authority.')
          new_bullet = ('- Receipt storage/overwrite behavior remains unchanged; final admission may use it only as a terminal '
                        'and provenance witness for an admitted current-head publication, never as aggregate ordering authority.')
          if old_bullet in body:
              body = body.replace(old_bullet, new_bullet, 1)
          elif new_bullet not in body:
              raise SystemExit('receipt boundary bullet not found')

          path.write_text(body, encoding='utf-8')
          PY
          gh issue edit 1343 --repo "$REPO" --body-file /tmp/issue-1343.md

      - name: Generate declaration and verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          npm ci --include=dev
          gh issue view 1343 --repo "$REPO" --json body --jq .body > /tmp/issue-1343-r06.md
          grep -q '<!-- source-revision: r06 -->' /tmp/issue-1343-r06.md
          node --experimental-strip-types scripts/pr-scope-declaration.ts \
            --issue 1343 \
            --issue-body-file /tmp/issue-1343-r06.md \
            --declared-paths docs/worker-smoke-testing.md,scripts/gh-wrapper.test.ts,scripts/lib/gh-inventory-match.mjs,scripts/lib/gh-rest-routes.mjs,scripts/lib/worker-smoke-core.ts,scripts/pack-worker-report.ps1,scripts/worker-smoke-run.ts,scripts/worker-smoke.test.ts \
            --output docs/declarations/1343.pr-scope.json

          npm run check:node-major --silent
          node scripts/run-vitest-with-harness.mjs run --maxWorkers=1 \
            scripts/worker-smoke.test.ts scripts/gh-wrapper.test.ts
          npm run typecheck:foundation
          npm run lint:foundation
          pwsh ./scripts/check-ci-pipeline-split.ps1
          pwsh ./scripts/lint-self-architect.ps1 -Strict -BaseRef origin/main -HeadRef HEAD

      - name: Publish clean final commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-1343-direct-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix all worker-smoke aggregate review findings'
          git fetch origin main
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(docs/declarations/1343\.pr-scope\.json|docs/worker-smoke-testing\.md|scripts/gh-wrapper\.test\.ts|scripts/lib/gh-inventory-match\.mjs|scripts/lib/gh-rest-routes\.mjs|scripts/lib/worker-smoke-core\.ts|scripts/pack-worker-report\.ps1|scripts/worker-smoke-run\.ts|scripts/worker-smoke\.test\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected final PR paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
