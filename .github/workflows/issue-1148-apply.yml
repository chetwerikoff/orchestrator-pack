name: Issue 1148 apply tested CI fixes

on:
  push:
    branches:
      - agent/issue-1148-message-identity
    paths:
      - .issue-1148-fix/**
      - .github/workflows/issue-1148-apply.yml

permissions:
  contents: write

jobs:
  apply-tested-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1148-message-identity
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact patch
        run: python .issue-1148-fix/apply.py

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run focused regressions
        run: >-
          node scripts/run-vitest-with-harness.mjs run --maxWorkers=1
          scripts/chatgpt-browser-turn/state-light-page-observation.test.ts
          scripts/stage-completeness-guard.test.ts

      - name: Validate diff
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/issue-1148-materialize.yml || true

      - name: Commit tested changes and remove temporary files
        run: |
          rm -rf .issue-1148-fix
          rm -f .github/workflows/issue-1148-apply.yml
          rm -f .github/workflows/issue-1148-ci-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(browser-turn): align identity fallback regressions'
          git push origin HEAD:agent/issue-1148-message-identity
