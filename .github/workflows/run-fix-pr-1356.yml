name: Run PR 1356 fix workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/issue-1341-operator-inputs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1341-operator-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and verify PR 1356 fixes
        shell: bash
        run: |
          npm ci
          sed -i "s#/bound snapshot does not match authoritative review context/#/authoritative bound Issue snapshot missing/#" .github/pr1356-fix.py
          python3 .github/pr1356-fix.py
