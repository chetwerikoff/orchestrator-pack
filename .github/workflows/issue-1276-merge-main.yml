name: Issue 1276 merge main

on:
  push:
    branches:
      - chetwerikoff/issue-1276
    paths:
      - .github/workflows/issue-1276-merge-main.yml

permissions:
  contents: write

jobs:
  merge-main:
    if: github.repository == 'chetwerikoff/orchestrator-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chetwerikoff/issue-1276
      - name: Merge current main with bounded conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'main already merged'
            exit 0
          fi

          mkdir -p .git/info
          cat > .git/info/attributes <<'ATTRS'
          scripts/pack-review-runner-gpt.test.ts merge=union
          scripts/worker-smoke.test.ts merge=union
          ATTRS

          set +e
          git merge --no-ff --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t unmerged < <(git diff --name-only --diff-filter=U)
            for path in "${unmerged[@]}"; do
              case "$path" in
                scripts/lib/pack-review-run-store.ts|scripts/pack-review-runner.ts)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "unexpected unresolved path: $path" >&2
                  exit 1
                  ;;
              esac
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'unresolved merge conflicts remain' >&2
              exit 1
            fi
            git commit --no-edit
          fi

          git push origin HEAD:chetwerikoff/issue-1276
