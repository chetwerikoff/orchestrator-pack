name: issue-1111-doc-finalize

on:
  push:
    branches:
      - agent/issue-1111-pack-gpt-pr-entrypoint

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[issue-1111-doc-finalize]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1111-pack-gpt-pr-entrypoint
          fetch-depth: 0

      - name: Append verified migration note and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          source_path='docs/migration_notes.md'
          workflow_path='.github/workflows/issue-1111-doc-finalize.yml'
          expected_source_blob='76b98d9b0fcd50fff3fda70369be0fabfa05f494'
          expected_final_blob='d7271fe7ef7abb265cf7f0c90029d823cda83153'

          actual_source_blob="$(git hash-object "${source_path}")"
          test "${actual_source_blob}" = "${expected_source_blob}" || {
            echo "source blob drift: expected ${expected_source_blob}, got ${actual_source_blob}" >&2
            exit 1
          }

          prefix="$(mktemp)"
          output="$(mktemp)"
          trap 'rm -f "${prefix}" "${output}"' EXIT
          cat > "${prefix}" <<'EOF'
          ## 2026-07-31 — Canonical Browser-GPT PR-number pack review (Issue #1111)

          ### Rollout:

          1. Pull the merged pack into the canonical operator checkout.
          2. Keep the existing Browser-GPT profile, CDP, and chat/project prerequisites from `docs/reviewer-switch-runbook.md`; no persistent `PACK_REVIEWER` change or AO restart is required for one invocation.
          3. Run `npm run pack-gpt-review -- --pr-number <PR_NUMBER>` from the repository root. Do not supply or cache a head SHA; the command resolves and validates the live `OPEN` PR head before Browser-GPT engagement.
          4. Keep the command foregrounded. A newly admitted run emits one stderr start indication with PR, full head, run ID, and timeout, then returns the existing runner’s terminal JSON on stdout.
          5. Treat non-zero `review_not_started` as proof that this invocation did not execute GPT. Inspect `runnerReason`; do not force, clear, or bypass active/terminal same-head reuse or start-claim arbitration.
          6. Trust results only for the head bound by the runner. The existing post-review live-head guard and GitHub publication path remain authoritative.

          ### Rollback

          Revert the Issue #1111 command, runner, focused-test, and documentation changes, then recycle only sessions that must reload tracked files. Do not delete or rewrite pack-review store state, start claims, Browser-GPT transport state, or GitHub review/status history. No daemon shutdown, store migration, or recovery ceremony is required solely for rollback.

          EOF
          cat "${prefix}" "${source_path}" > "${output}"
          mv "${output}" "${source_path}"

          actual_final_blob="$(git hash-object "${source_path}")"
          test "${actual_final_blob}" = "${expected_final_blob}" || {
            echo "final blob mismatch: expected ${expected_final_blob}, got ${actual_final_blob}" >&2
            exit 1
          }

          git rm "${workflow_path}"
          git add "${source_path}"
          test "$(git diff --cached --numstat -- "${source_path}")" = $'15\t0\tdocs/migration_notes.md'
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "${workflow_path}"
          test "${changed[1]}" = "${source_path}"

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: add Browser-GPT review rollout notes (#1111)'
          git push origin HEAD:agent/issue-1111-pack-gpt-pr-entrypoint
