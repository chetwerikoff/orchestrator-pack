name: issue-1352-toolchain-checkpoint

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-checkpoint:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply, verify, test, and publish checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue-1352-checkpoint2.py
          npm ci --include=dev
          node --experimental-strip-types scripts/toolchain/check-ts-policy.ts --write-baseline
          npm run typecheck:foundation
          node --experimental-strip-types scripts/toolchain/check-ts-policy.ts
          npx vitest run --maxWorkers=1 plugins/codex-pr-reviewer/tests/reviewer-budget.test.ts scripts/pr-session-binding-cache.test.ts --reporter=dot
          git diff --check
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add docs/pr-session-binding-cache.mjs \
            plugins/codex-pr-reviewer/tests/reviewer-budget.test.ts \
            scripts/gh-wrapper.test.ts \
            scripts/orchestrator-escalation-router.test.ts \
            scripts/pr-session-binding-cache.test.ts \
            scripts/toolchain/raw-child-process-baseline.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'checkpoint already applied'
            exit 0
          fi
          git commit -m 'fix(toolchain): route new child processes through kernel'
          git push origin HEAD:agent/issue-1352-hard-cut
