name: issue-1352-read-delegation-checkpoint

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-checkpoint:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore canonical read-delegation marker and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text(encoding='utf-8')
          old = "Tracked first-party source-code reads already served by a trusted semantic index do\nnot require delegation solely because of size."
          new = "**Cursor index-coverage carve-out (Issue #309).** Tracked first-party source-code reads already\nserved by a trusted semantic index do not require delegation solely because of size."
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('canonical read-delegation paragraph not found')
          PY
          pwsh -NoProfile -File scripts/check-read-delegation-policy-consistency.ps1
          npm ci --include=dev
          npm run lint:foundation
          git diff --check
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add AGENTS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'checkpoint already applied'
            exit 0
          fi
          git commit -m 'fix(policy): restore read delegation carve-out marker'
          git push origin HEAD:agent/issue-1352-hard-cut
