name: issue-1352-checkpoint-carrier

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-checkpoint:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue-1352-carrier.py
          npm ci --include=dev
          npm run typecheck:foundation
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add docs/declarations/1352.pr-scope.json \
            scripts/bound-issue-snapshot-cli.ts \
            scripts/invoke-contract-evidence-reverify.ts \
            scripts/invoke-reviewer-contract-mapping.ts \
            scripts/lib/pack-review-delivery.ts \
            scripts/lib/reverify-bound-issue-snapshot.ts \
            scripts/pr2-foundation/worker-notification-target.ts \
            scripts/pr2-foundation/worker-nudge-claim-store.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'checkpoint already applied'
            exit 0
          fi
          git commit -m 'fix(runtime): finish pack-owned state cutover'
          git push origin HEAD:agent/issue-1352-hard-cut
