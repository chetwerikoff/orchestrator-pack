name: issue-1352-canonical-headings

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-headings:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore canonical headings and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('AGENTS.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '## RTK read exploration': '## RTK read-exploration',
              '## RCA discipline': '## RCA spec discipline',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing canonical heading source: {old}')
          path.write_text(text, encoding='utf-8')
          PY
          npm ci --include=dev
          npm test -- --maxWorkers=1 scripts/gate-runner/declarative.test.ts scripts/gate-runner/goldens.test.ts --reporter=dot
          npm run lint:foundation
          git diff --check
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add AGENTS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'headings already canonical'
            exit 0
          fi
          git commit -m 'fix(policy): restore canonical contract headings'
          git push origin HEAD:agent/issue-1352-hard-cut
