name: issue-1352-small-repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply, verify, and publish small repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue-1352-small-repair.py
          npm ci --include=dev
          npm run typecheck:foundation
          node scripts/check-vitest-live-store-isolation.mjs
          node --experimental-strip-types scripts/toolchain/check-pwsh-test-growth.ts
          npm test -- --maxWorkers=1 scripts/review-start-claim-run-binding.test.ts scripts/review-start-claim.test.ts --reporter=dot
          git diff --check
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add docs/declarations/1352.pr-scope.json \
            docs/review-start-claim-lifecycle.mjs \
            docs/review-start-claim-run-binding.mjs \
            scripts/lib/vitest-live-store-harness.mjs \
            scripts/toolchain/powershell-child-tests.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'repair already applied'
            exit 0
          fi
          git commit -m 'fix(runtime): restore claim and store contracts'
          git push origin HEAD:agent/issue-1352-hard-cut
