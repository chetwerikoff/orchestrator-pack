name: issue-1352-evidence-checkpoint

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-checkpoint:
    if: github.event.pull_request.number == 1378 && github.event.pull_request.head.ref == 'agent/issue-1352-hard-cut'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1352-hard-cut
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Decode, verify, test, and publish checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-1352-checkpoint7.part00 .github/issue-1352-checkpoint7.part01 \
            | tr -d '[:space:]' \
            | base64 -d \
            | gzip -dc > "$RUNNER_TEMP/checkpoint.patch"
          echo '561fa59be719e3b3a6a4af9e48bd486e111a32d7e23579be3e23946e106f9fab  '"$RUNNER_TEMP/checkpoint.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/checkpoint.patch"
          git apply "$RUNNER_TEMP/checkpoint.patch"
          python - <<'PY'
          import json
          from pathlib import Path

          fixture_path = Path('scripts/gate-runner/custom/bulk-cli-parity.test.ts')
          fixture = fixture_path.read_text(encoding='utf-8')
          fixture_old = "writeFixture(join(root, 'plugins/scope-guard/README.md'), 'DD-024 runtime guard git add commit PR-level CI second line\\n');"
          fixture_new = "writeFixture(join(root, 'plugins/ao-scope-guard/README.md'), 'DD-024 runtime guard git add commit PR-level CI second line\\n');"
          if fixture.count(fixture_old) != 1:
              raise SystemExit(f'unexpected frozen replay fixture count: {fixture.count(fixture_old)}')
          fixture = fixture.replace(fixture_old, fixture_new, 1)

          review_fixture_old = "writeFixture(join(root, 'agent-orchestrator.yaml.example'), 'NAMED REVIEW_COMMAND\\n  pwsh .orchestrator-pack/review.ps1\\n  RUNTIME\\n');"
          review_fixture_new = "writeFixture(join(root, 'agent-orchestrator.yaml.example'), 'NAMED REVIEW_COMMAND\\n  pwsh .ao/review.ps1\\n  RUNTIME\\n');"
          if fixture.count(review_fixture_old) != 2:
              raise SystemExit(f'unexpected review-command replay fixture count: {fixture.count(review_fixture_old)}')
          review_fixture_index = fixture.rfind(review_fixture_old)
          fixture = fixture[:review_fixture_index] + review_fixture_new + fixture[review_fixture_index + len(review_fixture_old):]
          fixture_path.write_text(fixture, encoding='utf-8')

          capture_path = Path('scripts/gate-runner/goldens/wave-3b-pre-delete-captures.json')
          capture = capture_path.read_text(encoding='utf-8')
          capture_old = '[PASS] plugins/scope-guard/README.md - contract markers present\\n'
          capture_new = '[PASS] plugins/ao-scope-guard/README.md - contract markers present\\n'
          if capture.count(capture_old) != 1:
              raise SystemExit(f'unexpected frozen replay output count: {capture.count(capture_old)}')
          capture = capture.replace(capture_old, capture_new, 1)
          capture_data = json.loads(capture)
          review_captures = [
              item for item in capture_data['captures']
              if item.get('case') == 'negative-gitignored-review-command'
          ]
          if len(review_captures) != 1:
              raise SystemExit(f'unexpected negative review-command capture count: {len(review_captures)}')
          review_capture = review_captures[0]
          review_capture['stdout'] = '[FAIL] Canonical REVIEW_COMMAND must not use gitignored .ao/ paths\n  REVIEW_COMMAND: pwsh .ao/review.ps1\n'
          review_capture['parityDisposition'] = 'The frozen PowerShell replay remains bound to its historical .ao/ predicate and output; the replacement TypeScript gate intentionally reports the current .orchestrator-pack/ violation through expectedRunnerStdout.'
          capture_path.write_text(json.dumps(capture_data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          npm ci --include=dev
          npm run typecheck:foundation
          npm run lint:foundation
          npm run gate-runner-selftest
          npm test -- --maxWorkers=1 \
            scripts/launch-argv-registry.test.ts \
            scripts/json-producers/generate-capture-manifest.test.ts \
            --reporter=dot
          git diff --check
          git config user.name chetwerikoff
          git config user.email 85295154+chetwerikoff@users.noreply.github.com
          git add \
            docs/declarations/1352.pr-scope.json \
            docs/launch-argv-registry.mjs \
            scripts/gate-runner/bulk-declarative-gates.ts \
            scripts/gate-runner/census.test.ts \
            scripts/gate-runner/census.ts \
            scripts/gate-runner/census/generation.json \
            scripts/gate-runner/census/pre-change-baseline.json \
            scripts/gate-runner/census/wave-3b-migration-inventory.json \
            scripts/gate-runner/custom/bulk-cli-parity.test.ts \
            scripts/gate-runner/declarative.ts \
            scripts/gate-runner/goldens/wave-3b-pre-delete-captures.json \
            scripts/gate-runner/wave-3b-migration-inventory.ts \
            scripts/launch-argv-inventory.json \
            scripts/launch-argv-validators.manifest.json \
            scripts/lib/Ci-Red-Watchdog-Worker.ps1 \
            scripts/lib/Worker-NudgeClaim.ps1 \
            scripts/verify.ps1 \
            tests/external-output-references/capture-manifest.json
          git diff --cached --check
          git commit -m 'fix(runtime): reconcile hard-cut gate evidence'
          git push origin HEAD:agent/issue-1352-hard-cut
