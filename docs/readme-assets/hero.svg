<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">orchestrator-pack</title>
  <desc id="desc">A role-separated, ChatGPT-centered control plane. Operator intent goes first to an architect, may optionally pass through an adversarial challenge of the draft with GPT, and only then enters orchestrator and manager supervision. Task creation moves through GPT authoring and independent reviews to an accepted GitHub Issue; tracked GPT turns wake their owning workflow on completion or error.</desc>

  <rect width="1200" height="500" rx="28" fill="#09090b"/>
  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#27272a" stroke-width="2"/>

  <g transform="translate(56 48)">
    <text x="0" y="0" fill="#a1a1aa" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.7">ROLE-SEPARATED · GPT-CENTERED · RUNTIME-NEUTRAL</text>
    <text x="0" y="70" fill="#fafafa" font-size="58" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">orchestrator-pack</text>
    <text x="0" y="112" fill="#d4d4d8" font-size="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Governed work from brief to verified delivery.</text>

    <line x1="0" y1="146" x2="480" y2="146" stroke="#3f3f46"/>

    <text x="0" y="184" fill="#a1a1aa" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Orchestrator keeps whole-task continuity.</text>
    <text x="0" y="214" fill="#a1a1aa" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Manager owns resumable workflows.</text>
    <text x="0" y="244" fill="#a1a1aa" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Tracked GPT turns wake owners on end / error.</text>

    <text x="0" y="292" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">ROLE SYSTEM</text>

    <g transform="translate(0 310)">
      <rect x="0" y="0" width="112" height="36" rx="18" fill="#18181b" stroke="#3f3f46"/>
      <text x="56" y="23" text-anchor="middle" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ARCHITECT</text>

      <rect x="122" y="0" width="148" height="36" rx="18" fill="#18181b" stroke="#52525b"/>
      <text x="196" y="23" text-anchor="middle" fill="#fafafa" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ORCHESTRATOR</text>

      <rect x="280" y="0" width="104" height="36" rx="18" fill="#18181b" stroke="#52525b"/>
      <text x="332" y="23" text-anchor="middle" fill="#fafafa" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MANAGER</text>

      <rect x="0" y="48" width="92" height="36" rx="18" fill="#18181b" stroke="#3f3f46"/>
      <text x="46" y="71" text-anchor="middle" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WORKER</text>

      <rect x="102" y="48" width="104" height="36" rx="18" fill="#18181b" stroke="#3f3f46"/>
      <text x="154" y="71" text-anchor="middle" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REVIEWER</text>
    </g>

    <text x="0" y="426" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">distinct ownership · shared evidence · no role collapse</text>
  </g>

  <g transform="translate(610 30)">
    <text x="0" y="0" fill="#71717a" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">CONTROL FLOW</text>

    <!-- Operator -> Architect -> optional adversarial GPT challenge -->
    <g transform="translate(0 20)">
      <rect x="0" y="0" width="102" height="56" rx="11" fill="#18181b" stroke="#52525b"/>
      <text x="51" y="24" text-anchor="middle" fill="#fafafa" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">OPERATOR</text>
      <text x="51" y="43" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">intent</text>

      <line x1="102" y1="28" x2="124" y2="28" stroke="#71717a" stroke-width="2"/>
      <path d="M118 22 L124 28 L118 34" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="126" y="0" width="118" height="56" rx="11" fill="#18181b" stroke="#71717a"/>
      <text x="185" y="24" text-anchor="middle" fill="#fafafa" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">ARCHITECT</text>
      <text x="185" y="43" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">draft / spec</text>

      <line x1="244" y1="28" x2="266" y2="28" stroke="#71717a" stroke-width="2"/>
      <path d="M260 22 L266 28 L260 34" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="268" y="0" width="256" height="68" rx="11" fill="#18181b" stroke="#a1a1aa" stroke-dasharray="5 4"/>
      <text x="396" y="21" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">ADVERSARIAL CHALLENGE</text>
      <text x="396" y="39" text-anchor="middle" fill="#e4e4e7" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">OF A DRAFT WITH GPT</text>
      <text x="396" y="57" text-anchor="middle" fill="#71717a" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">(OPTIONAL)</text>
    </g>

    <!-- Orchestration begins only after the pre-orchestration draft stages -->
    <path d="M396 88 V98 H227 V112" fill="none" stroke="#71717a" stroke-width="2"/>
    <path d="M221 106 L227 112 L233 106" fill="none" stroke="#71717a" stroke-width="2"/>

    <g transform="translate(0 112)">
      <rect x="142" y="0" width="170" height="56" rx="11" fill="#18181b" stroke="#a1a1aa"/>
      <text x="227" y="24" text-anchor="middle" fill="#fafafa" font-size="17" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">ORCHESTRATOR</text>
      <text x="227" y="43" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">continuity / recovery</text>

      <line x1="312" y1="28" x2="334" y2="28" stroke="#71717a" stroke-width="2"/>
      <path d="M328 22 L334 28 L328 34" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="336" y="0" width="188" height="56" rx="11" fill="#18181b" stroke="#a1a1aa"/>
      <text x="430" y="24" text-anchor="middle" fill="#fafafa" font-size="17" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">MANAGER</text>
      <text x="430" y="43" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resumable workflow</text>
    </g>

    <path d="M430 168 V176 H364 V184" fill="none" stroke="#71717a" stroke-width="2"/>
    <path d="M358 178 L364 184 L370 178" fill="none" stroke="#71717a" stroke-width="2"/>

    <g transform="translate(204 184)">
      <rect width="320" height="60" rx="12" fill="#18181b" stroke="#d4d4d8"/>
      <text x="160" y="25" text-anchor="middle" fill="#fafafa" font-size="20" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">TRACKED CHATGPT TURN</text>
      <text x="160" y="46" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">invocation · envelope · recover · wake</text>
    </g>

    <path d="M524 214 H544 V174 H486 V168" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M480 174 L486 168 L492 174" fill="none" stroke="#71717a" stroke-width="1.5"/>

    <text x="0" y="274" fill="#71717a" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">TASK CREATION</text>
    <text x="0" y="302" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BRIEF  &gt;  GPT AUTHOR  &gt;  INDEPENDENT REVIEWS</text>
    <text x="0" y="326" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DISPOSITION  &gt;  TERMINAL REVIEW  &gt;  ACCEPTED ISSUE</text>
    <text x="0" y="350" fill="#71717a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tiered topology · substantive floor · live GitHub authority</text>

    <line x1="0" y1="372" x2="524" y2="372" stroke="#3f3f46"/>

    <text x="0" y="400" fill="#71717a" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">DURABLE AUTHORITY + EXECUTION</text>

    <g transform="translate(0 416)">
      <rect x="0" y="0" width="250" height="48" rx="12" fill="#18181b" stroke="#52525b"/>
      <text x="18" y="21" fill="#fafafa" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">GITHUB EVIDENCE</text>
      <text x="18" y="38" fill="#a1a1aa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Issue · PR head · review · CI · smoke</text>

      <line x1="250" y1="24" x2="276" y2="24" stroke="#71717a" stroke-width="2"/>
      <path d="M270 18 L276 24 L270 30" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="278" y="0" width="246" height="48" rx="12" fill="#18181b" stroke="#52525b"/>
      <text x="296" y="21" fill="#fafafa" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">RUNTIME / WORKERS</text>
      <text x="296" y="38" fill="#a1a1aa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">declared scope · exact runtime identity</text>
    </g>
  </g>
</svg>
