<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">orchestrator-pack</title>
  <desc id="desc">A role-separated, ChatGPT-centered control plane. The first row flows from User to Architect to Orchestrator to Managers. Tracked GPT Turns sit below Managers, with a return path that wakes the owning manager workflow on completion or recovery. Task creation moves through GPT authoring and independent reviews to an accepted GitHub Issue.</desc>

  <rect width="1200" height="500" rx="28" fill="#09090b"/>
  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#27272a" stroke-width="2"/>

  <g transform="translate(56 48)">
    <text x="0" y="0" fill="#a1a1aa" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.7">ROLE-SEPARATED · GPT-CENTERED · RUNTIME-NEUTRAL</text>
    <text x="0" y="70" fill="#fafafa" font-size="58" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">orchestrator-pack</text>
    <text x="0" y="112" fill="#d4d4d8" font-size="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Governed work from brief to verified delivery.</text>

    <line x1="0" y1="146" x2="480" y2="146" stroke="#3f3f46"/>

    <text x="0" y="184" fill="#a1a1aa" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Orchestrator keeps whole-task continuity.</text>
    <text x="0" y="214" fill="#a1a1aa" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Managers own resumable workflows.</text>
    <text x="0" y="244" fill="#a1a1aa" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Tracked GPT turns wake owners on end / error.</text>

    <text x="0" y="292" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">ROLE SYSTEM</text>

    <g transform="translate(0 310)">
      <rect x="0" y="0" width="112" height="36" rx="18" fill="#18181b" stroke="#3f3f46"/>
      <text x="56" y="23" text-anchor="middle" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ARCHITECT</text>

      <rect x="122" y="0" width="148" height="36" rx="18" fill="#18181b" stroke="#52525b"/>
      <text x="196" y="23" text-anchor="middle" fill="#fafafa" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ORCHESTRATOR</text>

      <rect x="280" y="0" width="104" height="36" rx="18" fill="#18181b" stroke="#52525b"/>
      <text x="332" y="23" text-anchor="middle" fill="#fafafa" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MANAGERS</text>

      <rect x="0" y="48" width="92" height="36" rx="18" fill="#18181b" stroke="#3f3f46"/>
      <text x="46" y="71" text-anchor="middle" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WORKER</text>

      <rect x="102" y="48" width="104" height="36" rx="18" fill="#18181b" stroke="#3f3f46"/>
      <text x="154" y="71" text-anchor="middle" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REVIEWER</text>

      <rect x="216" y="48" width="128" height="36" rx="18" fill="#18181b" stroke="#3f3f46"/>
      <text x="280" y="71" text-anchor="middle" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FIREFIGHTER</text>
    </g>

    <text x="0" y="426" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">distinct ownership · shared evidence · no role collapse</text>
  </g>

  <g transform="translate(610 30)">
    <text x="0" y="0" fill="#71717a" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">CONTROL FLOW</text>

    <!-- Row 1: User -> Architect -> Orchestrator -> Managers -->
    <g transform="translate(0 20)">
      <rect x="0" y="0" width="96" height="56" rx="11" fill="#18181b" stroke="#52525b"/>
      <text x="48" y="24" text-anchor="middle" fill="#fafafa" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">USER</text>
      <text x="48" y="43" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">intent</text>

      <line x1="96" y1="28" x2="116" y2="28" stroke="#71717a" stroke-width="2"/>
      <path d="M110 22 L116 28 L110 34" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="118" y="0" width="108" height="56" rx="11" fill="#18181b" stroke="#71717a"/>
      <text x="172" y="24" text-anchor="middle" fill="#fafafa" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">ARCHITECT</text>
      <text x="172" y="43" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">draft / spec</text>

      <line x1="226" y1="34" x2="246" y2="34" stroke="#71717a" stroke-width="2"/>
      <path d="M240 28 L246 34 L240 40" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="248" y="0" width="146" height="56" rx="11" fill="#18181b" stroke="#a1a1aa"/>
      <text x="321" y="24" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">ORCHESTRATOR</text>
      <text x="321" y="43" text-anchor="middle" fill="#a1a1aa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">continuity / recovery</text>

      <line x1="394" y1="34" x2="414" y2="34" stroke="#71717a" stroke-width="2"/>
      <path d="M408 28 L414 34 L408 40" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="416" y="0" width="108" height="56" rx="11" fill="#18181b" stroke="#a1a1aa"/>
      <text x="470" y="24" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">MANAGERS</text>
      <text x="470" y="43" text-anchor="middle" fill="#a1a1aa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">workflows</text>

      <!-- Feedback: Managers -> Orchestrator -->
      <path d="M416 22 H396" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 5"/>
      <path d="M402 16 L396 22 L402 28" fill="none" stroke="#71717a" stroke-width="1.5"/>

      <!-- Feedback: Orchestrator -> Architect -->
      <path d="M248 22 H228" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 5"/>
      <path d="M234 16 L228 22 L234 28" fill="none" stroke="#71717a" stroke-width="1.5"/>
    </g>

    <!-- Managers own tracked GPT turns -->
    <path d="M470 76 V96 H262 V108" fill="none" stroke="#71717a" stroke-width="2"/>
    <path d="M256 102 L262 108 L268 102" fill="none" stroke="#71717a" stroke-width="2"/>

    <g transform="translate(102 108)">
      <rect width="320" height="60" rx="12" fill="#18181b" stroke="#d4d4d8"/>
      <text x="160" y="25" text-anchor="middle" fill="#fafafa" font-size="20" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">TRACKED GPT TURNS</text>
      <text x="160" y="46" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">invocation · envelope · recover · wake</text>
    </g>

    <!-- Completion/recovery wakes the owning manager workflow -->
    <path d="M422 138 H450 V76" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M444 82 L450 76 L456 82" fill="none" stroke="#71717a" stroke-width="1.5"/>

    <text x="0" y="208" fill="#71717a" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">TASK CREATION</text>
    <text x="0" y="236" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BRIEF  &gt;  GPT AUTHOR  &gt;  INDEPENDENT REVIEWS</text>
    <text x="0" y="260" fill="#e4e4e7" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DISPOSITION  &gt;  TERMINAL REVIEW  &gt;  ACCEPTED ISSUE</text>
    <text x="0" y="284" fill="#71717a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tiered topology · substantive floor · live GitHub authority</text>

    <line x1="0" y1="310" x2="524" y2="310" stroke="#3f3f46"/>

    <text x="0" y="338" fill="#71717a" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.4">DURABLE AUTHORITY + EXECUTION</text>

    <g transform="translate(0 356)">
      <rect x="0" y="0" width="250" height="78" rx="12" fill="#18181b" stroke="#52525b"/>
      <text x="18" y="27" fill="#fafafa" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">GITHUB EVIDENCE</text>
      <text x="18" y="50" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Issue · PR head · review · CI</text>
      <text x="18" y="67" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">smoke · merge state</text>

      <line x1="250" y1="39" x2="276" y2="39" stroke="#71717a" stroke-width="2"/>
      <path d="M270 33 L276 39 L270 45" fill="none" stroke="#71717a" stroke-width="2"/>

      <rect x="278" y="0" width="246" height="78" rx="12" fill="#18181b" stroke="#52525b"/>
      <text x="296" y="27" fill="#fafafa" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">RUNTIME / WORKERS</text>
      <text x="296" y="50" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">declared scope</text>
      <text x="296" y="67" fill="#a1a1aa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ runtime, id, generation }</text>
    </g>
  </g>
</svg>
